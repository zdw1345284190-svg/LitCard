<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>人生卡壳，翻翻名册 · 智慧典籍卡片</title>
    <style>
        :root {
            --bg-from: #f5f0e8;
            --bg-via: #efe8dc;
            --bg-to: #e8dfd0;
            --text-title: #1a1008;
            --text-sub: #5c4a36;
            --text-counter: #9e8b78;
            --btn-text: #fdf8f0;
            --theme-r: 180;
            --theme-g: 35;
            --theme-b: 35;
            --card-bg-r: 255;
            --card-bg-g: 248;
            --card-bg-b: 240;
            --card-bg-alpha: 1;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            background: linear-gradient(160deg, var(--bg-from) 0%, var(--bg-via) 40%, var(--bg-to) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            transition: background 0.8s ease;
        }

        .bg-orb {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            filter: blur(90px);
            transition: background 0.8s ease;
        }
        .bg-orb--top {
            width: 480px;
            height: 480px;
            background: radial-gradient(circle, rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.3) 0%, transparent 70%);
            top: -200px;
            right: -140px;
            opacity: 0.4;
        }
        .bg-orb--bottom {
            width: 360px;
            height: 360px;
            background: radial-gradient(circle, rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.25) 0%, transparent 70%);
            bottom: -160px;
            left: -120px;
            opacity: 0.35;
        }
        .bg-orb--mid {
            width: 220px;
            height: 220px;
            background: radial-gradient(circle, rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.18) 0%, transparent 70%);
            top: 45%;
            left: 50%;
            opacity: 0.28;
        }

        /* 左上角装饰区 */
        .book-title-decor {
            position: fixed;
            top: clamp(20px, 4vh, 36px);
            left: clamp(24px, 5vw, 48px);
            z-index: 10;
            pointer-events: auto;
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 8px 18px 8px 12px;
            border-radius: 60px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.05), 0 0 0 1px rgba(255, 255, 255, 0.5);
            transition: all 0.3s ease;
        }
        .book-title-decor:hover {
            background: rgba(255, 255, 255, 0.8);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
        }
        .qr-mini {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            cursor: pointer;
            transition: transform 0.2s ease;
            border-radius: 14px;
            background: white;
            padding: 4px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }
        .qr-mini:hover {
            transform: scale(1.02);
        }
        .qr-mini-img {
            width: 48px;
            height: 48px;
            display: block;
            border-radius: 10px;
            background: white;
        }
        
        .title-group {
            display: flex;
            flex-direction: column;
            cursor: pointer;
            border-radius: 40px;
            padding: 4px 10px 4px 10px;
            transition: background 0.2s ease;
        }
        .title-group:active {
            background: rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.08);
        }
        .main-title-text {
            font-family: 'Songti SC', 'STSong', 'Noto Serif SC', 'KaiTi', 'STKaiti', serif;
            font-size: clamp(0.9rem, 1.8vw, 1.25rem);
            font-weight: 700;
            color: rgb(var(--theme-r), var(--theme-g), var(--theme-b));
            letter-spacing: 0.06em;
            transition: color 0.8s ease;
            text-shadow: 0 1px 2px rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.1);
            white-space: nowrap;
            line-height: 1.3;
        }
        .subtitle-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 2px;
        }
        .switch-trigger {
            font-family: 'PingFang SC', system-ui;
            font-size: 0.7rem;
            font-weight: 500;
            background: rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.15);
            padding: 4px 10px;
            border-radius: 30px;
            color: rgb(var(--theme-r), var(--theme-g), var(--theme-b));
            transition: all 0.2s;
            white-space: nowrap;
            letter-spacing: 0.03em;
            line-height: 1;
        }
        .title-group:hover .switch-trigger {
            background: rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.25);
            transform: translateY(-1px);
        }
        .book-title-sub {
            font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif;
            font-size: 0.7rem;
            font-weight: 500;
            color: rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.75);
            letter-spacing: 0.08em;
            transition: color 0.8s ease;
            white-space: nowrap;
        }

        /* 计数器 */
        .counter {
            position: fixed;
            top: clamp(24px, 5vh, 40px);
            right: clamp(24px, 5vw, 48px);
            z-index: 10;
            font-family: 'SF Mono', monospace;
            font-size: 0.8rem;
            color: var(--text-counter);
            letter-spacing: 0.06em;
            display: flex;
            align-items: center;
            gap: 8px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.4s ease;
            background: rgba(255, 255, 255, 0.7);
            padding: 8px 16px;
            border-radius: 20px;
            backdrop-filter: blur(8px);
        }
        .counter.active {
            opacity: 1;
        }
        .counter__dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: rgb(var(--theme-r), var(--theme-g), var(--theme-b));
            opacity: 0.8;
            animation: dotPulse 2s ease-in-out infinite;
            transition: background 0.8s ease;
        }
        @keyframes dotPulse {
            0%, 100% { opacity: 0.4; transform: scale(0.7); }
            50% { opacity: 1; transform: scale(1.4); }
        }

        /* 封面样式 + 书籍列表 */
        .intro-screen {
            position: fixed;
            inset: 0;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            transition: opacity 0.7s ease, visibility 0.7s ease;
            opacity: 1;
            visibility: visible;
            cursor: pointer;
            pointer-events: all;
            background: linear-gradient(160deg, #f7f3eb 0%, #f2ece1 40%, #ebe3d5 100%);
        }
        .intro-screen.fade-out {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        /* 卡片本身不再设置滚动条，内容自然撑开，高度自适应 */
        .intro-card {
            background: #ffffff;
            border-radius: 36px;
            padding: 32px 32px 48px;
            max-width: 620px;
            width: 88vw;
            box-shadow: 0 4px 20px rgba(60, 40, 20, 0.07), 0 12px 48px rgba(60, 40, 20, 0.1);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            animation: cardEntry 0.8s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
            border-left: 5px solid #c0392b;
            overflow: visible;   /* 确保卡片自身不产生滚动条 */
        }

        .book-search {
            width: 100%;
            max-width: 320px;
            margin: 4px 0 8px;
        }
        .book-search-input {
            width: 100%;
            padding: 10px 16px;
            font-family: 'PingFang SC', system-ui;
            font-size: 0.9rem;
            border: 1px solid rgba(180, 35, 35, 0.25);
            border-radius: 60px;
            background: rgba(255, 248, 240, 0.8);
            outline: none;
            transition: all 0.2s;
            text-align: center;
            color: #2c2418;
        }
        .book-search-input:focus {
            border-color: #c0392b;
            box-shadow: 0 0 0 3px rgba(192,57,43,0.1);
        }
        .book-stats {
            font-size: 0.75rem;
            color: #9e8b78;
            background: rgba(0,0,0,0.03);
            padding: 4px 12px;
            border-radius: 30px;
            display: inline-block;
            margin-bottom: 4px;
            letter-spacing: 0.02em;
        }
        /* 包装器用于固定渐变层位置 */
        .book-selector-wrapper {
            position: relative;
            width: 100%;
            margin-bottom: 4px;
        }
        .book-selector {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            max-height: 260px;
            overflow-y: auto;
            padding: 8px 12px;
            width: 100%;
            scrollbar-width: thin;
        }
        .book-selector::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        .book-selector::-webkit-scrollbar-track {
            background: #f0eadd;
            border-radius: 4px;
        }
        .book-selector::-webkit-scrollbar-thumb {
            background: rgba(180, 35, 35, 0.3);
            border-radius: 4px;
        }
        /* 底部渐变遮罩，绝对定位，不随内容滚动 */
        .selector-fade {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 40px;
            background: linear-gradient(to bottom, transparent, rgba(255, 255, 255, 0.95));
            pointer-events: none;
            border-radius: 0 0 20px 20px;
            transition: opacity 0.2s ease;
            opacity: 0;
            z-index: 2;
        }
        .book-selector-wrapper.scrollable .selector-fade {
            opacity: 0.9;
        }
        .book-selector-item {
            font-family: 'PingFang SC', system-ui;
            font-size: 0.85rem;
            font-weight: 550;
            padding: 6px 16px;
            border-radius: 40px;
            background: rgba(0,0,0,0.02);
            border: 1px solid rgba(180, 35, 35, 0.2);
            cursor: pointer;
            transition: all 0.2s ease;
            color: #5c4a36;
            backdrop-filter: blur(4px);
            white-space: nowrap;
        }
        .book-selector-item.active {
            background: #c0392b;
            color: white;
            border-color: #c0392b;
            box-shadow: 0 4px 12px rgba(192,57,43,0.3);
        }
        .book-selector-item:hover:not(.active) {
            background: rgba(192,57,43,0.1);
            transform: translateY(-2px);
        }
        .book-selector-item.suggest-btn {
            background: rgba(192,57,43,0.08);
            border-color: rgba(192,57,43,0.4);
            color: #c0392b;
            font-weight: 600;
        }
        .book-selector-item.suggest-btn:hover {
            background: rgba(192,57,43,0.18);
            transform: translateY(-2px);
        }

        .intro-emoji { font-size: clamp(3.5rem, 10vw, 5rem); display: block; animation: emojiFloat 3s ease-in-out infinite; }
        .intro-book-name { font-family: 'Songti SC', serif; font-size: clamp(1.3rem, 3vw, 1.9rem); font-weight: 700; color: #c0392b; letter-spacing: 0.08em; }
        .intro-title { font-family: 'Songti SC', serif; font-size: clamp(1.4rem, 4vw, 2rem); font-weight: 700; color: var(--text-title); }
        .intro-divider { width: 48px; height: 4px; border-radius: 2px; background: linear-gradient(90deg, #c0392b, #e67e22); }
        .intro-subtitle { font-size: clamp(0.85rem, 1.6vw, 1rem); color: var(--text-sub); line-height: 1.5; max-width: 400px; margin: 0 10px; }
        .intro-hint { margin-top: 8px; font-size: 0.85rem; color: #c0392b; animation: hintBlink 2s ease-in-out infinite; font-weight: 500; background: rgba(192,57,43,0.06); padding: 8px 24px; border-radius: 30px; }
        .no-books-tip {
            font-size: 0.8rem;
            color: #9e8b78;
            padding: 12px;
        }
        /* 建议二维码弹窗 */
        .suggest-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            visibility: hidden;
            opacity: 0;
            transition: visibility 0.2s, opacity 0.2s;
            cursor: pointer;
        }
        .suggest-modal.show {
            visibility: visible;
            opacity: 1;
        }
        .suggest-card {
            background: white;
            border-radius: 32px;
            padding: 28px 24px 32px;
            max-width: 280px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            animation: scaleIn 0.25s ease-out;
            cursor: default;
        }
        @keyframes scaleIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
        .suggest-qr {
            width: 200px;
            height: 200px;
            margin: 0 auto 16px;
            background: #f5f0e8;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .suggest-qr img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .suggest-text {
            font-family: 'PingFang SC', system-ui;
            font-size: 0.9rem;
            color: #5c4a36;
            margin-top: 8px;
            line-height: 1.4;
        }
        .close-suggest {
            margin-top: 16px;
            background: rgba(192,57,43,0.1);
            padding: 6px 18px;
            border-radius: 40px;
            display: inline-block;
            font-size: 0.8rem;
            color: #c0392b;
            cursor: pointer;
            transition: 0.2s;
        }
        .close-suggest:hover {
            background: rgba(192,57,43,0.2);
        }

        @keyframes hintBlink { 0%,100% { opacity: 0.5; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-4px); } }
        @keyframes cardEntry { from { opacity: 0; transform: translateY(30px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
        @keyframes emojiFloat { 0%,100% { transform: translateY(0); } 30% { transform: translateY(-12px); } 60% { transform: translateY(-5px); } }

        /* 主应用卡片界面 */
        .main-app {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            transition: opacity 0.7s ease;
            opacity: 0;
            pointer-events: none;
        }
        .main-app.visible {
            opacity: 1;
            pointer-events: all;
        }

        .card {
            position: relative;
            width: 92vw;
            max-width: 700px;
            height: 75vh;
            height: 75dvh;
            min-height: 420px;
            max-height: 650px;
            background: rgba(var(--card-bg-r), var(--card-bg-g), var(--card-bg-b), var(--card-bg-alpha));
            border-radius: 32px;
            box-shadow: 0 4px 24px rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 36px 100px;
            animation: cardEntry 0.7s forwards;
            border-left: 6px solid rgb(var(--theme-r), var(--theme-g), var(--theme-b));
            transition: background 0.8s ease, border-left-color 0.8s ease, box-shadow 0.5s ease;
        }
        .card.glow {
            border-left-color: rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.7);
            box-shadow: 0 4px 24px rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.12), 0 12px 56px rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.15), 0 0 0 2px rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.15);
        }
        .card__content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: 100%;
            transition: opacity 0.12s ease, transform 0.12s ease;
            opacity: 1;
            transform: scale(1);
        }
        .card__content.hiding { opacity: 0; transform: scale(0.93); transition: opacity 0.08s ease, transform 0.08s ease; }
        .card__emoji { font-size: clamp(3.5rem, 8vw, 5.5rem); line-height: 1; margin-bottom: clamp(18px, 3.5vh, 30px); animation: emojiFloat 3s ease-in-out infinite; filter: drop-shadow(0 6px 16px rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.25)); }
        .card__copy-area { cursor: pointer; display: flex; flex-direction: column; align-items: center; width: 100%; border-radius: 16px; padding: 12px 8px; transition: background 0.1s; }
        .card__copy-area:active { background: rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.04); }
        .card__title { font-family: 'Songti SC', serif; font-size: clamp(1.5rem, 3.8vw, 2.5rem); font-weight: 700; color: var(--text-title); line-height: 1.35; margin-bottom: clamp(14px, 2.5vh, 22px); }
        .card__divider { width: 40px; height: 4px; border-radius: 2px; background: rgb(var(--theme-r), var(--theme-g), var(--theme-b)); opacity: 0.6; margin-bottom: clamp(14px, 2.5vh, 22px); transition: background 0.8s ease; }
        .card__subtitle { font-family: 'PingFang SC', system-ui; font-size: clamp(0.88rem, 1.5vw, 1.05rem); font-weight: 400; color: var(--text-sub); line-height: 1.7; white-space: pre-line; max-width: 440px; opacity: 0.85; }
        .copy-toast { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%) scale(0.8); z-index: 100; background: rgba(30,30,30,0.88); color: white; padding: 14px 28px; border-radius: 30px; font-weight: 500; pointer-events: none; opacity: 0; transition: opacity 0.35s ease, transform 0.35s; white-space: nowrap; backdrop-filter: blur(12px); }
        .copy-toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        .card__book-badge { position: absolute; top: clamp(16px,3vh,24px); right: clamp(16px,3vw,28px); font-size: 0.75rem; font-weight: 600; color: rgb(var(--theme-r), var(--theme-g), var(--theme-b)); background: rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.08); padding: 6px 14px; border-radius: 20px; border: 1px solid rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.2); pointer-events: none; }
        .btn-wrapper { position: fixed; bottom: clamp(28px, 5vh, 48px); left: 50%; transform: translateX(-50%); z-index: 20; display: flex; flex-direction: column; align-items: center; gap: 10px; opacity: 0; pointer-events: none; transition: opacity 0.5s ease 0.3s; }
        .btn-wrapper.active { opacity: 1; pointer-events: all; }
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; padding: 17px 40px; font-weight: 600; color: #ffffff; background: rgb(var(--theme-r), var(--theme-g), var(--theme-b)); border: none; border-radius: 50px; cursor: pointer; box-shadow: 0 8px 32px rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.35); transition: all 0.3s; animation: btnFloat 3.5s ease-in-out infinite; min-width: 190px; }
        @keyframes btnFloat { 0%,100% { transform: translateY(0); } 35% { transform: translateY(-8px); } 65% { transform: translateY(-3px); } }
        .btn:hover { background: rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.82); transform: translateY(-3px); animation-play-state: paused; }
        .btn:active { transform: translateY(1px) scale(0.96); }
        .btn__ripple { position: absolute; border-radius: 50%; background: rgba(255,255,255,0.3); transform: scale(0); animation: ripple 0.6s ease-out forwards; pointer-events: none; }
        @keyframes ripple { to { transform: scale(4); opacity: 0; } }
        /* 响应式 */
        @media (max-width:560px) {
            .intro-card { padding: 24px 20px 36px; }
            .book-selector { max-height: 200px; gap: 8px; }
            .book-selector-item { font-size: 0.75rem; padding: 5px 12px; }
            .book-search-input { font-size: 0.8rem; padding: 8px 12px; }
            .book-stats { font-size: 0.7rem; }
        }
        @media (max-width:480px) { 
            .card { padding: 36px 22px 90px; } 
            .btn { padding: 15px 30px; } 
            .qr-mini-img { width: 38px; height: 38px; }
        }
    </style>
</head>
<body>
    <div class="bg-orb bg-orb--top" aria-hidden="true"></div>
    <div class="bg-orb bg-orb--bottom" aria-hidden="true"></div>
    <div class="bg-orb bg-orb--mid" aria-hidden="true"></div>

    <div class="book-title-decor" aria-hidden="false">
        <div class="qr-mini" id="qrMiniContainer" title="扫码访问卡片集">
            <img class="qr-mini-img" id="qrMiniImg" alt="扫码打开网页" />
        </div>
        <div class="title-group" id="titleGroupTrigger">
            <div class="main-title-text">人生卡壳，翻翻名册</div>
            <div class="subtitle-row">
                <span class="switch-trigger">换书</span>
                <div class="book-title-sub" id="dynamicSubTitle">易经</div>
            </div>
        </div>
    </div>

    <div class="counter" id="counter">
        <span class="counter__dot"></span>
        <span>抽取 <strong id="counterNum">0</strong>&nbsp;次</span>
    </div>
    <div class="copy-toast" id="copyToast"><span class="toast-icon">📋</span>已复制到剪贴板</div>

    <!-- 封面：包含书籍搜索和切换列表 -->
    <div class="intro-screen" id="introScreen">
        <div class="intro-card" id="introCard">
            <span class="intro-emoji" id="introEmoji">📚</span>
            <div class="intro-book-name" id="introBookName">易经</div>
            <h1 class="intro-title">人生卡壳，翻翻名册</h1>

                        { emoji: '🚶', title: '道可道，非常道', subtitle: '道可道，非常道；名可名，非常名。\n白话：能说出来的道就不是永恒的道，真正的智慧超越语言，要用心去体悟。' },
                        { emoji: '⚖️', title: '天下皆知美之为美', subtitle: '天下皆知美之为美，斯恶已；皆知善之为善，斯不善已。\n白话：美丑善恶是相对的，执着于分别反而产生对立，顺其自然才是真智慧。' },
                        { emoji: '🎯', title: '不尚贤，使民不争', subtitle: '不贵难得之货，使民不为盗；不见可欲，使民心不乱。\n白话：不标榜贤能名号，百姓就不争；不抬高稀罕物价，百姓就不偷；不炫耀欲望，民心就不乱。' },
                        { emoji: '🏺', title: '道冲而用之或不盈', subtitle: '渊兮似万物之宗。挫其锐，解其纷，和其光，同其尘。\n白话：道看似空虚却用不完，深沉得像万物的本源。收敛锋芒、消解纷扰、含敛光耀、混同尘世。' },
                        { emoji: '🪆', title: '天地不仁，以万物为刍狗', subtitle: '圣人不仁，以百姓为刍狗。\n白话：天地不偏私，任凭万物自生自灭；圣人也不偏私，任凭百姓自作自息。不干涉就是最大的仁。' },
                        { emoji: '🌊', title: '谷神不死，是谓玄牝', subtitle: '玄牝之门，是谓天地根。绵绵若存，用之不勤。\n白话：虚空永存就是玄妙的母性，天地万物的根源在这里，连绵不绝，用也用不完。' },
                        { emoji: '⏳', title: '天长地久', subtitle: '天地所以能长且久者，以其不自生，故能长生。\n白话：天地能长久是因为不为自己而生。不自私反而能长久，成就别人的同时也成就了自己。' },
                        { emoji: '💧', title: '上善若水', subtitle: '水善利万物而不争，处众人之所恶，故几于道。\n白话：最高境界的善像水一样，滋养万物却不争功，甘居低处，最接近道。' },
                        { emoji: '🍵', title: '持而盈之，不如其已', subtitle: '揣而锐之，不可长保。金玉满堂，莫之能守。富贵而骄，自遗其咎。\n白话：水满了不如停手，刀太锋利容易缺口。金玉满堂守不住，富贵了还骄傲就是自取祸患。功成身退才合乎天道。' },
                        { emoji: '👶', title: '专气致柔，能如婴儿乎', subtitle: '载营魄抱一，能无离乎？\n白话：让身体和灵魂合一不分离，让气息柔顺得像婴儿。回归纯真才是修养的最高境界。' },
                        { emoji: '🪟', title: '有之以为利，无之以为用', subtitle: '三十辐共一毂，当其无，有车之用。埏埴以为器，当其无，有器之用。\n白话：车轮因为中空才能转动，陶器因为中空才能盛物。有形的部分只是便利，无形的空间才是价值所在。' },
                        { emoji: '😵', title: '五色令人目盲', subtitle: '五音令人耳聋，五味令人口爽。驰骋畋猎令人心发狂。\n白话：过分追求感官刺激反而失去真正的感知力。简朴生活让心灵更敏锐，少即是多。' },
                        { emoji: '😱', title: '宠辱若惊，贵大患若身', subtitle: '何谓宠辱若惊？宠为下，得之若惊，失之若惊。\n白话：受宠和受辱都像受到惊吓一样。太看重名利就像太看重身体一样，反而是痛苦的根源。' },
                        { emoji: '👻', title: '视之不见名曰夷，听之不闻名曰希', subtitle: '搏之不得名曰微。此三者不可致诘，故混而为一。\n白话：道看不见听不到摸不着，三者混为一体无法追问。这就是形而上的存在。' },
                        { emoji: '🌿', title: '致虚极，守静笃', subtitle: '万物并作，吾以观复。夫物芸芸，各复归其根。\n白话：让心回归彻底的虚静，才能看清万物循环往复的根本规律。喧嚣过后终归宁静。' },
                        { emoji: '👑', title: '太上，下知有之', subtitle: '其次亲而誉之，其次畏之，其次侮之。信不足焉，有不信焉。\n白话：最好的管理者百姓只感到他的存在，次一等被尊敬，再次一等被畏惧，最次的被蔑视。最高境界是无声掌舵。' },
                        { emoji: '📜', title: '大道废，有仁义', subtitle: '智慧出，有大伪。六亲不和，有孝慈。国家昏乱，有忠臣。\n白话：大道废弃了才提倡仁义，智慧出现了才滋生虚伪。家庭不睦才强调孝慈，国家混乱才出现忠臣。越缺什么越喊什么。' },
                        { emoji: '🐂', title: '绝圣弃智，民利百倍', subtitle: '绝仁弃义，民复孝慈；绝巧弃利，盗贼无有。\n白话：抛弃过度的聪明技巧，人民反而能得到更多实在的好处。简单比复杂更有力量。' },
                        { emoji: '😔', title: '绝学无忧', subtitle: '唯之与阿，相去几何？善之与恶，相去若何？\n白话：应诺和呵斥能差多少？美善和丑恶能差多少？众人畏惧的不能不畏惧。去掉杂乱学问反而不忧愁。' },
                        { emoji: '🤷', title: '我独异于人，而贵食母', subtitle: '众人熙熙如享太牢如春登台，我独泊兮其未兆如婴儿之未孩。\n白话：众人热闹我独安静，像婴儿还没长大。别人光鲜亮丽我独自昏昏默默。我独与道同行。' },
                        { emoji: '🌌', title: '孔德之容，惟道是从', subtitle: '道之为物，惟恍惟惚。惚兮恍兮其中有象，恍兮惚兮其中有物。\n白话：大德的表现完全跟随着道。道这个东西恍恍惚惚，但恍惚中有形象有实物，有精微有真实。' },
                        { emoji: '🌀', title: '曲则全，枉则直', subtitle: '洼则盈，敝则新，少则得，多则惑。\n白话：委曲反而能保全，低洼反而能充盈，少取反而能多获，贪多反而困惑。不必处处争强。' },
                        { emoji: '🤫', title: '希言自然', subtitle: '飘风不终朝，骤雨不终日。孰为此者？天地。天地尚不能久，而况于人乎？\n白话：狂风暴雨持续不了一整天，何况人呢？少说多做合乎自然，风雨总会过去。' },
                        { emoji: '🧍', title: '企者不立，跨者不行', subtitle: '自见者不明，自是者不彰，自伐者无功，自矜者不长。\n白话：踮着脚站不稳跳着走走不远，自负逞强的人恰恰暴露虚弱。自我炫耀反而黯淡。' },
                        { emoji: '🐣', title: '有物混成，先天地生', subtitle: '寂兮寥兮，独立而不改，周行而不殆，可以为天下母。吾不知其名，字之曰道。\n白话：有个浑然一体的东西比天地还早，寂静空虚独立永恒循环不息。我给不起名字，叫它"道"吧。' },
                        { emoji: '⚓', title: '重为轻根，静为躁君', subtitle: '是以君子终日行不离辎重。虽有荣观，燕处超然。\n白话：稳重是轻浮的根基，冷静是躁动的主宰。君子整天走路都不离开载重的车。处境再华丽也淡然处之。' },
                        { emoji: '🗝️', title: '善行无辙迹，善言无瑕谪', subtitle: '善数不用筹策，善闭无关楗而不可开，善结无绳约而不可解。\n白话：善于行动的人不留痕迹，善于说话的人没有破绽。最高明的办法不用工具也不可解开。' },
                        { emoji: '👶', title: '知其雄，守其雌，为天下谿', subtitle: '为天下谿，常德不离，复归于婴儿。\n白话：知道刚强却安守柔弱，做天下的溪谷。永恒的德就不会离身，回归婴儿般的纯真。' },
                        { emoji: '🚫', title: '将欲取天下而为之，吾见其不得已', subtitle: '天下神器，不可为也，不可执也。为者败之，执者失之。\n白话：用强力来治理天下是不可能的。天下是神圣的东西，不能强行作为，越控制越失去。' },
                        { emoji: '⚔️', title: '以道佐人主者，不以兵强天下', subtitle: '其事好还。师之所处荆棘生焉，大军之后必有凶年。\n白话：用道辅佐君主的人不靠兵力逞强。用兵会遭报应，战乱过后荆棘遍野必有荒年。' },
                        { emoji: '🗡️', title: '兵者不祥之器，非君子之器', subtitle: '不得已而用之，恬淡为上。胜而不美，而美之者是乐杀人。\n白话：兵器是不祥的东西，不到万不得已不用。打了胜仗也不庆祝，庆祝胜利等于以杀人为乐。' },
                        { emoji: '🌊', title: '知人者智，自知者明', subtitle: '胜人者有力，自胜者强。知足者富，强行者有志。\n白话：了解别人是聪明，看清自己才是智慧。战胜别人是有力，战胜自己才是强大。知足才是真正的富有。' },
                        { emoji: '🌍', title: '大道泛兮，其可左右', subtitle: '万物恃之以生而不辞，功成而不有。衣养万物而不为主，可名于小。\n白话：大道像江河一样无处不在，养育万物却不占有不主宰。最伟大的东西往往最渺小最平凡。' },
                        { emoji: '🎵', title: '执大象，天下往', subtitle: '往而不害，安平太。乐与饵，过客止。道之出口淡乎其无味。\n白话：守住大道天下人都会来归附，不伤害，平安康泰。音乐和美食让过客停步，道说出口却平淡无味。' },
                        { emoji: '🐟', title: '将欲歙之，必固张之', subtitle: '将欲弱之，必固强之；将欲废之，必固兴之；将欲取之，必固与之。\n白话：想要收敛不妨先让它张开。物极必反，柔弱胜过刚强的智慧。这是微妙的道理。' },
                        { emoji: '🌊', title: '道常无为而无不为', subtitle: '侯王若能守之，万物将自化。化而欲作，吾将镇之以无名之朴。\n白话：道永远顺其自然却无所不成就。王侯能守住道万物会自我化育。欲望冒出来就用道的质朴来镇服它。' },
                        { emoji: '🌸', title: '上德不德，是以有德', subtitle: '下德不失德，是以无德。上德无为而无以为，下德无为而有以为。\n白话：真正的德不标榜德行所以真有德，低层次的德总表现有德其实没德。最高的德顺其自然不为什么。' },
                        { emoji: '1️⃣', title: '昔之得一者：天得一以清', subtitle: '地得一以宁，神得一以灵，谷得一以盈，万物得一以生。\n白话：自古得到"一"的：天得道而清明，地得道而宁静，万物得道而生长。一就是道的整体性。' },
                        { emoji: '🔄', title: '反者道之动，弱者道之用', subtitle: '天下万物生于有，有生于无。\n白话：循环往复是道的运动方式，柔弱是道的作用方式。天下万物从有形生，有从无生。后退有时是为了前进。' },
                        { emoji: '😂', title: '上士闻道，勤而行之', subtitle: '中士闻道，若存若亡；下士闻道，大笑之。不笑不足以为道。\n白话：上等人听了道努力践行，中等人半信半疑，下等人哈哈大笑。不被嘲笑反而不是真道了。' },
                        { emoji: '💡', title: '明道若昧，进道若退', subtitle: '夷道若颣，上德若谷，大白若辱，广德若不足。\n白话：光明的道好像暗昧，前进的道好像后退。真正的伟大看起来平凡，最洁白的好像有污点。大道反常理。' },
                        { emoji: '🌱', title: '道生一，一生二', subtitle: '二生三，三生万物。万物负阴而抱阳，冲气以为和。\n白话：万物都由简单到复杂演化而来，阴阳相互激荡达到和谐。这就是宇宙生成的过程。' },
                        { emoji: '👂', title: '不言之教，无为之益', subtitle: '天下希及之。\n白话：不用言语的教化，顺应自然的益处，天下很少有人能做到。潜移默化胜过说教千遍。' },
                        { emoji: '💭', title: '名与身孰亲？身与货孰多？', subtitle: '得与亡孰病？甚爱必大费，多藏必厚亡。\n白话：名声和生命哪个更亲？生命和财产哪个更重？知道满足就不会受辱，知道适可而止就不会有危险。' },
                        { emoji: '✅', title: '大成若缺，其用不弊', subtitle: '大盈若冲，其用不穷。大直若屈，大巧若拙，大辩若讷。\n白话：最大的成就好像有缺陷但用不完，最满的反而空虚但用不尽。最直的好像弯曲，最巧的好像笨拙。' },
                        { emoji: '☀️', title: '天下有道，却走马以粪', subtitle: '天下无道，戎马生于郊。祸莫大于不知足，咎莫大于欲得。\n白话：天下太平战马用来耕田，天下大乱母马在野外生驹。最大的祸患是贪得无厌不知满足。' },
                        { emoji: '🔮', title: '不出户，知天下', subtitle: '不窥牖，见天道。其出弥远，其知弥少。\n白话：不走出门也能知天下事，不望窗外也能见天道。向外求索越远离真知反而越远。心静万事明。' },
                        { emoji: '📚', title: '为学日益，为道日损', subtitle: '损之又损，以至于无为。无为而无不为。\n白话：求学问是越学越多，修道是越减越少。减到无可再减就达到无为境界，无为反而无所不成就。' },
                        { emoji: '💗', title: '圣人常无心，以百姓心为心', subtitle: '善者吾善之，不善者吾亦善之，德善。信者吾信之，不信者吾亦信之，德信。\n白话：圣人没有私心以百姓的心愿为己心。对谁都善意相待，对谁都保持信任。这才是真正的大德。' },
                        { emoji: '🌬️', title: '出生入死', subtitle: '生之徒十有三，死之徒十有三，人之生动之于死地亦十有三。夫何故？以其生生之厚。\n白话：长寿的占三分一，短命的占三分一，自寻死路的占三分一。过分养生反而害命。自然就好。' },
                        { emoji: '🌰', title: '道生之，德畜之', subtitle: '物形之，势成之。是以万物莫不尊道而贵德。道之尊德之贵，夫莫之命而常自然。\n白话：道生成万物，德养育万物。道和德之所以尊贵，就在于不干涉万物而让其顺其自然。' },
                        { emoji: '👩‍👧', title: '天下有始，以为天下母', subtitle: '既得其母，以知其子；既知其子，复守其母，没身不殆。\n白话：天下万物都有本始，这就是"母亲"。知道孩子（万物）就回来守住母亲（道），终身没有危险。' },
                        { emoji: '👀', title: '使我介然有知，行于大道', subtitle: '唯施是畏。大道甚夷而人好径。朝甚除田甚芜仓甚虚，服文彩带利剑厌饮食，是谓盗夸。\n白话：我稍微有点知识就走在大道上，只怕走入邪路。大道很平坦但人总喜欢抄小径。那些炫耀浮华的其实是大盗。' },
                        { emoji: '🌳', title: '善建者不拔，善抱者不脱', subtitle: '子孙以祭祀不辍。修之于身其德乃真，修之于家其德乃余。\n白话：善于建树功德的不会轻易动摇，善于抱持道德的不会轻易脱离。修养从自身开始，德就会越来越广。' },
                        { emoji: '🐣', title: '含德之厚，比于赤子', subtitle: '毒虫不螫，猛兽不据，攫鸟不搏。骨弱筋柔而握固。\n白话：德行深厚的人像初生的婴儿，毒虫不叮猛兽不伤。柔弱的婴儿却拳头紧握，这是元气充沛的境界。' },
                        { emoji: '🤐', title: '知者不言，言者不知', subtitle: '塞其兑闭其门，挫其锐解其纷，和其光同其尘，是谓玄同。\n白话：真正懂的人不多说，夸夸其谈的人并不懂。关闭感官欲望，收敛锋芒，混同尘世，就是与道一体。' },
                        { emoji: '🗡️', title: '以正治国，以奇用兵', subtitle: '以无事取天下。天下多忌讳而民弥贫，民多利器国家滋昏。\n白话：用正道治国用奇谋用兵用不扰民取得天下。禁令越多人民越穷，武器越多国家越乱。无为才能治。' },
                        { emoji: '🧘', title: '其政闷闷，其民淳淳', subtitle: '其政察察，其民缺缺。祸兮福之所倚，福兮祸之所伏。\n白话：政治宽厚人民就淳朴，政治严苛人民就狡诈。祸福互相依存转化，谁能知道极限在哪？守中道不偏激。' },
                        { emoji: '🐟', title: '治大国若烹小鲜', subtitle: '以道莅天下，其鬼不神。非其鬼不神，其神不伤人。\n白话：治理大国像煎小鱼一样不能总翻动不能折腾百姓。以道临天下连鬼神都不起作用，这是最好的状态。' },
                        { emoji: '🌊', title: '大国者下流，天下之交', subtitle: '天下之牝，牝常以静胜牡，以静为下。\n白话：大国应像江河处在低处才能汇聚天下。雌性常以安静胜过雄性，静能制动柔能克刚。' },
                        { emoji: '🧭', title: '道者万物之奥', subtitle: '善人之宝，不善人之所保。美言可以市尊，美行可以加人。\n白话：道是万物的奥妙所在，善人的珍宝不善人的庇护所。美言可以换尊重，美行可以感染人。' },
                        { emoji: '🔨', title: '为无为，事无事，味无味', subtitle: '大小多少，报怨以德。图难于其易，为大于其细。\n白话：以无为来作为以无事来做事，把怨怼用恩德回报。想克服困难从容易处下手，想成就大事从小处做起。' },
                        { emoji: '🪴', title: '其安易持，其未兆易谋', subtitle: '其脆易泮，其微易散。为之于未有，治之于未乱。\n白话：安稳时容易把握未显时容易谋划。事情在还没发生时做，治乱在还没乱时处理。防患于未然。' },
                        { emoji: '🧘', title: '江海所以能为百谷王者', subtitle: '以其善下之，故能为百谷王。\n白话：江海因为甘愿处在低处才汇聚百川。谦卑处下反而能成为领袖。不争之争才是大争。' },
                        { emoji: '🧭', title: '我有三宝，持而保之', subtitle: '一曰慈，二曰俭，三曰不敢为天下先。慈故能勇，俭故能广，不敢为天下先故能成器长。\n白话：人生三样法宝：慈悲、节俭、不争强好胜。慈悲生出勇，节俭生出广，不争反成领袖。' },
                        { emoji: '🤼', title: '善为士者不武，善战者不怒', subtitle: '善胜敌者不与，善用人者为之下。是谓不争之德，是谓用人之力。\n白话：好统帅不逞勇斗狠，善战者不动怒，善胜者不正面交锋。不争的德行，用人的智慧。' },
                        { emoji: '💭', title: '吾言甚易知甚易行', subtitle: '天下莫能知莫能行。言有宗事有君。夫唯无知，是以不我知。\n白话：我的话很简单易懂可世人就是做不到。知易行难，被褐怀玉。怀揣宝玉却穿着粗布衣，人不可貌相。' },
                        { emoji: '🛡️', title: '知不知，尚矣', subtitle: '不知知，病也。圣人不病，以其病病。夫唯病病，是以不病。\n白话：知道自己的无知是最高境界，不懂装懂才是毛病。圣人把毛病当毛病所以没毛病。' },
                        { emoji: '😨', title: '民不畏威，则大威至', subtitle: '无狎其所居，无厌其所生。夫唯不厌，是以不厌。\n白话：当人民不再畏惧威权时大祸就来了。不要压迫生存空间，不要堵塞生计。不自以为是才是真明白。' },
                        { emoji: '✖️', title: '天网恢恢，疏而不失', subtitle: '勇于敢则杀，勇于不敢则活。此两者或利或害。天之所恶孰知其故？\n白话：天道像一张大网虽然稀疏却从不漏过。大胆妄为者自取灭亡，谨慎不妄动者能保全。天网恢恢疏而不漏。' },
                        { emoji: '💀', title: '民不畏死，奈何以死惧之', subtitle: '若使民常畏死，而为奇者吾得执而杀之，孰敢？常有司杀者杀。\n白话：人民不怕死拿死来威胁有什么用？若人民怕死那极少数的捣乱者杀了就是。代替刽子手杀人的好比代替木匠砍木头，必伤己手。' },
                        { emoji: '🍞', title: '民之饥，以其上食税之多', subtitle: '是以饥。民之难治，以其上之有为，是以难治。民之轻死，以其上求生之厚。\n白话：人民挨饿因为上面税收太重，人民难治因为上面折腾太多，人民不怕死因为上面生活太奢侈。' },
                        { emoji: '🍃', title: '人之生也柔弱，其死也坚强', subtitle: '草木之生也柔脆，其死也枯槁。故坚强者死之徒，柔弱者生之徒。\n白话：活着时身体柔软死了才僵硬。柔韧是生的状态，刚硬是死的前兆。不要再迷信强硬了。' },
                        { emoji: '🎯', title: '天之道，损有余而补不足', subtitle: '人之道则不然，损不足以奉有余。孰能有余以奉天下？唯有道者。\n白话：天道是减多余补不足，人道却相反抢夺穷人供奉富人。谁能把有余分给大家？只有得道的人。' },
                        { emoji: '💧', title: '天下莫柔弱于水', subtitle: '而攻坚强者莫之能胜，以其无以易之。弱之胜强，柔之胜刚，天下莫不知莫能行。\n白话：水是天下最柔弱的，但滴水能穿石。柔能克刚道理谁都知道，却没几人能做到。' },
                        { emoji: '🤝', title: '和大怨必有余怨', subtitle: '是以圣人执左契而不责于人。有德司契，无德司彻。天道无亲常与善人。\n白话：结下大怨即使和解也留疤。圣人拿着借据却不向人讨债。天道没有亲疏永远与善良者同在。' },
                        { emoji: '🏡', title: '小国寡民', subtitle: '甘其食美其服安其居乐其俗。邻国相望鸡犬之声相闻，民至老死不相往来。\n白话：理想生活是简小知足，吃得香穿得暖住得安，不羡慕不比较不和别人攀比。简单才是神仙日子。' },
                        { emoji: '🗣️', title: '信言不美，美言不信', subtitle: '善者不辩，辩者不善。知者不博，博者不知。\n白话：可信的话不花哨花哨的不一定可信。真话往往朴实，巧言往往另有目的。大道至简。' },
                        { emoji: '📦', title: '圣人不积', subtitle: '既以为人己愈有，既以与人己愈多。天之道利而不害，圣人之道为而不争。\n白话：圣人不囤积，越帮别人自己越丰盛，越分给别人自己越多。天道利万物而不害，圣人之道做而不争。' },
                    ]
                },
            };
            let BOOK2 = {};
            let BOOK3 = {};

            // 合并成一个新对象
            const BOOKS = { ...BOOK1, ...BOOK2, ...BOOK3 };

            const SITE_MAIN_TITLE = "人生卡壳，翻翻名册";
            let currentBookKey = "毛泽东选集";
            let currentCardList = [];
            let currentCardIndex = 0;
            let drawCount = 0;
            let hasEntered = false;
            let isAnimating = false;
            let toastTimer = null;
            let recentIndices = [];

            // 作者联系方式二维码（可替换为真实微信二维码图片）
            const AUTHOR_CONTACT_QR_URL = "https://u.wechat.com/EEbI8vq4ZJps9mAGeDgnWIs?s=2";
            const AUTHOR_CONTACT_QR = "https://quickchart.io/qr?text="+encodeURIComponent(AUTHOR_CONTACT_QR_URL)+"&size=300&margin=2&ecLevel=H";

            // DOM 元素
            const root = document.documentElement;
            const introScreen = document.getElementById('introScreen');
            const mainApp = document.getElementById('mainApp');
            const cardContentEl = document.getElementById('cardContent');
            const cardEmojiEl = document.getElementById('cardEmoji');
            const cardTitleEl = document.getElementById('cardTitle');
            const cardSubtitleEl = document.getElementById('cardSubtitle');
            const drawBtn = document.getElementById('drawBtn');
            const btnTextEl = document.getElementById('btnText');
            const btnWrapper = document.getElementById('btnWrapper');
            const counterEl = document.getElementById('counter');
            const counterNumEl = document.getElementById('counterNum');
            const cardEl = document.getElementById('card');
            const copyToast = document.getElementById('copyToast');
            const cardCopyArea = document.getElementById('cardCopyArea');
            const dynamicSubTitle = document.getElementById('dynamicSubTitle');
            const cardBadge = document.getElementById('cardBadge');
            const introBookName = document.getElementById('introBookName');
            const introDesc = document.getElementById('introDesc');
            const introEmoji = document.getElementById('introEmoji');
            const qrMiniImg = document.getElementById('qrMiniImg');
            const bookSelector = document.getElementById('bookSelector');
            const titleGroupTrigger = document.getElementById('titleGroupTrigger');
            const bookSearchInput = document.getElementById('bookSearchInput');
            const bookStats = document.getElementById('bookStats');
            const selectorWrapper = document.getElementById('bookSelectorWrapper');
            const suggestModal = document.getElementById('suggestModal');
            const suggestQrImg = document.getElementById('suggestQrImg');
            const closeSuggestBtn = document.getElementById('closeSuggestBtn');

            // 更新渐变遮罩可见性（根据内容是否可滚动）
            function updateFadeVisibility() {
                if (!selectorWrapper || !bookSelector) return;
                const isScrollable = bookSelector.scrollHeight > bookSelector.clientHeight;
                if (isScrollable) {
                    selectorWrapper.classList.add('scrollable');
                } else {
                    selectorWrapper.classList.remove('scrollable');
                }
            }

            // 颜色映射
            const defaultTheme = { r: 180, g: 35, b: 35 };
            function updateThemeByEmoji(emoji) {
                let theme = defaultTheme;
                if (emoji === '🔥') theme = { r: 210, g: 55, b: 30 };
                else if (emoji === '⚡') theme = { r: 185, g: 85, b: 35 };
                else if (emoji === '☰') theme = { r: 180, g: 35, b: 35 };
                root.style.setProperty('--theme-r', theme.r);
                root.style.setProperty('--theme-g', theme.g);
                root.style.setProperty('--theme-b', theme.b);
                root.style.setProperty('--card-bg-r', 255);
                root.style.setProperty('--card-bg-g', 248);
                root.style.setProperty('--card-bg-b', 240);
                root.style.setProperty('--card-bg-alpha', '0.92');
            }

            function updateCardDOM(card) {
                if(!card) return;
                cardEmojiEl.textContent = card.emoji;
                cardTitleEl.textContent = card.title;
                cardSubtitleEl.textContent = card.subtitle;
                updateThemeByEmoji(card.emoji);
            }

            function getRandomCardIndexAvoidRecent() {
                if (!currentCardList.length) return 0;
                const total = currentCardList.length;
                if (total <= 3) return Math.floor(Math.random() * total);
                const forbidSet = new Set(recentIndices);
                const candidates = [];
                for (let i = 0; i < total; i++) {
                    if (!forbidSet.has(i)) candidates.push(i);
                }
                if (candidates.length === 0) return Math.floor(Math.random() * total);
                return candidates[Math.floor(Math.random() * candidates.length)];
            }

            function recordRecentIndex(idx) {
                recentIndices.push(idx);
                while (recentIndices.length > 3) recentIndices.shift();
            }

            function updateBookStats() {
                const total = Object.keys(BOOKS).length;
                const searchTerm = bookSearchInput ? bookSearchInput.value.trim().toLowerCase() : '';
                if (!searchTerm) {
                    bookStats.textContent = `共 ${total} 本典籍`;
                } else {
                    const filtered = Object.keys(BOOKS).filter(key => BOOKS[key].name.toLowerCase().includes(searchTerm));
                    bookStats.textContent = `找到 ${filtered.length} 本（共 ${total} 本）`;
                }
            }

            function renderBookList() {
                const searchTerm = bookSearchInput ? bookSearchInput.value.trim().toLowerCase() : '';
                const allBooks = Object.entries(BOOKS);
                let filtered = allBooks;
                if (searchTerm) {
                    filtered = allBooks.filter(([key, book]) => book.name.toLowerCase().includes(searchTerm));
                }
                if (!bookSelector) return;
                bookSelector.innerHTML = '';
                // 建议按钮
                const suggestBtn = document.createElement('button');
                suggestBtn.className = 'book-selector-item suggest-btn';
                suggestBtn.textContent = '建议';
                suggestBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    suggestQrImg.src = AUTHOR_CONTACT_QR;
                    suggestModal.classList.add('show');
                });
                bookSelector.appendChild(suggestBtn);
                
                if (filtered.length === 0) {
                    const emptyMsg = document.createElement('div');
                    emptyMsg.className = 'no-books-tip';
                    emptyMsg.textContent = '📭 未找到相关典籍';
                    bookSelector.appendChild(emptyMsg);
                    suggestBtn.textContent = '向作者推荐';
                } else {
                    filtered.forEach(([key, book]) => {
                        const btn = document.createElement('button');
                        btn.className = 'book-selector-item';
                        if (key === currentBookKey) btn.classList.add('active');
                        btn.textContent = book.name;
                        btn.dataset.book = key;
                        btn.addEventListener('click', (e) => {
                            e.stopPropagation();
                            if (key === currentBookKey) return;
                            switchToBook(key, true);
                        });
                        bookSelector.appendChild(btn);
                    });
                }
                updateBookStats();
                // 重新检测滚动条
                setTimeout(updateFadeVisibility, 20);
            }

            function refreshCoverUI() {
                const book = BOOKS[currentBookKey];
                if(!book) return;
                introBookName.textContent = book.name;
                introDesc.innerHTML = `${book.description}<br>触碰智慧，随机抽取`;
                introEmoji.textContent = book.icon || '📖';
                dynamicSubTitle.textContent = book.name;
                cardBadge.innerHTML = book.description;
                document.title = `${SITE_MAIN_TITLE} · ${book.name}箴言卡片`;
                renderBookList();
                const url = window.location.href;
                const encoded = encodeURIComponent(url);
                qrMiniImg.src = `https://quickchart.io/qr?text=${encoded}&size=180&margin=2&ecLevel=H`;
                qrMiniImg.onerror = () => { qrMiniImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encoded}`; };
            }

            function switchToBook(bookKey, updateHistory = true) {
                if (!BOOKS[bookKey]) return;
                if (bookKey === currentBookKey) return;
                currentBookKey = bookKey;
                currentCardList = BOOKS[bookKey].cards;
                drawCount = 0;
                if (counterNumEl) counterNumEl.textContent = "0";
                recentIndices = [];
                if (currentCardList.length) currentCardIndex = 0;
                refreshCoverUI();
                if (hasEntered) {
                    exitToCover();
                }
                if (updateHistory) {
                    const newUrl = new URL(window.location.href);
                    newUrl.searchParams.set('book', bookKey);
                    window.history.pushState({ book: bookKey }, '', newUrl.toString());
                }
            }

            function exitToCover() {
                if(!hasEntered) return;
                hasEntered = false;
                mainApp.classList.remove('visible');
                btnWrapper.classList.remove('active');
                counterEl.classList.remove('active');
                introScreen.classList.remove('fade-out');
                drawCount = 0;
                counterNumEl.textContent = "0";
                isAnimating = false;
            }

            function enterMainApp() {
                if (hasEntered) return;
                hasEntered = true;
                introScreen.classList.add('fade-out');
                mainApp.classList.add('visible');
                btnWrapper.classList.add('active');
                counterEl.classList.add('active');
                drawCount = 0;
                counterNumEl.textContent = "0";
                currentCardList = BOOKS[currentBookKey].cards;
                recentIndices = [];
                if (currentCardList.length) {
                    currentCardIndex = 0;
                    updateCardDOM(currentCardList[0]);
                }
                drawBtn.disabled = false;
                btnTextEl.textContent = '随机抽取';
                drawCard();
            }

            async function drawCard() {
                if (isAnimating || !hasEntered || !currentCardList.length) return;
                isAnimating = true;
                drawBtn.disabled = true;
                btnTextEl.textContent = '抽取中...';
                drawBtn.style.animationPlayState = 'paused';
                const finalIndex = getRandomCardIndexAvoidRecent();
                const switchCount = Math.min(5, currentCardList.length);
                let tempIndices = [];
                for (let i = 0; i < switchCount; i++) {
                    let idx = getRandomCardIndexAvoidRecent();
                    if (i === 0 && idx === currentCardIndex && currentCardList.length > 1) {
                        let newIdx = getRandomCardIndexAvoidRecent();
                        while (newIdx === currentCardIndex && currentCardList.length > 1) newIdx = getRandomCardIndexAvoidRecent();
                        idx = newIdx;
                    }
                    tempIndices.push(idx);
                }
                const intervals = [70,90,120,160,200];
                for(let i=0;i<tempIndices.length;i++){
                    await new Promise(r=>{ cardContentEl.classList.add('hiding'); setTimeout(r,60); });
                    updateCardDOM(currentCardList[tempIndices[i]]);
                    currentCardIndex = tempIndices[i];
                    await new Promise(r=>{ cardContentEl.classList.remove('hiding'); setTimeout(r,70); });
                    if(i<tempIndices.length-1) await new Promise(r=>setTimeout(r,intervals[i]));
                }
                await new Promise(r=>setTimeout(r,180));
                await new Promise(r=>{ cardContentEl.classList.add('hiding'); setTimeout(r,60); });
                updateCardDOM(currentCardList[finalIndex]);
                currentCardIndex = finalIndex;
                recordRecentIndex(finalIndex);
                await new Promise(r=>{ cardContentEl.classList.remove('hiding'); setTimeout(r,80); });
                cardEl.classList.add('glow');
                setTimeout(()=>cardEl.classList.remove('glow'),700);
                drawCount++;
                counterNumEl.textContent = drawCount;
                drawBtn.disabled = false;
                btnTextEl.textContent = '随机抽取';
                drawBtn.style.animationPlayState = 'running';
                isAnimating = false;
            }

            function copyCardContent() {
                if (!hasEntered) return;
                const title = cardTitleEl.textContent;
                const subtitle = cardSubtitleEl.textContent;
                const text = `「${title}」\n${subtitle.replace(/\n/g, ' ')}`;
                navigator.clipboard.writeText(text).then(()=>showCopyToast()).catch(()=>{
                    const ta = document.createElement('textarea'); ta.value=text; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); showCopyToast();
                });
            }
            function showCopyToast(){ if(toastTimer)clearTimeout(toastTimer); copyToast.classList.add('show'); toastTimer=setTimeout(()=>copyToast.classList.remove('show'),1800); }

            function initFromURL(){
                const params = new URLSearchParams(window.location.search);
                let bookParam = params.get('book');
                if(bookParam && BOOKS[bookParam]) currentBookKey = bookParam;
                else currentBookKey = Object.keys(BOOKS)[0];
                currentCardList = BOOKS[currentBookKey].cards;
                currentCardIndex = 0;
                drawCount = 0;
                recentIndices = [];
                refreshCoverUI();
                if(currentCardList.length) updateCardDOM(currentCardList[0]);
            }

            function closeModal() { suggestModal.classList.remove('show'); }
            suggestModal.addEventListener('click', closeModal);
            closeSuggestBtn.addEventListener('click', (e) => { e.stopPropagation(); closeModal(); });
            const suggestCardEl = document.querySelector('.suggest-card');
            if(suggestCardEl) suggestCardEl.addEventListener('click', (e) => e.stopPropagation());

            if (bookSearchInput) {
                bookSearchInput.addEventListener('input', () => {
                    renderBookList();
                });
            }
            window.addEventListener('resize', () => updateFadeVisibility());
            const observer = new MutationObserver(() => updateFadeVisibility());
            if (bookSelector) observer.observe(bookSelector, { childList: true, subtree: true, attributes: true });

            introScreen.addEventListener('click', (e) => {
                if(e.target.closest('.book-selector-item') || e.target.closest('.book-search-input')) return;
                enterMainApp();
            });
            drawBtn.addEventListener('click', (e) => {
                const rect = drawBtn.getBoundingClientRect();
                const ripple = document.createElement('span'); ripple.classList.add('btn__ripple');
                ripple.style.width = ripple.style.height = Math.max(rect.width,rect.height)+'px';
                ripple.style.left = (e.clientX - rect.left - ripple.offsetWidth/2)+'px';
                ripple.style.top = (e.clientY - rect.top - ripple.offsetHeight/2)+'px';
                drawBtn.appendChild(ripple); ripple.addEventListener('animationend',()=>ripple.remove());
                drawCard();
            });
            cardCopyArea.addEventListener('click', (e) => { e.stopPropagation(); copyCardContent(); });
            if(titleGroupTrigger) {
                titleGroupTrigger.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (hasEntered) exitToCover();
                });
            }
            const qrContainer = document.getElementById('qrMiniContainer');
            if(qrContainer) {
                qrContainer.addEventListener('click', (e) => {
                    e.stopPropagation();
                    window.open(window.location.href, '_blank');
                });
            }

            window.addEventListener('popstate', (e) => {
                const params = new URLSearchParams(window.location.search);
                let book = params.get('book');
                if(book && BOOKS[book]) {
                    currentBookKey = book;
                    currentCardList = BOOKS[currentBookKey].cards;
                    drawCount = 0; if(counterNumEl) counterNumEl.textContent = "0";
                    recentIndices = [];
                    refreshCoverUI();
                    if(hasEntered) exitToCover();
                } else if(!book) {
                    currentBookKey = Object.keys(BOOKS)[0];
                    currentCardList = BOOKS[currentBookKey].cards;
                    refreshCoverUI();
                    if(hasEntered) exitToCover();
                }
            });
            initFromURL();
        })();
    </script>
</body>
</html>
