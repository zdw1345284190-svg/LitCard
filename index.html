                }
            }

            function renderBookList() {
                const searchTerm = bookSearchInput ? bookSearchInput.value.trim().toLowerCase() : '';
                const allBooks = Object.entries(BOOKS);
                let filtered = allBooks;
                if (searchTerm) filtered = allBooks.filter(([key, book]) => book.name.toLowerCase().includes(
                searchTerm));
                if (!bookSelector) return;
                bookSelector.innerHTML = '';
                const suggestBtn = document.createElement('button');
                suggestBtn.className = 'book-selector-item suggest-btn';
                suggestBtn.textContent = '建议';
                suggestBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    suggestQrImg.src = AUTHOR_CONTACT_QR;
                    suggestModal.classList.add('show');
                });
                bookSelector.appendChild(suggestBtn);
                if (filtered.length === 0) {
                    const emptyMsg = document.createElement('div');
                    emptyMsg.className = 'no-books-tip';
                    emptyMsg.textContent = '📭 未找到相关典籍';
                    bookSelector.appendChild(emptyMsg);
                    suggestBtn.textContent = '向作者推荐';
                } else {
                    filtered.forEach(([key, book]) => {
                        const btn = document.createElement('button');
                        btn.className = 'book-selector-item';
                        if (key === currentBookKey) btn.classList.add('active');
                        btn.textContent = book.name;
                        btn.dataset.book = key;
                        btn.addEventListener('click', (e) => {
                            e.stopPropagation();
                            if (key === currentBookKey) return;
                            switchToBook(key, true);
                        });
                        bookSelector.appendChild(btn);
                    });
                }
                updateBookStats();
                setTimeout(updateFadeVisibility, 20);
            }

            function refreshCoverUI() {
                const book = BOOKS[currentBookKey];
                if (!book) return;
                introBookName.textContent = book.name;
                introDesc.innerHTML = `${book.description}<br>触碰智慧，随机抽取`;
                introEmoji.textContent = book.icon || '📖';
                dynamicSubTitle.textContent = book.name;
                cardBadge.innerHTML = book.description;
                document.title = `${SITE_MAIN_TITLE} · ${book.name}箴言卡片`;
                renderBookList();
                const url = window.location.href;
                const encoded = encodeURIComponent(url);
                qrMiniImg.src = `https://quickchart.io/qr?text=${encoded}&size=180&margin=2&ecLevel=H`;
                qrMiniImg.dataset.largeSrc =
                    `https://quickchart.io/qr?text=${encoded}&size=400&margin=2&ecLevel=H`;
                qrMiniImg.onerror = () => {
                    const fallback =
                        `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encoded}`;
                    qrMiniImg.src = fallback;
                    qrMiniImg.dataset.largeSrc =
                        `https://api.qrserver.com/v1/create-qr-code/?size=500x500&data=${encoded}`;
                };
            }

            function triggerIntroCardAnimation() {
                if (!introCard) return;
                introCard.classList.remove('respawn');
                void introCard.offsetWidth; // 强制重排
                introCard.classList.add('respawn');
            }

            function pulseBookName() {
                if (!introBookName) return;
                introBookName.classList.remove('pulse');
                void introBookName.offsetWidth;
                introBookName.classList.add('pulse');
            }

            function showMessageToast(text, duration = 1200) {
                if (!messageToast) return;
                if (msgToastTimer) clearTimeout(msgToastTimer);
                messageToast.textContent = text;
                messageToast.classList.add('show');
                msgToastTimer = setTimeout(() => messageToast.classList.remove('show'), duration);
            }

            function switchToBook(bookKey, updateHistory = true) {
                if (!BOOKS[bookKey] || bookKey === currentBookKey) return;
                const previousBook = currentBookKey;
                currentBookKey = bookKey;
                currentCardList = BOOKS[bookKey].cards;
                drawCount = 0;
                if (counterNumEl) counterNumEl.textContent = "0";
                recentIndices = [];
                if (currentCardList.length) currentCardIndex = 0;
                refreshCoverUI();
                // 切换感知效果
                const bookName = BOOKS[bookKey].name;
                showMessageToast(`✨ ${bookName} · 已切换`, 1400);
                pulseBookName();
                if (hasEntered) {
                    exitToCover();
                    // 封面重新出现时触发卡片动画
                    setTimeout(triggerIntroCardAnimation, 50);
                } else {
                    // 已经在封面，直接触发封面卡片重播
                    triggerIntroCardAnimation();
                }
                if (updateHistory && previousBook !== bookKey) {
                    const newUrl = new URL(window.location.href);
                    newUrl.searchParams.set('book', bookKey);
                    window.history.pushState({ book: bookKey }, '', newUrl.toString());
                }
            }

            function exitToCover() {
                if (!hasEntered) return;
                hasEntered = false;
                mainApp.classList.remove('visible');
                btnWrapper.classList.remove('active');
                counterEl.classList.remove('active');
                introScreen.classList.remove('fade-out');
                drawCount = 0;
                counterNumEl.textContent = "0";
                isAnimating = false;
                checkOverlap();
            }

            function enterMainApp() {
                if (hasEntered) return;
                hasEntered = true;
                adjustCardHeight();
                introScreen.classList.add('fade-out');
                mainApp.classList.add('visible');
                btnWrapper.classList.add('active');
                counterEl.classList.add('active');
                drawCount = 0;
                counterNumEl.textContent = "0";
                currentCardList = BOOKS[currentBookKey].cards;
                recentIndices = [];
                if (currentCardList.length) {
                    currentCardIndex = 0;
                    updateCardDOM(currentCardList[0]);
                }
                drawBtn.disabled = false;
                btnTextEl.textContent = '随机抽取';
                drawCard();
                checkOverlap();
            }

            async function drawCard() {
                if (isAnimating || !hasEntered || !currentCardList.length) return;
                isAnimating = true;
                drawBtn.disabled = true;
                btnTextEl.textContent = '抽取中...';
                drawBtn.style.animationPlayState = 'paused';
                const finalIndex = getRandomCardIndexAvoidRecent();
                const switchCount = Math.min(5, currentCardList.length);
                let tempIndices = [];
                for (let i = 0; i < switchCount; i++) {
                    let idx = getRandomCardIndexAvoidRecent();
                    if (i === 0 && idx === currentCardIndex && currentCardList.length > 1) {
                        let newIdx = getRandomCardIndexAvoidRecent();
                        while (newIdx === currentCardIndex && currentCardList.length > 1) newIdx =
                            getRandomCardIndexAvoidRecent();
                        idx = newIdx;
                    }
                    tempIndices.push(idx);
                }
                const intervals = [70, 90, 120, 160, 200];
                for (let i = 0; i < tempIndices.length; i++) {
                    await new Promise(r => { cardContentEl.classList.add('hiding');
                        setTimeout(r, 60); });
                    updateCardDOM(currentCardList[tempIndices[i]]);
                    currentCardIndex = tempIndices[i];
                    await new Promise(r => { cardContentEl.classList.remove('hiding');
                        setTimeout(r, 70); });
                    if (i < tempIndices.length - 1) await new Promise(r => setTimeout(r, intervals[i]));
                }
                await new Promise(r => setTimeout(r, 180));
                await new Promise(r => { cardContentEl.classList.add('hiding');
                    setTimeout(r, 60); });
                updateCardDOM(currentCardList[finalIndex]);
                currentCardIndex = finalIndex;
                recordRecentIndex(finalIndex);
                await new Promise(r => { cardContentEl.classList.remove('hiding');
                    setTimeout(r, 80); });
                cardEl.classList.add('glow');
                setTimeout(() => cardEl.classList.remove('glow'), 700);
                drawCount++;
                counterNumEl.textContent = drawCount;
                drawBtn.disabled = false;
                btnTextEl.textContent = '随机抽取';
                drawBtn.style.animationPlayState = 'running';
                isAnimating = false;
            }

            function copyCardContent() {
                if (!hasEntered) return;
                const title = cardTitleEl.textContent;
                const subtitle = cardSubtitleEl.textContent;
                const text = `「${title}」\n${subtitle.replace(/\n/g, ' ')}`;
                navigator.clipboard.writeText(text).then(() => showCopyToast()).catch(() => {
                    const ta = document.createElement('textarea');
                    ta.value = text;
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    document.body.removeChild(ta);
                    showCopyToast();
                });
            }

            function showCopyToast() {
                if (toastTimer) clearTimeout(toastTimer);
                copyToast.classList.add('show');
                toastTimer = setTimeout(() => copyToast.classList.remove('show'), 1800);
            }

            function adjustCardHeight() {
                if (!cardEl || !bookTitleDecorEl || !btnWrapper) return;
                const titleRect = bookTitleDecorEl.getBoundingClientRect();
                const btnWrapperRect = btnWrapper.getBoundingClientRect();
                const viewportHeight = window.innerHeight;
                const topBoundary = titleRect.bottom;
                const bottomBoundary = btnWrapperRect.top;
                const availableHeight = bottomBoundary - topBoundary;
                // 【优化】增大安全间距与减小最大比例，使卡片视觉上稍小
                const safePadding = Math.max(36, viewportHeight * 0.04);
                const idealCardHeight = availableHeight - safePadding;
                const absMinHeight = 340;
                const absMaxHeight = Math.min(700, viewportHeight * 0.72);
                let targetHeight = Math.max(absMinHeight, Math.min(idealCardHeight, absMaxHeight));
                if (cardHeightSet && Math.abs(targetHeight - lastSetCardHeight) < 2) return;
                cardEl.style.height = targetHeight + 'px';
                cardEl.style.maxHeight = 'none';
                cardEl.style.minHeight = absMinHeight + 'px';
                lastSetCardHeight = targetHeight;
                cardHeightSet = true;
            }

            function checkOverlap() {
                if (!bookTitleDecorEl || !counterEl) return;
                const isCounterVisible = counterEl.classList.contains('active');
                if (!isCounterVisible) { bookTitleDecorEl.classList.remove('compact'); return; }
                const titleRect = bookTitleDecorEl.getBoundingClientRect();
                const counterRect = counterEl.getBoundingClientRect();
                const minGap = 12;
                if (titleRect.right + minGap > counterRect.left) { bookTitleDecorEl.classList.add(
                    'compact'); } else { bookTitleDecorEl.classList.remove('compact'); }
            }

            function debounce(fn, delay) { let timer; return function(...args) { clearTimeout(timer);
                    timer = setTimeout(() => fn.apply(this, args), delay); }; }
            const debouncedAdjustCardHeight = debounce(adjustCardHeight, 180);
            const debouncedCheckOverlap = debounce(checkOverlap, 150);

            window.addEventListener('resize', () => { debouncedAdjustCardHeight();
                updateFadeVisibility();
                debouncedCheckOverlap(); });
            window.addEventListener('orientationchange', () => { setTimeout(adjustCardHeight, 250);
                setTimeout(checkOverlap, 280); });

            function initFromURL() {
                const params = new URLSearchParams(window.location.search);
                let bookParam = params.get('book');
                // 只有 URL 明确指定了有效典籍时才切换，否则保持默认的 currentBookKey
                if (bookParam && BOOKS[bookParam]) {
                    currentBookKey = bookParam;
                } else if (!BOOKS[currentBookKey]) {
                    // 如果默认值恰好不在 BOOKS 中（例如被删除），才回退到第一个
                    currentBookKey = Object.keys(BOOKS)[0];
                }
                currentCardList = BOOKS[currentBookKey].cards;
                currentCardIndex = 0;
                drawCount = 0;
                recentIndices = [];
                refreshCoverUI();
                if (currentCardList.length) updateCardDOM(currentCardList[0]);
                requestAnimationFrame(() => requestAnimationFrame(() => { adjustCardHeight(); checkOverlap(); }));
            }

            function openQrLightbox() { if (!qrLightbox || !qrLightboxImg || !qrMiniImg) return;
                const largeSrc = qrMiniImg.dataset.largeSrc || qrMiniImg.src;
                qrLightboxImg.src = largeSrc;
                qrLightboxImg.onerror = () => { if (qrLightboxImg.src !== qrMiniImg.src) qrLightboxImg.src =
                        qrMiniImg.src; };
                qrLightbox.classList.add('show'); }

            function closeQrLightbox() { if (qrLightbox) qrLightbox.classList.remove('show'); }

            suggestModal.addEventListener('click', () => suggestModal.classList.remove('show'));
            closeSuggestBtn.addEventListener('click', (e) => { e.stopPropagation();
                suggestModal.classList.remove('show'); });
            document.querySelector('.suggest-card')?.addEventListener('click', (e) => e.stopPropagation());
            if (qrLightbox) qrLightbox.addEventListener('click', closeQrLightbox);
            if (closeLightboxBtn) closeLightboxBtn.addEventListener('click', (e) => { e.stopPropagation();
                closeQrLightbox(); });
            document.querySelector('.qr-lightbox-card')?.addEventListener('click', (e) => e.stopPropagation());

            bookSearchInput?.addEventListener('input', () => renderBookList());
            const observer = new MutationObserver(() => updateFadeVisibility());
            if (bookSelector) observer.observe(bookSelector, { childList: true, subtree: true,
            attributes: true });
            introScreen.addEventListener('click', (e) => { if (e.target.closest('.book-selector-item') || e
                    .target.closest('.book-search-input')) return;
                enterMainApp(); });
            drawBtn.addEventListener('click', (e) => { const rect = drawBtn.getBoundingClientRect();
                const ripple = document.createElement('span');
                ripple.classList.add('btn__ripple');
                ripple.style.width = ripple.style.height = Math.max(rect.width, rect.height) + 'px';
                ripple.style.left = (e.clientX - rect.left - ripple.offsetWidth / 2) + 'px';
                ripple.style.top = (e.clientY - rect.top - ripple.offsetHeight / 2) + 'px';
                drawBtn.appendChild(ripple);
                ripple.addEventListener('animationend', () => ripple.remove());
                drawCard(); });
            cardCopyArea.addEventListener('click', (e) => { e.stopPropagation();
                copyCardContent(); });
            titleGroupTrigger?.addEventListener('click', (e) => { e.stopPropagation(); if (hasEntered)
                    exitToCover(); });
            document.getElementById('qrMiniContainer')?.addEventListener('click', (e) => { e.stopPropagation();
                openQrLightbox(); });
            window.addEventListener('popstate', () => { const params = new URLSearchParams(window.location
                    .search);
                let book = params.get('book'); if (book && BOOKS[book]) { currentBookKey = book;
                    currentCardList = BOOKS[currentBookKey].cards;
                    drawCount = 0; if (counterNumEl) counterNumEl.textContent = "0";
                    recentIndices = [];
                    refreshCoverUI(); if (hasEntered) exitToCover(); } else { currentBookKey = Object.keys(
                        BOOKS)[0];
                    currentCardList = BOOKS[currentBookKey].cards;
                    refreshCoverUI(); if (hasEntered) exitToCover(); }
                setTimeout(() => { adjustCardHeight();
                    checkOverlap(); }, 150); });
            initFromURL();
        })();
    </script>
</body>
</html>
