<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>人生卡壳，翻翻名册 · 智慧典籍卡片</title>
    <style>
        :root {
            --bg-from: #f5f0e8;
            --bg-via: #efe8dc;
            --bg-to: #e8dfd0;
            --text-title: #1a1008;
            --text-sub: #5c4a36;
            --text-counter: #9e8b78;
            --btn-text: #fdf8f0;
            --theme-r: 180;
            --theme-g: 35;
            --theme-b: 35;
            --card-bg-r: 255;
            --card-bg-g: 248;
            --card-bg-b: 240;
            --card-bg-alpha: 1;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            background: linear-gradient(160deg, var(--bg-from) 0%, var(--bg-via) 40%, var(--bg-to) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            transition: background 0.8s ease;
        }

        .bg-orb {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            filter: blur(90px);
            transition: background 0.8s ease;
        }
        .bg-orb--top {
            width: 480px;
            height: 480px;
            background: radial-gradient(circle, rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.3) 0%, transparent 70%);
            top: -200px;
            right: -140px;
            opacity: 0.4;
        }
        .bg-orb--bottom {
            width: 360px;
            height: 360px;
            background: radial-gradient(circle, rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.25) 0%, transparent 70%);
            bottom: -160px;
            left: -120px;
            opacity: 0.35;
        }
        .bg-orb--mid {
            width: 220px;
            height: 220px;
            background: radial-gradient(circle, rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.18) 0%, transparent 70%);
            top: 45%;
            left: 50%;
            opacity: 0.28;
        }

        .book-title-decor {
            position: fixed;
            top: clamp(20px, 4vh, 36px);
            top: calc(clamp(20px, 4vh, 36px) + env(safe-area-inset-top, 0px));
            left: clamp(24px, 5vw, 48px);
            z-index: 10;
            pointer-events: auto;
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 8px 18px 8px 12px;
            border-radius: 60px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.05), 0 0 0 1px rgba(255, 255, 255, 0.5);
            transition: all 0.3s ease;
        }
        .book-title-decor:hover {
            background: rgba(255, 255, 255, 0.8);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
        }
        .book-title-decor.compact {
            padding: 6px 10px 6px 8px;
            gap: 6px;
        }
        .book-title-decor.compact .qr-mini-img {
            width: 36px;
            height: 36px;
        }
        .book-title-decor.compact .main-title-text {
            font-size: 0.8rem;
        }
        .book-title-decor.compact .switch-trigger,
        .book-title-decor.compact .book-title-sub {
            font-size: 0.62rem;
        }
        .book-title-decor.compact .qr-mini::after {
            display: none;
        }

        .qr-mini {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            cursor: pointer;
            transition: transform 0.2s ease;
            border-radius: 14px;
            background: white;
            padding: 4px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
            position: relative;
        }
        .qr-mini:hover {
            transform: scale(1.04);
        }
        .qr-mini:active {
            transform: scale(0.96);
        }
        .qr-mini::after {
            content: '点击放大';
            position: absolute;
            bottom: -22px;
            left: 50%;
            transform: translateX(-50%) translateY(4px);
            font-size: 0.6rem;
            color: #9e8b78;
            white-space: nowrap;
            opacity: 0;
            transition: all 0.25s ease;
            pointer-events: none;
            font-family: 'PingFang SC', system-ui;
            letter-spacing: 0.04em;
        }
        .qr-mini:hover::after {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .qr-mini-img {
            width: 48px;
            height: 48px;
            display: block;
            border-radius: 10px;
            background: white;
        }

        .title-group {
            display: flex;
            flex-direction: column;
            cursor: pointer;
            border-radius: 40px;
            padding: 4px 10px 4px 10px;
            transition: background 0.2s ease;
        }
        .title-group:active {
            background: rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.08);
        }
        .main-title-text {
            font-family: 'Songti SC', 'STSong', 'Noto Serif SC', 'KaiTi', 'STKaiti', serif;
            font-size: clamp(0.9rem, 1.8vw, 1.25rem);
            font-weight: 700;
            color: rgb(var(--theme-r), var(--theme-g), var(--theme-b));
            letter-spacing: 0.06em;
            transition: color 0.8s ease;
            text-shadow: 0 1px 2px rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.1);
            white-space: nowrap;
            line-height: 1.3;
        }
        .subtitle-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 2px;
        }
        .switch-trigger {
            font-family: 'PingFang SC', system-ui;
            font-size: 0.7rem;
            font-weight: 500;
            background: rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.15);
            padding: 4px 10px;
            border-radius: 30px;
            color: rgb(var(--theme-r), var(--theme-g), var(--theme-b));
            transition: all 0.2s;
            white-space: nowrap;
            letter-spacing: 0.03em;
            line-height: 1;
        }
        .title-group:hover .switch-trigger {
            background: rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.25);
            transform: translateY(-1px);
        }
        .book-title-sub {
            font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif;
            font-size: 0.7rem;
            font-weight: 500;
            color: rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.75);
            letter-spacing: 0.08em;
            transition: color 0.8s ease;
            white-space: nowrap;
        }

        .counter {
            position: fixed;
            top: clamp(24px, 5vh, 40px);
            top: calc(clamp(24px, 5vh, 40px) + env(safe-area-inset-top, 0px));
            right: clamp(24px, 5vw, 48px);
            z-index: 10;
            font-family: 'SF Mono', monospace;
            font-size: 0.8rem;
            color: var(--text-counter);
            letter-spacing: 0.06em;
            display: flex;
            align-items: center;
            gap: 8px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.4s ease;
            background: rgba(255, 255, 255, 0.7);
            padding: 8px 16px;
            border-radius: 20px;
            backdrop-filter: blur(8px);
        }
        .counter.active {
            opacity: 1;
        }
        .counter__dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: rgb(var(--theme-r), var(--theme-g), var(--theme-b));
            opacity: 0.8;
            animation: dotPulse 2s ease-in-out infinite;
            transition: background 0.8s ease;
        }
        @keyframes dotPulse {
            0%,
            100% {
                opacity: 0.4;
                transform: scale(0.7);
            }
            50% {
                opacity: 1;
                transform: scale(1.4);
            }
        }

        .intro-screen {
            position: fixed;
            inset: 0;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            transition: opacity 0.7s ease, visibility 0.7s ease;
            opacity: 1;
            visibility: visible;
            cursor: pointer;
            pointer-events: all;
            background: linear-gradient(160deg, #f7f3eb 0%, #f2ece1 40%, #ebe3d5 100%);
        }
        .intro-screen.fade-out {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .intro-card {
            background: #ffffff;
            border-radius: 36px;
            padding: 32px 32px 48px;
            max-width: 620px;
            width: 88vw;
            box-shadow: 0 4px 20px rgba(60, 40, 20, 0.07), 0 12px 48px rgba(60, 40, 20, 0.1);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            animation: cardEntry 0.8s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
            border-left: 5px solid #c0392b;
            overflow: visible;
        }
        /* 封面重新入场技巧 */
        .intro-card.respawn {
            animation-name: cardEntryRespawn;
            animation-duration: 0.6s;
            animation-fill-mode: forwards;
        }
        @keyframes cardEntryRespawn {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .book-search {
            width: 100%;
            max-width: 320px;
            margin: 4px 0 8px;
        }
        .book-search-input {
            width: 100%;
            padding: 10px 16px;
            font-family: 'PingFang SC', system-ui;
            font-size: 0.9rem;
            border: 1px solid rgba(180, 35, 35, 0.25);
            border-radius: 60px;
            background: rgba(255, 248, 240, 0.8);
            outline: none;
            transition: all 0.2s;
            text-align: center;
            color: #2c2418;
        }
        .book-search-input:focus {
            border-color: #c0392b;
            box-shadow: 0 0 0 3px rgba(192, 57, 43, 0.1);
        }
        .book-stats {
            font-size: 0.75rem;
            color: #9e8b78;
            background: rgba(0, 0, 0, 0.03);
            padding: 4px 12px;
            border-radius: 30px;
            display: inline-block;
            margin-bottom: 4px;
            letter-spacing: 0.02em;
        }
        .book-selector-wrapper {
            position: relative;
            width: 100%;
            margin-bottom: 4px;
        }
        .book-selector {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            max-height: 260px;
            overflow-y: auto;
            padding: 8px 12px;
            width: 100%;
            scrollbar-width: thin;
        }
        .book-selector::-webkit-scrollbar {
            width: 4px;
            height: 4px;
        }
        .book-selector::-webkit-scrollbar-track {
            background: #f0eadd;
            border-radius: 4px;
        }
        .book-selector::-webkit-scrollbar-thumb {
            background: rgba(180, 35, 35, 0.3);
            border-radius: 4px;
        }
        .selector-fade {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 40px;
            background: linear-gradient(to bottom, transparent, rgba(255, 255, 255, 0.95));
            pointer-events: none;
            border-radius: 0 0 20px 20px;
            transition: opacity 0.2s ease;
            opacity: 0;
            z-index: 2;
        }
        .book-selector-wrapper.scrollable .selector-fade {
            opacity: 0.9;
        }
        .book-selector-item {
            font-family: 'PingFang SC', system-ui;
            font-size: 0.85rem;
            font-weight: 550;
            padding: 6px 16px;
            border-radius: 40px;
            background: rgba(0, 0, 0, 0.02);
            border: 1px solid rgba(180, 35, 35, 0.2);
            cursor: pointer;
            transition: all 0.2s ease;
            color: #5c4a36;
            backdrop-filter: blur(4px);
            white-space: nowrap;
        }
        .book-selector-item.active {
            background: #c0392b;
            color: white;
            border-color: #c0392b;
            box-shadow: 0 4px 12px rgba(192, 57, 43, 0.3);
        }
        .book-selector-item:hover:not(.active) {
            background: rgba(192, 57, 43, 0.1);
            transform: translateY(-2px);
        }
        .book-selector-item.suggest-btn {
            background: rgba(192, 57, 43, 0.08);
            border-color: rgba(192, 57, 43, 0.4);
            color: #c0392b;
            font-weight: 600;
        }
        .book-selector-item.suggest-btn:hover {
            background: rgba(192, 57, 43, 0.18);
            transform: translateY(-2px);
        }

        .intro-emoji {
            font-size: clamp(3.5rem, 10vw, 5rem);
            display: block;
            animation: emojiFloat 3s ease-in-out infinite;
        }
        .intro-book-name {
            font-family: 'Songti SC', serif;
            font-size: clamp(1.3rem, 3vw, 1.9rem);
            font-weight: 700;
            color: #c0392b;
            letter-spacing: 0.08em;
            transition: transform 0.3s ease;
        }
        .intro-book-name.pulse {
            animation: bookNamePulse 0.5s ease;
        }
        @keyframes bookNamePulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }
        .intro-title {
            font-family: 'Songti SC', serif;
            font-size: clamp(1.4rem, 4vw, 2rem);
            font-weight: 700;
            color: var(--text-title);
        }
        .intro-divider {
            width: 48px;
            height: 4px;
            border-radius: 2px;
            background: linear-gradient(90deg, #c0392b, #e67e22);
        }
        .intro-subtitle {
            font-size: clamp(0.85rem, 1.6vw, 1rem);
            color: var(--text-sub);
            line-height: 1.5;
            max-width: 400px;
            margin: 0 10px;
        }
        .intro-hint {
            margin-top: 10px;
            font-size: clamp(0.95rem, 1.8vw, 1.1rem);
            color: #c0392b;
            animation: hintGlow 2.2s ease-in-out infinite;
            font-weight: 600;
            background: rgba(192, 57, 43, 0.1);
            padding: 10px 28px;
            border-radius: 30px;
            border: 2px solid rgba(192, 57, 43, 0.35);
            box-shadow: 0 4px 18px rgba(192, 57, 43, 0.18), 0 0 0 8px rgba(192, 57, 43, 0.04);
            letter-spacing: 0.04em;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .intro-hint:hover {
            background: rgba(192, 57, 43, 0.18);
            border-color: rgba(192, 57, 43, 0.55);
            box-shadow: 0 6px 24px rgba(192, 57, 43, 0.25), 0 0 0 14px rgba(192, 57, 43, 0.06);
            transform: translateY(-2px);
        }
        @keyframes hintGlow {
            0%,
            100% {
                opacity: 0.7;
                transform: translateY(0);
                box-shadow: 0 4px 18px rgba(192, 57, 43, 0.18), 0 0 0 8px rgba(192, 57, 43, 0.04);
            }
            40% {
                opacity: 1;
                transform: translateY(-5px);
                box-shadow: 0 8px 28px rgba(192, 57, 43, 0.3), 0 0 0 16px rgba(192, 57, 43, 0.08);
            }
            70% {
                transform: translateY(-2px);
                box-shadow: 0 5px 20px rgba(192, 57, 43, 0.22), 0 0 0 10px rgba(192, 57, 43, 0.05);
            }
        }

        .no-books-tip {
            font-size: 0.8rem;
            color: #9e8b78;
            padding: 12px;
        }
        .suggest-modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            z-index: 200;
            display: flex;
            align-items: center;
            justify-content: center;
            visibility: hidden;
            opacity: 0;
            transition: visibility 0.2s, opacity 0.2s;
            cursor: pointer;
        }
        .suggest-modal.show {
            visibility: visible;
            opacity: 1;
        }
        .suggest-card {
            background: white;
            border-radius: 32px;
            padding: 28px 24px 32px;
            max-width: 280px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            animation: scaleIn 0.25s ease-out;
            cursor: default;
        }
        @keyframes scaleIn {
            from {
                transform: scale(0.9);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }
        .suggest-qr {
            width: 200px;
            height: 200px;
            margin: 0 auto 16px;
            background: #f5f0e8;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .suggest-qr img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .suggest-text {
            font-family: 'PingFang SC', system-ui;
            font-size: 0.9rem;
            color: #5c4a36;
            margin-top: 8px;
            line-height: 1.4;
        }
        .close-suggest {
            margin-top: 16px;
            background: rgba(192, 57, 43, 0.1);
            padding: 6px 18px;
            border-radius: 40px;
            display: inline-block;
            font-size: 0.8rem;
            color: #c0392b;
            cursor: pointer;
            transition: 0.2s;
        }
        .close-suggest:hover {
            background: rgba(192, 57, 43, 0.2);
        }

        .qr-lightbox {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(10px);
            z-index: 180;
            display: flex;
            align-items: center;
            justify-content: center;
            visibility: hidden;
            opacity: 0;
            transition: visibility 0.2s, opacity 0.2s;
            cursor: pointer;
        }
        .qr-lightbox.show {
            visibility: visible;
            opacity: 1;
        }
        .qr-lightbox-card {
            background: white;
            border-radius: 32px;
            padding: 24px 20px 28px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
            animation: scaleIn 0.25s ease-out;
            cursor: default;
            max-width: 340px;
            width: 82vw;
        }
        .qr-lightbox-img-wrap {
            width: 100%;
            aspect-ratio: 1/1;
            max-width: 280px;
            margin: 0 auto 14px;
            background: #fafaf7;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.04);
        }
        .qr-lightbox-img-wrap img {
            width: 90%;
            height: 90%;
            object-fit: contain;
            border-radius: 8px;
        }
        .qr-lightbox-hint {
            font-size: 0.85rem;
            color: #5c4a36;
            font-family: 'PingFang SC', system-ui;
            letter-spacing: 0.03em;
            margin-bottom: 4px;
        }
        .close-lightbox {
            margin-top: 12px;
            background: rgba(192, 57, 43, 0.1);
            padding: 8px 22px;
            border-radius: 40px;
            display: inline-block;
            font-size: 0.85rem;
            color: #c0392b;
            cursor: pointer;
            transition: 0.2s;
            font-weight: 500;
            letter-spacing: 0.03em;
        }
        .close-lightbox:hover {
            background: rgba(192, 57, 43, 0.2);
        }

        .main-app {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            transition: opacity 0.7s ease;
            opacity: 0;
            pointer-events: none;
        }
        .main-app.visible {
            opacity: 1;
            pointer-events: all;
        }

        .card {
            position: relative;
            width: 92vw;
            max-width: 700px;
            height: 75vh;
            height: 75dvh;
            min-height: 380px;
            max-height: 680px;
            background: rgba(var(--card-bg-r), var(--card-bg-g), var(--card-bg-b), var(--card-bg-alpha));
            border-radius: 32px;
            box-shadow: 0 4px 24px rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.08);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 50px 36px 100px;
            animation: cardEntry 0.7s forwards;
            border-left: 6px solid rgb(var(--theme-r), var(--theme-g), var(--theme-b));
            transition: background 0.8s ease, border-left-color 0.8s ease, box-shadow 0.5s ease, height 0.35s ease;
        }
        .card.glow {
            border-left-color: rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.7);
            box-shadow: 0 4px 24px rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.12), 0 12px 56px rgba(var(--theme-r),
                        var(--theme-g), var(--theme-b), 0.15), 0 0 0 2px rgba(var(--theme-r), var(--theme-g), var(--theme-b),
                        0.15);
        }
        .card__content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            width: 100%;
            transition: opacity 0.12s ease, transform 0.12s ease;
            opacity: 1;
            transform: scale(1);
        }
        .card__content.hiding {
            opacity: 0;
            transform: scale(0.93);
            transition: opacity 0.08s ease, transform 0.08s ease;
        }
        .card__emoji {
            font-size: clamp(3.5rem, 8vw, 5.5rem);
            line-height: 1;
            margin-bottom: clamp(18px, 3.5vh, 30px);
            animation: emojiFloat 3s ease-in-out infinite;
            filter: drop-shadow(0 6px 16px rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.25));
        }
        .card__copy-area {
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            border-radius: 16px;
            padding: 12px 8px;
            transition: background 0.1s;
        }
        .card__copy-area:active {
            background: rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.04);
        }
        .card__title {
            font-family: 'Songti SC', serif;

                        { emoji: '💧', title: '上善若水', subtitle: '水善利万物而不争，处众人之所恶，故几于道。\n白话：最高境界的善像水一样，滋养万物却不争功，甘居低处，最接近道。' },
                        { emoji: '🏺', title: '功遂身退，天之道', subtitle: '持而盈之，不如其已；揣而锐之，不可长保。\n白话：水满则溢，锋芒易折。功成后主动退身，才合乎天道。' },
                        { emoji: '👶', title: '专气致柔，能如婴儿乎', subtitle: '载营魄抱一，能无离乎？涤除玄览，能无疵乎？\n白话：身心合一、气息柔和，回归婴儿般的天真纯净状态，是修养的境界。' },
                        { emoji: '🪟', title: '有之以为利，无之以为用', subtitle: '三十辐共一毂，当其无，有车之用。\n白话：车轮因中空才能转动，房屋因空间才能住人。真正的价值往往藏在“空”里。' },
                        { emoji: '😵', title: '五色令人目盲', subtitle: '五音令人耳聋，五味令人口爽，驰骋畋猎令人心发狂。\n白话：过度追求感官刺激反而失去真正感知力。简朴生活让心灵更敏锐。' },
                        { emoji: '😨', title: '宠辱若惊，贵大患若身', subtitle: '何谓宠辱若惊？宠为下，得之若惊，失之若惊。\n白话：得宠和受辱都让人心惊，因为太看重自我。放下身段，才能宠辱不惊。' },
                        { emoji: '🌫️', title: '视之不见名曰夷', subtitle: '听之不闻名曰希，搏之不得名曰微。此三者不可致诘，故混而为一。\n白话：道看不见、听不到、摸不着，但它浑然一体，真实存在。' },
                        { emoji: '🐢', title: '古之善为士者，微妙玄通', subtitle: '豫兮若冬涉川，犹兮若畏四邻，俨兮其若客。\n白话：得道之人谨慎、警觉、庄重，像冬天过河，像防备四周，像去做客一样恭敬。' },
                        { emoji: '🧘', title: '致虚极，守静笃', subtitle: '万物并作，吾以观其复。夫物芸芸，各复归其根。\n白话：让心回归彻底的虚静，才能看清万物循环往复的根本规律。静下来，才能看透。' },
                        { emoji: '🌊', title: '太上，下知有之', subtitle: '其次亲而誉之，其次畏之，其次侮之。\n白话：最好的管理者，百姓只感到他的存在。少干预多信任，无为反而有大治。' },
                        { emoji: '❌', title: '大道废，有仁义', subtitle: '智慧出，有大伪；六亲不和，有孝慈；国家昏乱，有忠臣。\n白话：越标榜仁义越说明大道已失，越卖弄智慧越滋生虚伪。返璞归真才是根本。' },
                        { emoji: '🐂', title: '绝圣弃智，民利百倍', subtitle: '绝仁弃义，民复孝慈；绝巧弃利，盗贼无有。\n白话：抛弃过度的聪明和技巧，人民反而能得到更多实在的好处。简单比复杂更有力量。' },
                        { emoji: '🍼', title: '我独泊兮其未兆，如婴儿之未孩', subtitle: '众人皆有余，而我独若遗。我愚人之心也哉！\n白话：得道之人和世人不同，淡泊宁静像还不会笑的婴儿。大智若愚，自得其乐。' },
                        { emoji: '🌪️', title: '孔德之容，惟道是从', subtitle: '道之为物，惟恍惟惚。惚兮恍兮，其中有象。\n白话：大德的样貌完全跟随道。道虽然恍恍惚惚，但其中却有真实的形象和精华。' },
                        { emoji: '🌀', title: '曲则全，枉则直', subtitle: '洼则盈，敝则新，少则得，多则惑。\n白话：委曲反而能保全，低洼反而能充盈。不必处处争强，退一步海阔天空。' },
                        { emoji: '🌬️', title: '希言自然', subtitle: '故飘风不终朝，骤雨不终日。孰为此者？天地。\n白话：少说多做合乎自然。狂风暴雨都持续不了多久，太张扬声势的往往不长久。' },
                        { emoji: '🧍', title: '企者不立，跨者不行', subtitle: '自见者不明，自是者不彰，自伐者无功，自矜者不长。\n白话：踮着脚站不稳，跳着走走不远。自负逞强的人恰恰暴露了虚弱。' },
                        { emoji: '🌌', title: '有物混成，先天地生', subtitle: '寂兮寥兮，独立而不改，周行而不殆，可以为天下母。\n白话：有一种浑然一体的东西，先于天地存在，寂静空虚，独立运行，是天地的母亲。' },
                        { emoji: '🌱', title: '重为轻根，静为躁君', subtitle: '是以君子终日行不离辎重。\n白话：稳重是轻浮的根基，冷静是躁动的主宰。成大事者必先沉住气。' },
                        { emoji: '👣', title: '善行无辙迹', subtitle: '善言无瑕谪，善计不用筹策，善闭无关楗而不可开。\n白话：真正善于作为的人，不留痕迹，不显刻意。大巧若拙，善用无形之力。' },
                        { emoji: '🕊️', title: '知其雄，守其雌', subtitle: '为天下谿。为天下谿，常德不离，复归于婴儿。\n白话：明知刚强，却安守柔弱，甘做天下的溪谷。这样永恒的德不会离身，回到婴儿的状态。' },
                        { emoji: '🛠️', title: '将欲取天下而为之，吾见其不得已', subtitle: '天下神器，不可为也，不可执也。\n白话：强夺天下往往失败。天下是神圣的，不能用强力治理，不能硬性把持。' },
                        { emoji: '🕊️', title: '以道佐人主者，不以兵强天下', subtitle: '其事好还。师之所处，荆棘生焉。\n白话：用道辅佐君主的人，不靠武力逞强。暴力会有报应，战火过后必是荒凉。' },
                        { emoji: '⚔️', title: '夫兵者，不祥之器', subtitle: '物或恶之，故有道者不处。兵者不祥之器，非君子之器。\n白话：武力是不吉利的东西，有道之人不倚仗它。不得已才用，淡然处之。' },
                        { emoji: '🌳', title: '道常无名，朴虽小', subtitle: '天下莫能臣也。侯王若能守之，万物将自宾。\n白话：道虽质朴无名，但天下没人能让它臣服。守住道，万物自然归顺。' },
                        { emoji: '🔮', title: '知人者智，自知者明', subtitle: '胜人者有力，自胜者强。知足者富，强行者有志。\n白话：了解别人是聪明，看清自己是智慧。战胜自己比战胜别人更强大。知足才是富足。' },
                        { emoji: '📜', title: '大道泛兮，其可左右', subtitle: '万物恃之以生而不辞，功成而不有。\n白话：大道像江河一样无处不在，养育万物却不占有。真正的伟大是不居功。' },
                        { emoji: '🤲', title: '执大象，天下往', subtitle: '往而不害，安平太。乐与饵，过客止。\n白话：执守大道，天下人都会来归附，不相伤害，共享安宁。' },
                        { emoji: '🐟', title: '将欲歙之，必固张之', subtitle: '将欲弱之，必固强之；将欲废之，必固兴之。\n白话：想要收敛，不妨先让它张开。物极必反，柔弱胜过刚强的智慧。' },
                        { emoji: '🐢', title: '道常无为而无不为', subtitle: '侯王若能守之，万物将自化。\n白话：道看似什么也不做，其实什么都成就了。不妄为反而能成事。' },
                        { emoji: '🎩', title: '上德不德，是以有德', subtitle: '下德不失德，是以无德。上德无为而无以为。\n白话：真正有德的人不标榜德，所以有德；下德的人死守“德”的架子，其实无德。德在无心作为。' },
                        { emoji: '1️⃣', title: '昔之得一者', subtitle: '天得一以清，地得一以宁，神得一以灵，谷得一以盈。\n白话：万物得到“道”这一根本，天清地宁，神灵活现。守住根本，万物自正。' },
                        { emoji: '🚫', title: '反者道之动，弱者道之用', subtitle: '天下万物生于有，有生于无。\n白话：循环往复是道的运动方式，柔弱是道的作用形式。从无到有，再从有归无。' },
                        { emoji: '💡', title: '上士闻道，勤而行之', subtitle: '中士闻道，若存若亡；下士闻道，大笑之。不笑不足以为道。\n白话：上等人听了道就行动，中等人半信半疑，下等人嘲笑。被嘲笑的正说明是真道。' },
                        { emoji: '🔢', title: '道生一，一生二', subtitle: '二生三，三生万物。万物负阴而抱阳，冲气以为和。\n白话：万物都由简单到复杂演化而来，阴阳平衡、二气调和才能生生不息。' },
                        { emoji: '💧', title: '天下之至柔，驰骋天下之至坚', subtitle: '无有入无间，吾是以知无为之有益。\n白话：最柔弱的水能穿透最坚硬的岩石。无形的力量能进入没有间隙的地方，无为的好处就在这里。' },
                        { emoji: '💰', title: '名与身孰亲', subtitle: '身与货孰多？得与亡孰病？甚爱必大费，多藏必厚亡。\n白话：名声和生命哪个更亲？过分贪爱必定付出巨大代价，过度囤积必然损失惨重。知足才能长久。' },
                        { emoji: '✨', title: '大成若缺，其用不弊', subtitle: '大盈若冲，其用不穷。大直若屈，大巧若拙，大辩若讷。\n白话：最圆满的好像有缺陷，最灵巧的反似笨拙。不追求表面的完美，能量才取之不竭。' },
                        { emoji: '😌', title: '天下有道，却走马以粪', subtitle: '天下无道，戎马生于郊。\n白话：治理有道，战马用来耕地；天下无道，母马在战场生驹。和平比战争更可贵。' },
                        { emoji: '🌍', title: '不出户，知天下', subtitle: '不窥牖，见天道。其出弥远，其知弥少。\n白话：不走出门也能知天下事，心里清静才能明理。向外求索越远，离真知反而越远。' },
                        { emoji: '➕', title: '为学日益，为道日损', subtitle: '损之又损，以至于无为。无为而无不为。\n白话：求学问是加法，修大道是减法。减掉多余欲望，反而什么都能成就。' },
                        { emoji: '💗', title: '圣人常无心，以百姓心为心', subtitle: '善者吾善之，不善者吾亦善之，德善。\n白话：圣人没有私心，以百姓的心愿为自己的心愿。对谁都以善意相待，才是真善。' },
                        { emoji: '🌳', title: '出生入死', subtitle: '生之徒十有三，死之徒十有三，人之生动之死地亦十有三。\n白话：长寿、短命、自己找死各占三分之一。善于养生者不入死地，虎狼兵戈都伤不到他。' },
                        { emoji: '🐣', title: '道生之，德畜之', subtitle: '物形之，势成之。是以万物莫不尊道而贵德。\n白话：道生万物，德养育万物。道和德的尊贵在于不干涉，让万物自然生长。' },
                        { emoji: '🕯️', title: '天下有始，以为天下母', subtitle: '既得其母，以知其子；既知其子，复守其母，没身不殆。\n白话：道是天下的母亲，握住了母亲就认识了孩子。回到本源，终身没有危险。' },
                        { emoji: '🛤️', title: '使我介然有知，行于大道', subtitle: '唯施是畏。大道甚夷，而民好径。\n白话：哪怕略有所知，走在大道上也怕走入邪路。大道很平坦，但人总爱抄捷径。走捷径往往偏离正道。' },
                        { emoji: '🏗️', title: '善建者不拔，善抱者不脱', subtitle: '子孙以祭祀不辍。修之于身，其德乃真。\n白话：善于建树的不可拔除，善于抱持的不会脱落。从修身开始积德，德的能量会扩散到天下。' },
                        { emoji: '👶', title: '含德之厚，比于赤子', subtitle: '毒虫不螫，猛兽不据，攫鸟不搏。\n白话：德行深厚的人像婴儿一样柔软天真，毒虫猛兽都不伤害他。守住天真，和气充盈。' },
                        { emoji: '🤫', title: '知者不言，言者不知', subtitle: '塞其兑，闭其门，挫其锐，解其纷，和其光，同其尘。\n白话：真懂的人不乱说，夸夸其谈的未必真懂。闭上嘴巴，收敛锋芒，混同尘世，才叫玄同。' },
                        { emoji: '⚔️', title: '以正治国，以奇用兵', subtitle: '以无事取天下。吾何以知其然哉？以此。\n白话：治国要正道光明，用兵要奇诡多变。但取信天下靠的是不生事、不扰民。' },
                        { emoji: '😊', title: '其政闷闷，其民淳淳', subtitle: '其政察察，其民缺缺。祸兮福之所倚，福兮祸之所伏。\n白话：政治宽厚，民风就淳朴；法苛政严，民风反而不厚道。祸福相依，不用太执着。' },
                        { emoji: '🌿', title: '治人事天，莫若啬', subtitle: '夫唯啬，是谓早服。早服谓之重积德。\n白话：一个人处理人事、侍奉天地，最重要的就是爱惜自己的精气。节俭积蓄，就是不断的积德。' },
                        { emoji: '🐟', title: '治大国若烹小鲜', subtitle: '以道莅天下，其鬼不神。\n白话：治理大国像煎小鱼一样，不能总翻动，不能折腾百姓。少扰民就是大治。' },
                        { emoji: '🤝', title: '大国者下流', subtitle: '天下之交，天下之牝。牝常以静胜牡，以静为下。\n白话：大国要像江河的下游一样谦虚处下。宁静、谦下反而能吸引和统率小国。' },
                        { emoji: '🛡️', title: '道者，万物之奥', subtitle: '善人之宝，不善人之所保。美言可以市尊，美行可以加人。\n白话：道是万物的庇护所，善人当宝贝，不善的人也要依靠它。好话可以换来尊敬，好行为可以影响人。' },
                        { emoji: '🧘', title: '为无为，事无事，味无味', subtitle: '大小多少，报怨以德。图难于其易，为大于其细。\n白话：以无为的态度作为，从容易处解决难题，从细微处做成大事。难事必作于易。' },
                        { emoji: '🌄', title: '其安易持，其未兆易谋', subtitle: '其脆易泮，其微易散。为之于未有，治之于未乱。\n白话：局面安定时容易维系，事变未发生时容易谋划。在还没出问题时就开始防患，才是高手。' },
                        { emoji: '🤲', title: '古之善为道者，非以明民，将以愚之', subtitle: '民之难治，以其智多。故以智治国，国之贼。\n白话：古来行道者不是教人机巧诈伪，而是让人民保持淳朴。太多算计反而难治。' },
                        { emoji: '🌊', title: '江海之所以能为百谷王者', subtitle: '以其善下之，故能为百谷王。\n白话：江海甘愿低处，才汇聚百川。谦卑处下反而能成为领袖。' },
                        { emoji: '🧭', title: '我有三宝，持而保之', subtitle: '一曰慈，二曰俭，三曰不敢为天下先。慈故能勇，俭故能广，不敢为天下先故能成器长。\n白话：人生三样法宝：慈悲、节俭、不争强好胜。守这三样一生平安。' },
                        { emoji: '🤼', title: '善为士者不武', subtitle: '善战者不怒，善胜敌者不与，善用人者为之下。\n白话：好统帅不逞勇斗狠，善战者不动怒。不战而屈人之兵，才是真正的高手。' },
                        { emoji: '⚠️', title: '用兵有言', subtitle: '吾不敢为主而为客，不敢进寸而退尺。\n白话：我不敢先发动进攻，宁可退一尺。被动应战、不逞强，反而更有力量。' },
                        { emoji: '💭', title: '吾言甚易知，甚易行', subtitle: '天下莫能知，莫能行。言有宗，事有君。\n白话：我的话很简单易懂，可世人就是做不到。知易行难，真修行在实践。' },
                        { emoji: '🛡️', title: '知不知，上；不知知，病', subtitle: '圣人不病，以其病病。夫唯病病，是以不病。\n白话：知道自己的无知是最高境界，不懂装懂才是毛病。圣人把毛病当毛病来治，反而没有毛病。' },
                        { emoji: '😨', title: '民不畏威，则大威至', subtitle: '无狎其所居，无厌其所生。夫唯不厌，是以不厌。\n白话：当人民不怕统治者威压时，可怕的危机就要来了。不要逼得人民无处安居、无以谋生。' },
                        { emoji: '✖️', title: '勇于敢则杀，勇于不敢则活', subtitle: '天网恢恢，疏而不失。\n白话：大胆妄为者自取灭亡，谨慎不妄动者能保全。天道像一张大网，虽然稀疏却从不漏过。' },
                        { emoji: '⚖️', title: '民不畏死，奈何以死惧之', subtitle: '若使民常畏死，而为奇者，吾得执而杀之，孰敢？\n白话：人民连死都不怕了，用死来吓唬有什么用？用杀戮威慑，只会适得其反。' },
                        { emoji: '🍞', title: '民之饥，以其上食税之多', subtitle: '民之难治，以其上之有为，是以难治。\n白话：百姓饥饿，是因为统治者吞吃的赋税太多；百姓难治，是因为统治者政令太多、折腾太多。' },
                        { emoji: '🍃', title: '人之生也柔弱，其死也坚强', subtitle: '故坚强者死之徒，柔弱者生之徒。\n白话：活着时身体柔软，死后才僵硬。柔弱是生命的状态，刚强反而接近死亡。' },
                        { emoji: '🎯', title: '天之道，损有余而补不足', subtitle: '人之道则不然，损不足以奉有余。\n白话：天道是减少多余的补给不足的，人道却反着来，让少得更少。富帮穷才合乎天道。' },
                        { emoji: '💧', title: '天下莫柔弱于水', subtitle: '而攻坚强者莫之能胜，以其无以易之。弱之胜强，柔之胜刚。\n白话：水是天下最柔弱的，但滴水能穿石。柔韧的力量胜过一切刚强。' },
                        { emoji: '🤝', title: '和大怨，必有余怨', subtitle: '是以圣人执左契而不责于人。有德司契，无德司彻。\n白话：结下大怨即使和解也留伤疤，不如一开始就不结怨。圣人拿着借据却不催讨，有德者宽厚，无德者苛刻。' },
                        { emoji: '🏡', title: '小国寡民', subtitle: '甘其食，美其服，安其居，乐其俗。\n白话：理想生活是简单知足，吃得香穿得暖住得安，不和别人攀比。' },
                        { emoji: '🗣️', title: '信言不美，美言不信', subtitle: '善者不辩，辩者不善。知者不博，博者不知。\n白话：可信的话不花哨，花哨的不可信。真话往往朴实，巧言往往另有目的。圣人不积累，全给他人。' }
                    ]
                },
                '孙子兵法': {
                    name: '孙子兵法',
                    description: '兵家圣典 · 不战而屈人之兵 · 知己知彼',
                    icon: '⚔️',
                    cards: [
                        { emoji: '🏛️', title: '兵者，国之大事', subtitle: '死生之地，存亡之道，不可不察也。\n白话：战争是国家存亡的关键，必须慎重对待。' },
                        { emoji: '📊', title: '五事七计', subtitle: '一曰道，二曰天，三曰地，四曰将，五曰法。\n白话：决定胜负的五大要素：道义、天时、地利、将领、制度。战前需全盘评估。' },
                        { emoji: '🎭', title: '兵者，诡道也', subtitle: '能而示之不能，用而示之不用，近而示之远，远而示之近。\n白话：用兵靠诡诈，有能力装没能力，要打装不打，声东击西迷惑敌人。' },
                        { emoji: '🧮', title: '多算胜，少算不胜', subtitle: '夫未战而庙算胜者，得算多也；未战而庙算不胜者，得算少也。\n白话：战前谋划周密则胜算大，谋划不周则难胜。胜负在开战前已见分晓。' },
                        { emoji: '💰', title: '兵贵胜，不贵久', subtitle: '久则钝兵挫锐，攻城则力屈，久暴师则国用不足。\n白话：战争拖久会耗尽国力，速战速决才是上策。' },
                        { emoji: '🍞', title: '因粮于敌', subtitle: '食敌一钟，当吾二十钟；萁秆一石，当吾二十石。\n白话：从敌人手里抢粮食，取敌一钟抵自己运二十钟，以战养战减轻后勤负担。' },
                        { emoji: '⚡', title: '不战而屈人之兵', subtitle: '善用兵者，屈人之兵而非战也，拔人之城而非攻也，毁人之国而非久也。\n白话：最高境界不用打仗就降服敌国，靠谋略而非硬拼。' },
                        { emoji: '🎯', title: '上兵伐谋', subtitle: '其次伐交，其次伐兵，其下攻城。\n白话：用兵高下：挫败敌谋最优，拆散其盟友次之，野战又次，强攻城池最下策。' },
                        { emoji: '⚖️', title: '十则围之，五则攻之', subtitle: '倍则分之，敌则能战之，少则能逃之，不若则能避之。\n白话：兵力十倍围歼，五倍进攻，两倍分散敌势，相当可战，少于敌则退避暂不硬碰。' },
                        { emoji: '🧠', title: '知胜有五', subtitle: '知可以战与不可以战者胜，识众寡之用者胜，上下同欲者胜，以虞待不虞者胜，将能而君不御者胜。\n白话：五种情况预知胜利：知进退、善用兵、同心同德、有备对无备、君主不瞎指挥。' },
                        { emoji: '🔍', title: '知彼知己，百战不殆', subtitle: '不知彼而知己，一胜一负；不知彼不知己，每战必殆。\n白话：透彻了解敌我则百战不败。只知己不知敌胜负各半，一无所知则逢战必亡。' },
                        { emoji: '⛰️', title: '善战者，先为不可胜', subtitle: '以待敌之可胜。不可胜在己，可胜在敌。\n白话：善打仗的人先确保自己无懈可击，再等敌人露出破绽。不被击败在自己，打赢要靠敌给机会。' },
                        { emoji: '🛡️', title: '守则不足，攻则有余', subtitle: '善守者藏于九地之下，善攻者动于九天之上。\n白话：兵力不足时善守，藏于无形；兵力充裕时善攻，如天降神兵，防不住也挡不住。' },
                        { emoji: '👁️', title: '见胜不过众人之所知，非善之善者也', subtitle: '举秋毫不为多力，见日月不为明目，闻雷霆不为聪耳。\n白话：人人都看得见的胜利不叫高明。真正的善战者胜于无形之中，看不出多厉害。' },
                        { emoji: '💪', title: '胜兵先胜而后求战', subtitle: '败兵先战而后求胜。\n白话：常胜军是先有必胜把握再打，败军是先打了再想怎么赢。前者不打无准备之仗。' },
                        { emoji: '🔢', title: '一曰度，二曰量，三曰数，四曰称，五曰胜', subtitle: '地生度，度生量，量生数，数生称，称生胜。\n白话：从土地面积到物产、兵力、实力对比，一步步推导，哪方实力占优哪方胜算就大。' },
                        { emoji: '🌊', title: '兵形象水', subtitle: '水之形避高而趋下，兵之形避实而击虚。\n白话：用兵像流水，避开高处流向低处，避开敌人强处专攻弱点。' },
                        { emoji: '🌀', title: '兵无常势，水无常形', subtitle: '能因敌变化而取胜者，谓之神。\n白话：没有固定打法，水没有固定形状。根据敌情随机应变取胜，才叫神妙。' },
                        { emoji: '🏃', title: '以迂为直，以患为利', subtitle: '军争之难者，以迂为直，以患为利。\n白话：争夺制胜条件的难处在于，把弯路走成直路，把不利扭转成有利。' },
                        { emoji: '🌪️', title: '风林火山', subtitle: '其疾如风，其徐如林，侵掠如火，不动如山，难知如阴，动如雷震。\n白话：行动像风一样快，列阵像林一样整齐，攻击像火一样猛，防守像山一样稳。' },
                        { emoji: '🤝', title: '九变之利', subtitle: '圮地无舍，衢地交合，绝地无留，围地则谋，死地则战。\n白话：根据九种地形灵活行动：低洼地不驻扎，四通八达结盟友，死地只能拼死一搏。' },
                        { emoji: '🧐', title: '智者之虑，必杂于利害', subtitle: '杂于利而务可信也，杂于害而患可解也。\n白话：聪明的将帅考虑问题必须兼顾利和害两面的可能性，从好处着手、在坏处设防。' },
                        { emoji: '🌳', title: '行山林险阻沮泽', subtitle: '凡地有绝涧、天井、天牢、天罗、天陷、天隙，必亟去之，勿近也。\n白话：行军遇峡谷、洼地、密林等险地必须绕道不可近前，这些致命地形埋伏重重。' },
                        { emoji: '🔥', title: '凡火攻有五', subtitle: '一曰火人，二曰火积，三曰火辎，四曰火库，五曰火队。\n白话：火攻五目标：烧敌军士兵、粮草、辎重、仓库、运输线。用火助攻威力巨大。' },
                        { emoji: '🕵️', title: '用间有五', subtitle: '因间、内间、反间、死间、生间。\n白话：五种间谍：利用乡民、收买敌官、策反敌谍、派去送死传递假消息、活着回来送情报的。' },
                        { emoji: '🔑', title: '反间者，因其敌间而用之', subtitle: '此兵之要，三军之所恃而动也。\n白话：用间的关键是策反敌方间谍为自己所用，三军的行动都依赖这一关键情报保证。' }
                    ]
                },
                '菜根谭': {
                    name: '菜根谭',
                    description: '咬得菜根 · 百事可做 · 处世奇书',
                    icon: '🥬',
                    cards: [
                        { emoji: '🌿', title: '弄权一时，凄凉万古', subtitle: '栖守道德者，寂寞一时；依阿权势者，凄凉万古。\n白话：坚守道德的人可能会暂时寂寞，依附权贵的人却会遗臭万年。' },
                        { emoji: '🧹', title: '抱朴守拙，涉世之道', subtitle: '涉世浅，点染亦浅；历事深，机械亦深。\n白话：阅历浅的人受污染也浅，阅历深的人心机也深。君子与其圆滑，不如保持朴实。' },
                        { emoji: '🕊️', title: '心事宜明，才华须韫', subtitle: '君子之心事，天青日白，不可使人不知；君子之才华，玉韫珠藏，不可使人易知。\n白话：君子的内心要光明磊落让人知道，才华却要像藏珠玉一样不轻易外露。' },
                        { emoji: '💧', title: '出淤泥而不染，明机巧而不用', subtitle: '势利纷华，不近者为洁，近之而不染者尤洁。\n白话：远离名利场是清高，身处名利场而不被污染是更高境界的清高。' },
                        { emoji: '👂', title: '耳中常闻逆耳之言', subtitle: '心中常有拂心之事，才是进德修行的砥石。\n白话：常听不顺耳的话，常遇不顺心的事，恰恰是磨炼品德修行的磨刀石。' },
                        { emoji: '😊', title: '和气致祥，喜神多瑞', subtitle: '疾风怒雨，禽鸟戚戚；霁日光风，草木欣欣。\n白话：狂风暴雨时鸟也忧愁，风和日丽时草木也欣欣向荣。和气能招来吉祥。' },
                        { emoji: '🍽️', title: '淡中知真味，常里识英奇', subtitle: '肥辛甘非真味，真味只是淡；神奇卓异非至人，至人只是常。\n白话：浓烈不是真味，真味是清淡；奇人不是高人，高人只是平凡。' },
                        { emoji: '🤫', title: '闲时吃紧，忙里悠闲', subtitle: '天地寂然不动，而气机无息稍停；日月昼夜奔驰，而贞明万古不易。\n白话：闲时要绷紧一根弦，忙时要有一颗闲心。天地看似不动其实运转不息。' },
                        { emoji: '🔇', title: '静中观心，真妄毕见', subtitle: '夜深人静独坐观心，始觉妄穷而真独露。\n白话：深夜独坐反省内心，妄念消退，真心显露。这是自我修养的好时机。' },
                        { emoji: '🏃', title: '得意须早回头，拂心莫便放手', subtitle: '恩里由来生害，故快意时须早回首；败后或反成功，故拂心处莫便放手。\n白话：恩宠中往往暗藏祸害，得意时要及早抽身；失败后可能是转机，失意时别轻易放手。' },
                        { emoji: '💎', title: '澹泊明志，肥甘丧节', subtitle: '藜口苋肠者，多冰清玉洁；衮衣玉食者，甘卑躬屈节。\n白话：吃粗茶淡饭的人往往品质冰清玉洁，锦衣玉食的人反而卑躬屈膝。' },
                        { emoji: '🌍', title: '眼前放得宽大，死后恩泽悠长', subtitle: '面前的田地要放得宽，使人无不平之叹；身后的恩泽要流得久，使人有不匮之思。\n白话：做人气量要大，让人没有不平的抱怨；留下的恩泽要长远，让人有无尽的怀念。' },
                        { emoji: '🛤️', title: '路要让一步，味须减三分', subtitle: '径路窄处，留一步与人行；滋味浓的，减三分让人尝。\n白话：窄路让一步给别人走，美味减三分让别人尝。这是处世安乐的好方法。' },
                        { emoji: '🚶', title: '脱俗成名，超凡入圣', subtitle: '作人无甚高远事业，摆脱得俗情便入名流；为学无甚增益功夫，减除得物累便超圣境。\n白话：做人不必求高远大业，摆脱俗气就入名流；求学不必增多少功夫，减掉物欲便入圣境。' },
                        { emoji: '🤝', title: '义侠交友，纯心做人', subtitle: '交友须带三分侠气，做人要存一点素心。\n白话：交朋友要带三分侠义之气，做人要保留一点淳朴之心。' },
                        { emoji: '🌿', title: '德在人先，利居人后', subtitle: '宠利毋居人前，德业毋落人后；受享毋逾分外，修为毋减分中。\n白话：名利面前退一步，道德修养争先一步；享乐不要过分，修德不要打折。' },
                        { emoji: '😌', title: '退即是进，与即是得', subtitle: '处世让一步为高，退步即进步的张本；待人宽一分是福，利人实利己的根基。\n白话：让一步更高明，退一步是为了进两步；宽待别人是福气，利人就是利己的根基。' },
                        { emoji: '🎯', title: '骄矜无功，忏悔灭罪', subtitle: '盖世功劳，当不得一个矜字；弥天罪过，当不得一个悔字。\n白话：再大的功劳经不起一个骄傲的毁损；再大的罪过经不起一个悔字的化解。' },
                        { emoji: '📖', title: '完名让人，归咎于己', subtitle: '完名美节，不宜独任，分些与人可以远害全身；辱行污名，不宜全推，引些归己可以韬光养德。\n白话：好事分些给别人可以远离祸害，坏事揽些在自己身上可以涵养德行。' },
                        { emoji: '🌤️', title: '天道忌盈，业不求满', subtitle: '事事留个有余不尽的意思，便造物不能忌我，鬼神不能损我。\n白话：事事留有余地不完满，天地就不会嫉妒我，鬼神也无法损害我。' },
                        { emoji: '💕', title: '诚心和气，胜于调息', subtitle: '家庭有个真佛，日用有种真道。人能诚心和气、愉色婉言，使父母兄弟间形骸两释、意气交流，胜于调息观心万倍矣。\n白话：家庭里有诚心和气，比什么养生功夫都管用。' },
                        { emoji: '⚡', title: '动静合宜，道之真体', subtitle: '好动者云电风灯，嗜寂者死灰槁木。\n白话：太好动的人像风中烛火不稳，太死寂的人像枯木无生机。动静结合才合道。' },
                        { emoji: '🍃', title: '责人宜宽，责己宜苛', subtitle: '攻人之恶毋太严，要思其堪受；教人以善毋过高，当使其可从。\n白话：批评别人不要太严苛，要想想对方能否承受；教人向善不要标准太高，要让人做得来。' },
                        { emoji: '🌱', title: '净从秽生，明从暗出', subtitle: '粪虫至秽，变为蝉而饮露于秋风；腐草无光，化为萤而耀采于夏月。\n白话：粪土中的虫子变成蝉喝清露，腐草化成萤火虫放光。洁净从污秽中来，光明从黑暗中生。' },
                        { emoji: '🎭', title: '客气伏而正气伸，妄心杀而真心现', subtitle: '矜高倨傲，无非客气；降伏得客气下，而后正气伸。\n白话：骄傲自大只是俗气，降伏俗气后才能伸张正气；消灭妄想后才能显露真心。' },
                        { emoji: '🔍', title: '事悟而痴除，性定而动正', subtitle: '饱后思味，则浓淡之境都消；色后思淫，则男女之见尽绝。\n白话：吃饱后再想美味，浓淡都没感觉了；事情过去再回头，当初的痴迷就都消了。' },
                        { emoji: '🧘', title: '志在林泉，胸怀廊庙', subtitle: '居轩冕之中，不可无山林的气味；处林泉之下，须要怀廊庙的经纶。\n白话：身居高位要有山林清气，退隐山林也要心怀天下大事。' },
                        { emoji: '👤', title: '无过是功，无怨是德', subtitle: '处世不必邀功，无过便是功；与人不求感德，无怨便是德。\n白话：做人不必刻意求功，不出错就是功；帮人不图感恩，别人不怨恨就是德。' },
                        { emoji: '⛰️', title: '忧勤勿过，待人勿枯', subtitle: '忧勤是美德，太苦则无以适性怡情；澹泊是高风，太枯则无以济人利物。\n白话：忧心勤勉是美德，太过就失去生活乐趣；淡泊是高风，太过就对人没有帮助了。' },
                        { emoji: '👴', title: '知退一步，加让三分', subtitle: '人情反复，世路崎岖。行不去处，须知退一步之法；行得去处，务加让三分之功。\n白话：人情反复无常世路崎岖，走不通时退一步，走得通时让人三分。' },
                        { emoji: '😇', title: '不恶小人，礼待君子', subtitle: '待小人不难于严，而难于不恶；待君子不难于恭，而难于有礼。\n白话：对小人严厉不难，难的是不厌恶；对君子恭敬不难，难的是有礼有节不卑不亢。' },
                        { emoji: '💪', title: '立身要高，处世须让', subtitle: '立身不高一步立，如尘里振衣，泥中濯足，如何超达？\n白话：站位不够高，像在灰尘里抖衣服泥水里洗脚，怎能超脱通达？' },
                        { emoji: '🌉', title: '修德须忘功名，读书定在深心', subtitle: '学者要收拾精神，并归一路。\n白话：修德要忘了功名之心，读书要深入内心，把精力聚拢在一条路上。' },
                        { emoji: '🌳', title: '道者应有木石心，名相须具云水趣', subtitle: '进德修道，要个木石的念头，若一有欣羡，便趋欲境；济世经邦，要段云水的趣味，若一有贪著，便坠危机。\n白话：修德要有木石般坚定的心，一有羡慕就入欲望境界；济世要有云水般飘逸的趣味，一有贪着就坠入危险。' },
                        { emoji: '🧠', title: '善人和气一团，恶人杀气腾腾', subtitle: '吉人无论作用安详，即梦寐神魂无非和气；凶人无论行事狠戾，即声音笑语浑是杀机。\n白话：善人举手投足安详，连梦里也是一团和气；凶人就算笑语中，也透出一股杀机。' },
                        { emoji: '📯', title: '欲无祸于昭昭，勿得罪于冥冥', subtitle: '肝受病则目不能视，肾受病则耳不能听。\n白话：想在人前没有祸事，人后就不要做亏心事。肝有病眼就看不见，根上的问题会反映在表面。' },
                        { emoji: '🤲', title: '多心招祸，少事为福', subtitle: '福莫福于少事，祸莫祸于多心。\n白话：最大的福气是少事，最大的祸害是多心。多疑多虑的人苦楚最多。' },
                        { emoji: '🌱', title: '方圆处世，宽严待人', subtitle: '处治世宜方，处乱世宜圆，处叔季之世当方圆并用。\n白话：太平盛世方方正正做人，乱世要圆融变通，末世要方圆并用。' },
                        { emoji: '💼', title: '忘功念过，忘怨念恩', subtitle: '我有功于人不可念，而过则不可不念；人有恩于我不可忘，而怨则不可不忘。\n白话：自己帮别人别记着，自己的过错则不可忘；别人有恩不可忘，别人的怨则快忘掉。' },
                        { emoji: '🔨', title: '求自力，不求天佑', subtitle: '天薄我以福，吾厚吾德以迓之；天劳我以形，吾逸吾心以补之。\n白话：上天给我福薄，我修厚德来迎；上天让我劳苦，我安逸心来补。求自己比求天更可靠。' },
                        { emoji: '🌲', title: '看人只看后半截', subtitle: '声妓晚景从良，一世之烟花无碍；贞妇白头失守，半生之清苦俱非。\n白话：看人要看后半截怎么收场。歌妓晚年从良一生烟花无损，贞妇晚年失节半生清苦白费。' },
                        { emoji: '🏠', title: '种德施惠，无位公相', subtitle: '平民肯种德施惠，便是无位的公相；士夫徒贪权市宠，竟成有爵的乞人。\n白话：平民肯积德行善，就是没官位的宰相；官吏贪权势讨恩宠，不过是有爵位的乞丐。' },
                        { emoji: '📚', title: '积德不如积书，积书不如积德', subtitle: '问祖宗之德泽，吾身所享者是，当念其积累之难；问子孙之福祉，吾身所贻者是，要思其倾覆之易。\n白话：我享的福是祖宗积德换来，要念及积累之难；留给子孙的福分，要想到倾覆有多容易。' },
                        { emoji: '👪', title: '家人有过，春风解冻', subtitle: '家人有过，不宜暴怒，不宜轻弃。\n白话：家人犯错不要暴怒不要轻易放弃，像春风解冻一样慢慢感化。' },
                        { emoji: '🌸', title: '心闲日长，意广天宽', subtitle: '延促由于一念，宽窄系之寸心。\n白话：时间长短在于心念，觉得急就短觉得闲就长。心宽了天地就宽。' },
                        { emoji: '🌳', title: '栽花种竹，心境无我', subtitle: '损之又损，栽花种竹，尽交还乌有先生；忘无可忘，焚香煮茗，总不问白衣童子。\n白话：把俗念减了又减，栽花种竹归还有生之地；忘到不能忘时，焚香煮茶不问世事。' },
                        { emoji: '🔑', title: '知足则仙，善用则生', subtitle: '都来眼前事，知足者仙境，不知足者凡境。\n白话：同样面对眼前事，知足的人在仙境，不知足的人在凡境。' },
                        { emoji: '🌊', title: '察见渊鱼者不祥', subtitle: '知料事者遭忌，料隐匿者受祸。\n白话：看得太透不是好事，过于精明反遭嫉妒和祸害。' },
                        { emoji: '🏔️', title: '山之高峻处无木，水之湍急处无鱼', subtitle: '故君子居常嗜好，不可太浓艳，亦不宜太枯寂。\n白话：山太高不长树，水太急没有鱼。君子处世不能太浓艳也不能太枯燥。' },
                        { emoji: '🌄', title: '静中念虑澄澈，闲中气象从容', subtitle: '淡中意趣冲夷，乃得心之真体。\n白话：安静中思虑澄澈，悠闲中气质从容，淡泊中心境平和，才见心的本来面目。' },
                        { emoji: '🎵', title: '天地不可一日无和气，人心不可一日无喜神', subtitle: '和气致祥，戾气致戾。\n白话：天地不能一天没有和气，人心不能一天没有欢喜。和气招福，戾气招灾。' },
                        { emoji: '🍂', title: '翠竹黄花皆佛性', subtitle: '心体便是天体，一念之喜，景星庆云；一念之怒，震雷暴雨。\n白话：一个善念天降祥瑞，一个恶念暴雨雷霆。人心能感天动地。' },
                        { emoji: '🔗', title: '机息坐忘，心月独明', subtitle: '机息时便有月到风来，不必苦海人世；心远处自无车尘马迹，何须痼疾丘山。\n白话：心机止息明月清风自来，不必逃离尘世；心境旷远自然远离车马喧嚣。' },
                        { emoji: '🍃', title: '落叶蕴育萌芽，生机藏于肃杀', subtitle: '草木才零落，便露萌颖于根底；时序虽凝寒，终回阳气于飞灰。\n白话：草木刚落叶，根部已露新芽；冬天虽冷，阳气终会回来。肃杀中藏着生机。' },
                        { emoji: '🧘', title: '雨后山色鲜，静夜钟声清', subtitle: '雨余观山色，景象便觉新妍；夜静听钟声，音响尤为清越。\n白话：雨后看山更加清新，静夜听钟格外清亮。心静了才能体会到事物的妙处。' },
                        { emoji: '🌿', title: '扫地白云来，凿池明月入', subtitle: '才著工夫便起障，能空境界自生明。\n白话：刻意修行反而起障碍，把心放空境界自然光明自生。' },
                        { emoji: '☀️', title: '心体光明，暗室中有青天', subtitle: '念头暗昧，白日下有厉鬼。\n白话：心怀光明在暗室中也像晴天，心念阴暗大白天也像有厉鬼。' },
                        { emoji: '👑', title: '无名无位之乐为最真', subtitle: '人知名位为乐，不知无名无位之乐为最真；人知饥寒为忧，不知不饥不寒之忧为更甚。\n白话：没名没位的快乐才最真实，不愁吃穿的忧虑才更折磨人。' },
                        { emoji: '😈', title: '为恶而畏人知，恶中犹有善路', subtitle: '为善而急人知，善处即是恶根。\n白话：做坏事怕人知道，恶中还有善的苗头；做好事急让人知道，善中已埋下恶根。' },
                        { emoji: '🌪️', title: '逆境中周身皆针砭药石', subtitle: '砥节砺行而不觉；处顺境内眼前尽兵刃戈矛，销膏糜骨而不知。\n白话：困境中处处是磨刀石，不知不觉砥砺了品行；顺境中处处是杀人的刀，不知不觉消磨了意志。' },
                        { emoji: '🔥', title: '嗜欲如猛火，权势似烈焰', subtitle: '故君子不以身殉物，不以欲害心。\n白话：欲望像大火权势像烈焰，君子不为了外物赔上身心，不让欲望伤害本心。' },
                        { emoji: '🤝', title: '人心一真，便霜可飞城可摧', subtitle: '至诚可以格天，真诚可以动人。\n白话：人心真诚到了极点，能让六月飞霜城墙倒塌。至诚可以感动天地打动人心。' },
                        { emoji: '💎', title: '文章极处无奇巧，人品极处只本然', subtitle: '文章做到极处，无有他奇，只是恰好；人品做到极处，无有他异，只是本然。\n白话：文章写好了没什么奇特，只是刚刚好；人品修好了没什么特别，只是回归本然。' },
                        { emoji: '🕰️', title: '天地有万古，此身不再得', subtitle: '人生只百年，此日最易过。幸生其间者，不可不知有生之乐，亦不可不怀虚生之忧。\n白话：天地万古长存，人生只有百年。要懂得生命的快乐，也要警惕虚度光阴。' },
                        { emoji: '⚖️', title: '公平正论不可犯', subtitle: '一犯则贻羞万世；权门私窦不可著，一著则沾污终身。\n白话：公平正义不可触犯，一犯就遗臭万年；权贵私门不可沾染，一沾就终身有污点。' },
                        { emoji: '🌱', title: '念随起随灭，与太虚同体', subtitle: '心体澄彻，常在明镜止水之中，则天下自无可厌之事。\n白话：念头起了就让它灭，心如明镜止水澄澈，天下就没有可厌的事了。' },
                        { emoji: '😴', title: '无事寂寂以照惺惺，有事惺惺以主寂寂', subtitle: '无事时心易昏冥，宜寂寂而照以惺惺；有事时心易奔逸，宜惺惺而主以寂寂。\n白话：没事时心容易昏沉，要在寂静中保持清醒；有事时心容易躁动，要在清醒中保持沉稳。' },
                        { emoji: '💬', title: '议事者身在事外，任事者身居事中', subtitle: '议事者身在事外，宜悉利害之情；任事者身居事中，当忘利害之虑。\n白话：议事者有旁观之明，应当详尽分析利害；做事的人已在其中，反而要放下利害得失之心。' },
                        { emoji: '📏', title: '标节义者必以节义受谤', subtitle: '标榜道德者必被道德苛责。君子之处世，宁默毋躁，宁拙毋巧。\n白话：标榜节义的人反而会因节义受诽谤，标榜道德的人会被以更高的标准苛责。' },
                        { emoji: '😊', title: '面上扫开十层甲，眉目才无可憎', subtitle: '胸中涤去数斗尘，语言方觉有味。\n白话：脸上去掉层层伪装，面目才不让人觉得可憎；心中洗去数斗灰尘，说出的话才有味道。' },
                        { emoji: '🌞', title: '白日欺人，难逃清夜之愧赧', subtitle: '红颜失志，空贻皓首之悲伤。\n白话：白天欺负人，逃不过深夜的羞愧；年轻时失志，老年只剩空悲叹。' },
                        { emoji: '👶', title: '赤子大人，心同体异', subtitle: '大人不可不畏，畏大人则无放逸之心；小民亦不可不畏，畏小民则无豪横之名。\n白话：对权贵要有敬畏，敬则不放纵；对百姓也要有敬畏，敬则不横行。' },
                        { emoji: '🌳', title: '根固而叶荣，源深而流远', subtitle: '德者事业之基，未有基不固而栋宇坚久者。\n白话：道德是事业的根基，根基不牢房子不会坚固长久。' },
                        { emoji: '🌸', title: '春色为人间之妆饰，秋气见天地之真吾', subtitle: '莺花茂而山浓谷艳，总是乾坤之幻境；水木落而石瘦崖枯，才见天地之真吾。\n白话：春花烂漫不过是天地幻象，水落石出秋色萧条才见天地本相。' },
                        { emoji: '🎵', title: '听静夜之钟声，唤醒梦中之梦', subtitle: '观澄潭之月影，窥见身外之身。\n白话：静夜钟声能把梦里人唤醒，清潭月影能让人窥见身外之身的真我。' },
                        { emoji: '🌬️', title: '风来疏竹，风过而竹不留声', subtitle: '雁度寒潭，雁去而潭不留影。故君子事来而心始现，事去而心随空。\n白话：风吹竹子风过竹不留声，雁过潭面雁去不留影。君子事情来了心才动，事情过去心就空。' },
                        { emoji: '💧', title: '水性清而泥沙汩之', subtitle: '人性本清，利欲汩之。\n白话：水本是清的泥沙搅浑了它，人性本是清的利欲搅浑了它。去掉欲望心就恢复清澈。' },
                        { emoji: '🔥', title: '一念嗔心起，百万障门开', subtitle: '触来不怒，怒起为障。\n白话：一个嗔怒的念头起来，万道障碍之门就打开了。碰到事情不动怒，怒起就是障碍。' },
                        { emoji: '🔮', title: '物欲有大小，断欲在决心', subtitle: '小处不渗漏，暗处不欺隐，末路不怠荒，才是个真正英雄。\n白话：小处不疏忽，暗处不欺骗，绝境不怠惰，才是真正的英雄。' },
                        { emoji: '🌾', title: '勤者敏于德义，而世人借勤以济其贫', subtitle: '俭者淡于货利，而世人假俭以饰其吝。\n白话：勤奋本是为了修德，世人却拿来济贫赚钱；节俭本是为了淡泊利欲，世人却用节俭掩盖吝啬。' },
                        { emoji: '🔄', title: '反己者触事皆成药石', subtitle: '尤人者动念即是戈矛。\n白话：自我反省的人，碰到的每件事都是良药；怨天尤人的人，动个念头就是伤人的刀枪。' },
                        { emoji: '🏔️', title: '登山耐侧路，踏雪耐危桥', subtitle: '一耐字极有意味，如倾险之人情、坎坷之世道，若不得一耐字撑持过去，几何不堕入榛莽坑堑哉？\n白话：登山要走险路边，踏雪要过危险桥。一个“耐”字意味深长，人情险诈世道坎坷，没有“耐”字撑着，怎能不跌入荆棘陷阱里？' },
                        { emoji: '🏹', title: '夸逞功业，炫耀文章，皆是靠外物做人', subtitle: '不知心体莹然，本来不失，即无寸功只字，亦自有堂堂正正做人处。\n白话：夸耀功业炫耀文章，都是靠外物做人。心里光明本来不失，没有寸功只字，也堂堂正正' },
                        { emoji: '🤫', title: '宁默毋躁，宁拙毋巧', subtitle: '十语九中未必称奇，一语不中则愆尤骈集；十谋九成未必归功，一谋不成则訾议丛兴。\n白话：十句话说对九句没人夸你，说错一句指责就来了；十个计谋九个成功没人归功于你，一个失败议论就蜂起。所以宁肯沉默也不要急躁。' },
                        { emoji: '🛀', title: '欲其中者，波沸寒潭', subtitle: '山林不见其寂；虚其中者，凉生酷暑，朝市不知其喧。\n白话：欲望在胸中，哪怕寒潭也会沸腾，山林也觉不寂；内心虚空，酷暑也觉凉快，闹市也不觉喧哗。' },
                        { emoji: '❄️', title: '冷眼观人，冷耳听语', subtitle: '冷情当感，冷心思理。\n白话：用冷静眼光看人，冷静耳朵听话，冷静心态感受，冷静头脑思考。一个“冷”字胜过千般热恼。' },
                        { emoji: '🤲', title: '恩宜自淡而浓，威宜自严而宽', subtitle: '恩宜自淡而浓，先浓后淡者人忘其惠；威宜自严而宽，先宽后严者人怨其酷。\n白话：施恩要由少到多，先多后少人会忘了你的恩；立威要先严后宽，先宽后严人会恨你残酷。' },
                        { emoji: '🧗', title: '持身涉世，不可随境而迁', subtitle: '须是大火流金而清风穆然，严霜杀物而和气蔼然，阴霾翳空而慧日朗然，洪涛倒海而砥柱屹然，方是宇宙内的真人品。\n白话：大火熔金时我如清风拂面，严霜杀物时我和气蔼然，阴霾遮天时我智慧如日，洪涛倒海时我屹立如柱，这才叫真人品。' },

                    icon: '🔥',
                    cards: [
                        { emoji: '📖', title: '教子弟于幼时，检身心于平日', subtitle: '教子弟于幼时，便当有正大光明气象；检身心于平日，不可无忧勤惕厉功夫。\n白话：教育子弟要从幼年开始，培养光明磊落的气度；平日约束自己的身心，不能缺乏勤奋和警惕的修养。' },
                        { emoji: '👥', title: '交游要学友之长，读书要身体力行', subtitle: '与朋友交游，须将他好处留心来，方能受益；对圣贤言语，必要我平时照样行去，才算读书。\n白话：和朋友交往要留心学习他们的长处才能受益；读圣贤书必须在生活中身体力行，才算真正读书。' },
                        { emoji: '💰', title: '勤以补拙，俭以济贫', subtitle: '贫无可奈惟求俭，拙亦何妨只要勤。\n白话：贫穷时没有办法只得节俭，笨拙怕什么只要肯下苦功夫勤劳去做。' },
                        { emoji: '🗣️', title: '稳当话，本分人', subtitle: '稳当话却是平常话，所以听稳当话者不多；本分人即是快活人，无奈做本分人者甚少。\n白话：稳妥的话就是平常的话，听的人却不多；安分守己的人就是快乐的人，可惜做的人太少。' },
                        { emoji: '⚖️', title: '处事要代人作想，读书须切己用功', subtitle: '处事要代人作想，读书须切己用功。\n白话：处理事情要多为别人着想，读书则必须自己切切实实地下功夫。' },
                        { emoji: '🤝', title: '信为立身之本，恕为接物之要', subtitle: '一信字是立身之本，所以人不可无也；一恕字是接物之要，所以终身可行也。\n白话：诚信是立身处世的根本，宽恕是待人接物的关键，终身都可以践行。' },
                        { emoji: '💬', title: '说话不可伤人，不可说尽', subtitle: '人皆欲会说话，苏秦乃因会说而杀身。\n白话：人都想能说会道，但苏秦就因为太会说招来杀身之祸。话不可说得太绝太伤人。' },
                        { emoji: '👨‍🏫', title: '教小儿宜严，严气足以平躁气', subtitle: '待小人宜敬，敬心可以化邪心。\n白话：教育小孩要严格，严格之气可以平息他们的浮躁；对待小人也要尊重，尊重之心可以化解他们的邪念。' },
                        { emoji: '🧘', title: '养心莫善于寡欲', subtitle: '耳目口鼻，各有所欲，欲动情胜，则心不得其正。\n白话：修养心性最好的方法是减少欲望，感官欲望多了心就无法端正。' },
                        { emoji: '🧠', title: '人心统耳目官骸，而于百体为君', subtitle: '必随处见神明之宰；人面合眉眼鼻口，以成一字曰苦，知终身无安逸之时。\n白话：人心主导全身，必须在处处体现神明主宰；人的脸上眉眼鼻口合起来像个"苦"字，便知人生没有安逸的时候。' },
                        { emoji: '📚', title: '读书无论资性高低，但能勤学好问', subtitle: '凡事思一个所以然，自有义理贯通之日。\n白话：读书无论天资高低，只要能勤学好问，凡事想清楚为什么，自然有一天能融会贯通。' },
                        { emoji: '🌱', title: '人心如谷种，满腔都是生意', subtitle: '物欲锢之而滞矣，然而生意未尝不在也，疏之而已耳。\n白话：人心好像谷种满含生机，物欲把生机禁锢住了，但生机还在，需要疏导它而已。' },
                        { emoji: '🔍', title: '博学笃志，切问近思', subtitle: '此八字是收放心的工夫；神闲气静，智深勇沉，此八字是干大事的本领。\n白话：博学笃志切问近思八个字是收束放逸之心的功夫；神闲气静智深勇沉八个字是干大事的本领。' },
                        { emoji: '🎯', title: '凡事谨守规模，必不大错', subtitle: '一生但足衣食，便称小康。\n白话：凡事遵守一定的规矩法度一定不会出大错；一辈子吃饱穿暖便算小康了。' },
                        { emoji: '🚫', title: '十分不耐烦，乃为人大病', subtitle: '一味学吃亏，是处事良方。\n白话：忍耐不住性情是做人最大的毛病；甘心吃亏是处世的好方法。' },
                        { emoji: '👁️', title: '知往日所行之非，则学日进矣', subtitle: '见世人可取者多，则德日进矣。\n白话：知道自己从前做错的地方学问就进步了；看到别人有很多可取之处道德就进步了。' },
                        { emoji: '🤔', title: '有真性情，须有真涵养', subtitle: '有大识见，乃有大文章。\n白话：有真性情必须要有真涵养；有远大的见识才能写出好文章。' },
                        { emoji: '🍵', title: '守身必谨严，养心须淡泊', subtitle: '凡足以戕吾身者宜戒之，凡足以累吾心者勿为也。\n白话：有损身体的事应戒除，拖累心神的事不要做。爱护自己从谨慎和淡泊开始。' },
                        { emoji: '💡', title: '有才必韬藏，为学无间断', subtitle: '有才必韬藏，如浑金璞玉，暗然而日章也；为学无间断，如流水行云，日进而不已也。\n白话：有才华一定要深藏不露，像璞玉一样暗然却日久愈显光彩；做学问不可间断，如行云流水日日进步不止。' },
                        { emoji: '🎓', title: '读书不下苦功，妄想显荣', subtitle: '岂有此理？为人全无好处，欲邀福庆，从何得来？\n白话：读书不肯下苦功却妄想荣显，哪有这种道理？做人一点好处都没有却想求福，福从哪里来？' },
                        { emoji: '🗣️', title: '言不可尽信，必揆诸理', subtitle: '事未可遽行，必问诸心。\n白话：别人的话不能全信要用理来衡量；事情不可急着做要先问问自己的心。' },
                        { emoji: '👥', title: '交朋友增体面，不如交朋友益身心', subtitle: '教子弟求显荣，不如教子弟立品行。\n白话：交有钱有势的朋友为自己撑面子，不如交有益身心的朋友；教子弟求富贵荣华，不如教他们立好品行。' },
                        { emoji: '📝', title: '教弟子如养闺女，最要严出入谨交游', subtitle: '若一接近匪人，是清净田中下一不净的种子，便终身难植嘉禾矣。\n白话：教育子弟像养育闺中女儿，最要紧的是严格管束他的出入和交友。一旦接触坏人，就像在清洁田里种下不洁的种子，终身再难长出好庄稼。' },
                        { emoji: '⏳', title: '人生境遇无常，须自谋一吃饭本领', subtitle: '人生光阴易逝，要早定一成器日期。\n白话：人生命运变化无常，须自己谋得一个吃饭的本领；光阴容易流逝，要早日定下成材的期限。' },
                        { emoji: '🛤️', title: '饱暖人所共羡，然使享一生饱暖', subtitle: '而气昏志惰，岂足有为？饥寒人所不甘，然必带几分饥寒，则神紧骨坚，乃能任事。\n白话：饱暖让人羡慕但一生饱暖气昏志惰哪能成事？饥寒人不甘但带几分饥寒反而神紧骨坚才能成事。' },
                        { emoji: '💭', title: '存科名心者，未必有琴书之乐', subtitle: '讲性命学者，不可无经济之才。\n白话：一心追逐功名的人未必能享受琴书之乐；研究性理之学的人不可没有经世济民的才能。' },
                        { emoji: '🌾', title: '耕所以养生，读所以明道', subtitle: '此耕读之本原也，而后世乃假以谋富贵矣。\n白话：耕种是为了养活生命，读书是为了明白道理，这是耕读的本意，后世却拿来谋取富贵了。' },
                        { emoji: '🥬', title: '淡中交耐久，静里寿延长', subtitle: '淡中交耐久，静里寿延长。\n白话：平淡中的交情更持久，安静里的寿命更绵长。' },
                        { emoji: '📖', title: '读书在明理，识见不可不高', subtitle: '为学在求知，才识不可不博。\n白话：读书在于明白道理，见识不可不高远；做学问在于探求知识，才识不可不广博。' },
                        { emoji: '🏠', title: '齐家先修身，言行不可不慎', subtitle: '读书在明理，识见不可不高。\n白话：整治家庭要先修养自身，说话做事不能不谨慎。' },
                        { emoji: '😌', title: '安贫乐道，不趋炎附势', subtitle: '人生在世，总有不如意处，安贫乐道便是福。\n白话：安于贫穷乐于道义，不攀附权贵。人生总有不顺心，能安贫乐道就是福气。' },
                        { emoji: '🌙', title: '读书夜坐，心要有所警戒', subtitle: '静坐观心，念要有所惕厉。\n白话：读书夜坐之时，心里要有所警戒；静坐观察内心时，念头要有所警惕激励。' },
                        { emoji: '👶', title: '赤子之心，不可失也', subtitle: '人心统耳目官骸，而于百体为君。\n白话：婴儿般纯真之心不能失去，人心是全身的主宰，要保持纯真。' },
                        { emoji: '📏', title: '人生不可安闲，有恒业才收放心', subtitle: '日用必须简省，杜奢端即以昭俭德。\n白话：人生不能太安逸，有固定的事业才能收束放逸之心；日常开销一定要节省，杜绝奢侈就是彰显俭德。' },
                        { emoji: '💎', title: '财不患其不得，患财得而不能善用其财', subtitle: '禄不患其不来，患禄来而不能无愧其禄。\n白话：不怕得不到财富，怕的是有了财富却不能善用；不怕俸禄不来，怕的是拿了俸禄却不能无愧于心。' },
                        { emoji: '👪', title: '父兄有善行，子弟学之无不肖', subtitle: '父兄有恶行，子弟学之无不肖。\n白话：父兄有善行子弟跟着学没有不像的；父兄有恶行子弟跟着学也没有不像的。可知身教重于言教。' },
                        { emoji: '⚡', title: '守身不敢妄为，恐贻羞于父母', subtitle: '创业还须深虑，恐贻害于子孙。\n白话：持守自身不敢胡作非为，恐怕给父母带来羞耻；创立事业还需深思熟虑，恐怕给子孙留下祸害。' },
                        { emoji: '🗓️', title: '无论做何等人，总不可有势利气', subtitle: '无论习何等业，总不可有粗浮心。\n白话：不管做什么样的人，都不能有势利之气；不管从事什么行业，都不能有粗心浮躁之气。' },
                        { emoji: '🌿', title: '以直道教人，人即乐从', subtitle: '以诚心待人，人或不谅。\n白话：用正直的道理教人，人就乐于听从；以真诚之心待人，别人却不一定体谅。但还是要诚心待人。' },
                        { emoji: '🧘', title: '养心须淡，存心须真', subtitle: '养心莫善于寡欲，存心莫善于真纯。\n白话：修养心性最好方法在淡泊少欲，保持心地良善最好方法在真诚纯一。' },
                        { emoji: '📐', title: '立志不可不高，立心不可不正', subtitle: '志不高则易为世俗所移，心不正则易为邪说所惑。\n白话：志向不高容易被世俗风气带着走，心术不正容易被邪说迷惑。' },
                        { emoji: '💬', title: '多言多败，多事多害', subtitle: '守口如瓶，持身若璧。\n白话：话多容易坏事，事多容易遭害。守住嘴如同密封的瓶子，珍惜身体就像捧着璧玉。' },
                        { emoji: '⛰️', title: '闹时炼心，静时养心', subtitle: '坐时守心，行时验心，言时省心，动时制心。\n白话：喧闹时锻炼心性，安静时涵养心性，静坐时持守心性，行动时检验心性，说话时反省心性，做事时克制心性。' },
                        { emoji: '🤲', title: '与朋友交，取其长不计其短', subtitle: '与亲戚处，谅其情不较其非。\n白话：和朋友交往取他的长处不计较短处；与亲戚往来体谅他的难处不挑剔过错。' },
                        { emoji: '📚', title: '读书不独能变化气质，且能养人精神', subtitle: '盖理义收摄故也。\n白话：读书不但能改变气质，而且能涵养人的精神，因为书中的义理可以把散乱的心收摄回来。' },
                        { emoji: '🔔', title: '天地生人，都有一个良心', subtitle: '苟丧此良心，则其去禽兽不远矣。\n白话：天地生育人类，都赋予一颗良心。如果丧失了良心，离禽兽也就不远了。' },
                        { emoji: '🌞', title: '看书须放开眼孔，做人要立定脚跟', subtitle: '看书须放开眼孔，做人要立定脚跟。\n白话：读书要把眼界放开，做人要把脚跟站稳。' },
                        { emoji: '⚖️', title: '凡事不可不认真，凡事不可太认真', subtitle: '真之一字，当有辨。\n白话：凡事不能不尽心尽力，但又不能过于较真。什么叫"真"，应当有所分辨。' },
                        { emoji: '🌙', title: '人生夜坐，各有所得', subtitle: '亦各有未足，静思之，自有无限趣味。\n白话：人生在夜静独坐时各有各的心得，也各有遗憾，静下心来想一想，自有无穷趣味。' },
                        { emoji: '💵', title: '人虽无艰难之时，却不可忘艰难之境', subtitle: '世虽有侥幸之事，断不可存侥幸之心。\n白话：人即使没有经历艰难，也不能忘记艰难的处境；世上虽有侥幸成功的事，却绝不可存侥幸之心。' },
                        { emoji: '🧘', title: '心静则明，水止乃能照物', subtitle: '品超斯远，云飞而不碍空。\n白话：心静才能明察事理，水停下来才能映照万物；品格超越俗世才能致远，云在天空飞扬也不妨碍天空的开阔澄明。' },
                        { emoji: '💭', title: '悟道当如鸿蒙初辟，洗心当如江汉以濯', subtitle: '清心当如清水无滓，立志当如泰山不动。\n白话：体悟大道应像天地初开那般清明，洗涤心灵应像江汉之水冲洗那般彻底，心思清明应像清水那般无杂质，树立志向应像泰山那般不可动摇。' },
                        { emoji: '🧭', title: '存乎天理者，顺而行之', subtitle: '存乎人欲者，逆而制之。\n白话：合乎天理的，顺着去做；属于人欲的，克制不让它滋长。' },
                        { emoji: '💪', title: '儒者多文为富，其文非时文也', subtitle: '君子疾名不称，其名非科名也。\n白话：儒家以多文为富有，但这个文不是八股文；君子怕名声不相称，但这个名不是科考功名。' },
                        { emoji: '🌱', title: '川流不息，逝者如斯', subtitle: '人能以流水之逝为鉴，自能珍惜光阴。\n白话：河流昼夜不息地流淌，时间就像这流水。人能把流水当镜子，自然知道珍惜光阴。' },
                        { emoji: '🎨', title: '才就筏便思舍筏，方是无事道人', subtitle: '若骑驴又复觅驴，终为不了禅和子。\n白话：刚上竹筏就想到达彼岸后要舍弃竹筏，这才是洒脱无事的修道人；如果骑着驴还到处找驴，终究是不能悟道的参禅人。' },
                        { emoji: '🌬️', title: '愁烦中具潇洒襟怀，暗昧处见光明世界', subtitle: '满抱皆春风和气，此心即释然。\n白话：忧愁烦恼中能怀抱潇洒胸怀，黑暗处能看到光明世界，心里充满春风和气，这颗心就释然了。' },
                        { emoji: '💧', title: '以汉高祖之英明，知吕后必杀戚姬', subtitle: '而不能止，盖其明有所蔽也。\n白话：以汉高祖的英明，明知吕后会杀戚姬却不能阻止，可见再英明的人也有被蒙蔽的时候。' },
                        { emoji: '🏔️', title: '饱食暖衣，逸居而无教，则近于禽兽', subtitle: '人知教子，而不知所以教，是犹饱食暖衣而无教也。\n白话：吃得饱穿得暖住得安逸却没有教养，就近于禽兽。人知道要教孩子却不懂教育方法，等于还是饱食暖衣无教养。' },
                        { emoji: '🤐', title: '凡事不宜刻，若读书则不可不刻', subtitle: '凡事不宜贪，若买书则不可不贪；凡事不宜痴，若行善则不可不痴。\n白话：凡事不宜苛刻，但读书不能不求其解；凡事不宜贪，但买书不可不贪；凡事不宜痴迷，但行善却不妨痴迷。' },
                        { emoji: '💬', title: '语言多矫饰，则人品心术皆属可疑', subtitle: '观其言，察其行，可知其人矣。\n白话：说话大多矫饰虚伪的人，其人品心术都值得怀疑。观察他说话再对照他的行为，就可以认清这个人。' },
                        { emoji: '🌿', title: '人生在世，不可一日无事', subtitle: '无事则生惰，惰则万事荒。\n白话：人生在世不能一天没有事做，没事做就会生出懒惰，一懒惰万事都荒废了。' },
                        { emoji: '💡', title: '暗昧处见光明世界，此心即白日青天', subtitle: '阴霾中有一片清明气象，斯人乃霁月光风。\n白话：在黑暗中能看到光明世界，这颗心就是朗朗青天；阴霾中能保持一片清明气象，这个人的襟怀便是明月清风。' },
                        { emoji: '👤', title: '以自己之是非，评古人得失', subtitle: '往往失其实，当设身处地以观之。\n白话：拿自己的是非标准评判古人得失往往失实，应当设身处地从古人角度去看。' },
                        { emoji: '🕊️', title: '存为善之心，不必邀为善之名', subtitle: '有读书之志，不必邀读书之名。\n白话：有行善的心就好不必贪图行善的名声；有读书的志向就好不必贪图读书人的虚名。' },
                        { emoji: '😊', title: '人生不可不储养生之资', subtitle: '亦不可不修卫生之术。\n白话：人生不能不为养生储备物资，也不能不学习卫生保健的方法。' },
                        { emoji: '📚', title: '读书以明理为先，做人以至诚为本', subtitle: '读书不是为了炫耀博学，而是为了涵养品德和明理。\n白话：读书首先要明白道理，做人最根本的是至诚无欺。' },
                        { emoji: '🌌', title: '万籁俱寂中，忽闻鸟啼', subtitle: '便觉有一种清致。人心当有所感通。\n白话：万籁俱寂的夜里忽然听到鸟叫声，便觉有一种清雅之趣。人心应当有这种与天地感通的能力。' },
                        { emoji: '🥾', title: '作德日休，为善最乐', subtitle: '常行善者，自有福报随。\n白话：修德进业天天进步，做善事心灵最为快乐。常常行善的人自有福气伴随。' },
                        { emoji: '🍃', title: '名利之不宜得者竟得之，福终为祸', subtitle: '困穷之最难耐者能耐之，苦定回甘。\n白话：不该得的名利得到了福气终究变成祸患；最难忍耐的困穷能忍耐过去苦尽定会甘来。' },
                        { emoji: '🤲', title: '肯救人坑坎中，便是活菩萨', subtitle: '能脱身牢笼外，便是大英雄。\n白话：肯在别人落入坑陷时伸手相救，就是活菩萨；能超脱世俗名利的牢笼，便是大英雄。' },
                        { emoji: '💯', title: '教子弟不可不严，爱子弟不可不切', subtitle: '严而不切，是谓失教；切而不严，是谓失爱。\n白话：教育子弟不能不严格，爱护子弟不能不深切。严格却不深切叫失教，深切却不严格叫失爱。' },
                        { emoji: '🌙', title: '世之贪夫，溪壑无厌', subtitle: '固不足责。至若谈山林之乐者，未必真得山林之趣。\n白话：世上贪婪的人欲壑难填固然不值一提。但那些口谈山林之乐的人，也未必真能体会山林的趣味。' },
                        { emoji: '⛰️', title: '山阴道上，应接不暇', subtitle: '人心世道，变幻无穷。惟有守一不移，方不为所动。\n白话：山阴道上美景太多来不及观赏，人心世道也是如此变幻无穷。只有守一不移，才不会被这些变化动摇。' },
                        { emoji: '🛤️', title: '人生在世，不可一日闲过', subtitle: '宜做有益之事，读有用之书，交有识之友。\n白话：人生在世不能虚度一天，应该做有益的事、读有用的书、交有见识的朋友。' },
                        { emoji: '⚔️', title: '遇老成人，便肯殷殷求教', subtitle: '则向善之心必笃。\n白话：遇到阅历丰富的老成人便诚恳求教，这种求善的心一定很坚定。' },
                        { emoji: '🧠', title: '人心如路，愈宽则愈平', subtitle: '愈窄则愈险。\n白话：人心像路一样越宽越平坦，越窄越危险。心胸开阔人生路就好走。' },
                        { emoji: '🏡', title: '父子之间不可溺爱，溺爱则忤逆', subtitle: '朋友之间不可过密，过密则疏。\n白话：父子之间不可溺爱，溺爱反会养成忤逆；朋友之间不可过密，过密反而容易疏远。' },
                        { emoji: '📊', title: '财以不蓄为富，官以不显为贵', subtitle: '名以不彰为誉，施以不报为惠。\n白话：财富不积蓄才是真富，官位不显赫才是可贵，名声不张扬才可赞誉，施恩不求回报才是恩惠。' },
                        { emoji: '🥬', title: '淡泊之守，须从浓艳场中试来', subtitle: '镇定之操，还向纷纭境上勘过。\n白话：淡泊的操守要从繁华热闹的场合中试验出来；镇定的节操还要在纷乱复杂的境地里考验过来。' },
                        { emoji: '🎯', title: '君子有高世独立之志', subtitle: '而不与人以易窥；有藐万乘却三军之气，而未尝轻于一发。\n白话：君子有高出世俗的志节却不让人轻易窥见；有藐视君王击退三军的气概，却不曾轻易发作。' },
                        { emoji: '💧', title: '形骸非亲，何况形骸外之长物', subtitle: '大地亦幻，何况大地内之微尘。\n白话：身体尚且不是真正的自己，何况身体之外的身外之物；大地也是幻相，何况大地之内的微尘呢。' },
                        { emoji: '🕰️', title: '淡泊以明志，宁静以致远', subtitle: '非淡泊无以明志，非宁静无以致远。\n白话：不淡泊名利就无法明确志向，不内心宁静就无法到达深远境界。' },
                        { emoji: '📉', title: '贫不足羞，可羞是贫而无志', subtitle: '贱不足恶，可恶是贱而无能；老不足叹，可叹是老而虚生。\n白话：贫穷不羞耻，羞耻的是贫穷又没有志气；低贱不可恶，可恶的是低贱又无能；年老不可叹，可叹的是虚度一生。' },
                        { emoji: '🌳', title: '观天地生物气象，学圣贤克己功夫', subtitle: '观天地生物气象，学圣贤克己功夫。\n白话：观察天地化生万物的气象，学习圣贤克制自己的功夫。' },
                        { emoji: '🙏', title: '敬他人，即是敬自己', subtitle: '靠自己，胜于靠他人。\n白话：尊重他人就是尊重自己，依靠自己胜过依赖他人。' },
                        { emoji: '📖', title: '读书不独变化气质，且能养人精神', subtitle: '故读书一事，不可一日废也。\n白话：读书不只改变气质而且能养人精神，所以读书这件事一天也不能荒废。' },
                        { emoji: '🏋️', title: '人生唯有常是第一美德', subtitle: '余早年于作字一道，亦尝苦思力索，终无所成。近日朝朝摹写，久不间断，遂觉月异而岁不同。\n白话：恒常是最要紧的。年轻时练字苦思力索都写不好，后来每天临摹不间断，日久天长就感觉每月都不同每年都在进步。' },
                        { emoji: '🌙', title: '静坐观心，妄念全消', subtitle: '夜坐观心，真心独露。\n白话：静坐观察内心时妄念全都消散了，夜晚独坐反省时真心才会独自显露。' },
                        { emoji: '📜', title: '读古人书，须要见得古人是处', subtitle: '又要识得古人错处，方是有识。\n白话：读古人书要看出古人说的对的地方，又要识得古人说的错处，这才算有见识。' },
                        { emoji: '🕊️', title: '心旷则万钟如瓦缶', subtitle: '心隘则一发似车轮。\n白话：心胸开阔万钟俸禄也当瓦罐看待；心胸狭隘一根头发也好像车轮那般沉重。' },
                        { emoji: '🛏️', title: '饱暖思淫欲，饥寒起盗心', subtitle: '故君子不可以不修身。\n白话：吃饱穿暖就会产生淫欲，饥寒交迫就会萌发偷盗念头。所以君子不能不好好修养身心。' },
                        { emoji: '🙅', title: '人有过失，不可轻弃', subtitle: '当以春风解冻之意，和气消冰之心，徐徐教导。\n白话：别人有错不要轻易抛弃，应当用春风化冻、和气融冰的心意，慢慢地教导。' },
                        { emoji: '🎒', title: '学以静为主，才须学也', subtitle: '非学无以广才，非静无以成学。\n白话：做学问以静心为主，才能必须通过学习得来。不学习无法增长才能，不静心无法完成学业。' },
                        { emoji: '💕', title: '肝肠煦若春风，虽囊乏一文还怜茕独', subtitle: '气骨清如秋水，纵家徒四壁终傲王公。\n白话：肝肠像春风那般温暖，虽穷得没钱还是可怜孤苦的人；气骨如秋水那般清高，纵使家徒四壁也照样傲视王公。' },
                        { emoji: '⏳', title: '光阴可宝，书不误人', subtitle: '一生快活皆庸福，万种艰辛出伟人。\n白话：光阴宝贵不可虚掷，读书从不会耽误人。一辈子快活只是平庸之福，万般艰辛往往造就伟人。' },
                        { emoji: '😔', title: '愁烦中具潇洒襟怀，满抱皆春风和气', subtitle: '暗昧处见光明世界，此心即白日青天。\n白话：在忧愁烦恼中怀抱潇洒胸怀，满心就都是春风和气；在黑暗中能见到光明世界，这颗心就是朗朗青天。' },
                        { emoji: '🎯', title: '人生不可无志，志当存高远', subtitle: '无志则无以自立，志卑则无以远大。\n白话：人不能没有志向，而且志向要存得高远。没有志向就无从自立，志向卑微就达不到远大目标。' },
                        { emoji: '🛐', title: '天地生人，都有一个良心', subtitle: '苟丧此良心，则虽有人形，实与禽兽无异。\n白话：天地生人，人人都有良心。如果丧失良心，就算长着人的模样，也与禽兽没有差别。' },
                        { emoji: '💭', title: '观朱霞悟其明丽，观白云悟其卷舒', subtitle: '观山岳悟其灵奇，观河海悟其浩瀚，则俯仰间皆文章也。\n白话：看红霞悟到明丽，看白云悟到卷舒自如，看山岳悟到灵奇，看江海悟到浩瀚，天地之间处处都是好文章。' },
                        { emoji: '👥', title: '交友须带三分侠气，做人要存一点素心', subtitle: '轻财足以聚人，律己足以服人，量宽足以得人，身先足以率人。\n白话：交友要有三分侠义之气，做人要存一点朴素之心。不重钱财能团结人，严于律己能让人信服，宽宏大量能得人心，以身作则能领导别人。' },
                        { emoji: '😌', title: '喜来时一检点，怒来时一检点', subtitle: '怠惰时一检点，放肆时一检点，此是省察大条款。\n白话：欢喜时反省一下，愤怒时反省一下，怠惰时反省一下，放肆时反省一下，这是反省自己的大条目。' },
                        { emoji: '🔥', title: '世路风霜，吾人炼心之境也', subtitle: '世情冷暖，吾人忍性之场也；世事颠倒，吾人修行之资也。\n白话：世路的风霜是我们磨炼心性的境界，人情的冷暖是我们坚忍性情的场域，世事的颠倒黑白是我们修行的资粮。' },
                        { emoji: '❤️', title: '为善之端无尽，只讲一让字便人人可行', subtitle: '立身之道何穷，只得一敬字便事事皆整。\n白话：做善事由头无穷，只要讲一个让字便人人都能做到；立身处世的方法无尽，只守住一个敬字便事事都整齐有序。' },
                        { emoji: '📝', title: '人生不可不读书，读书不可不求解', subtitle: '求解不可不身体力行。\n白话：人生于世不能不好好念书，念书不能不求解真义，解了真义不能不去践行。' },
                        { emoji: '🌙', title: '为学不外静敬二字，教人先去骄惰二字', subtitle: '为学不外静敬二字，教人先去骄惰二字。\n白话：做学问不外乎静心和恭敬这两个核心，教导人最要紧是先去掉骄傲和懒惰这两件事。' },
                        { emoji: '🙂', title: '面上扫开十层甲，眉目才无可憎', subtitle: '胸中涤去数斗尘，语言方觉有味。\n白话：只有撕掉脸上层层虚伪的面具，面目才不那么让人憎恶；只有把心里堆积的灰尘洗净，说出的话才听得出味道。' },
                        { emoji: '👥', title: '天下无憨人，岂可妄行欺诈', subtitle: '世上皆苦人，何能独享安闲。\n白话：天下没有真正的傻子，怎能随便欺骗别人；世上大都是受苦的人，怎能独自安享清闲。' },
                        { emoji: '😇', title: '把自己太看高了，便不能长进', subtitle: '把自己太看低了，便不能振兴。\n白话：太把自己当回事就没法长进，太把自己看低了就没法振作。' },
                        { emoji: '🔔', title: '古今有为之士，皆不轻为之士', subtitle: '乡党好事之人，必非晓事之人。\n白话：古往今来有大作为的人，都是不轻举妄动的人；乡里好惹事端的人，一定是不通晓事理的人。' },
                        { emoji: '📚', title: '三代之书不可不读，但不可滞于句下', subtitle: '识三代之书，要在得其大意。\n白话：上古三代的典籍不可不读，但不可拘泥于字句之下，贵在领会书中的大概要义。' },
                        { emoji: '🕊️', title: '人生不可安闲，有恒业才收放心', subtitle: '日用必须简省，杜奢端即以昭俭德。\n白话：人生不可过于安闲，有固定事业才能收回放逸的心思；日常用度必须节省，杜绝奢靡就是昭示节俭美德。' },
                        { emoji: '💎', title: '成大事功，全仗着赤心斗胆', subtitle: '有真气节，才算得铁面铜头。\n白话：成就大事功业全靠赤诚之心和过人胆魄；有真正的气节，才算得上铁面无私、铜头不破。' },
                        { emoji: '⚖️', title: '但责己不责人，此远怨之道也', subtitle: '但信己不信人，此取败之由也。\n白话：只责备自己不责备别人，是远离怨恨的好方法；只相信自己不信赖别人，是招致失败的根由。' },
                        { emoji: '🤝', title: '能结交直道朋友，其人必有令名', subtitle: '肯亲近耆德老成，其家必多善事。\n白话：能结交正直朋友的人一定有好名声，肯亲近德高望重者的人家一定多善事。' },
                        { emoji: '💵', title: '以财交者，财尽而交绝', subtitle: '以色交者，华落而爱渝。\n白话：用钱财交往的，钱财散尽交情就断绝；用美色交往的，容颜老去感情就改变。' },
                        { emoji: '🌞', title: '积善之家必有余庆，积不善之家必有余殃', subtitle: '可知积善以遗子孙，其谋甚远也。\n白话：多做好事的人家必定福泽长远，多做坏事的人家必定祸害不断。可见积善留给子孙才是深远的谋划。' },
                        { emoji: '🗣️', title: '言语之恶，莫大于造诬', subtitle: '行事之恶，莫大于苛刻；心术之恶，莫大于深险。\n白话：言语中最恶毒的是造谣诬陷，行事中最恶毒的是刻薄寡恩，心术中最恶毒的是深沉阴险。' },
                        { emoji: '🌳', title: '自家富贵不着意里，人家富贵不着眼里', subtitle: '此是何等胸襟。\n白话：自家富贵不放在心里，别人富贵不看在眼里，这是多么宽广的胸襟和气度。' },
                        { emoji: '🎯', title: '君子能扶人之危，周人之急', subtitle: '固是美事，能不自夸，则益善矣。\n白话：君子能帮人脱离危难周济别人的急难，这固然是美事，能不以此自夸就更好了。' },
                        { emoji: '🙂', title: '一室闲居，必常怀振卓心', subtitle: '才有生气；同人聚处，须多说切直话，方见古风。\n白话：一个人闲居在家，要常怀振奋之心才有生气；和众人相聚要多说恳切正直的话，才见古朴之风。' },
                        { emoji: '🌙', title: '观周公之不骄不吝，有才何可自矜', subtitle: '观颜子之若无若虚，为学岂容自足。\n白话：看周公才华盖世却不骄傲鄙吝，有才的人怎可自大；看颜回有学问却像没有一样虚心，做学问岂能自满。' },
                        { emoji: '💪', title: '人该省事，不该怕事', subtitle: '人该脱俗，不可矫俗；人该顺时，不可趋时。\n白话：人该省却俗事但不应畏惧事情，该脱俗但不能太过刻意，该顺应时势但不可趋炎附势。' },
                        { emoji: '✨', title: '有真性情须有真涵养，有大识见乃有大文章', subtitle: '有真性情须有真涵养，有大识见乃有大文章。\n白话：有真挚的性情必须要有深厚的涵养做基础，有远大的见识才能写出真正有分量的好文章。' },
                        { emoji: '🧮', title: '凡事谨守规模，必不大错', subtitle: '一生但足衣食，便称小康。\n白话：凡事遵守规矩法度，一定不会犯大错；一生只要衣食丰足，就能称作小康之家了。' },
                        { emoji: '💭', title: '为善之端无尽，只讲一让字便人人可行', subtitle: '立身之道何穷，只得一敬字便事事皆整。\n白话：做善事的开端无穷无尽，只要讲一个"让"字人人都能做到；立身处世的道理无穷无尽，只守住一个"敬"字事事便都会齐整。' },
                        { emoji: '🎓', title: '读书有四个字最要紧，曰阙疑好问', subtitle: '做人有四个字最要紧，曰务实耐久。\n白话：读书最要紧的是四个字：把疑难问题放一放，勤学好问；做人最要紧的是四个字：踏踏实实，持之以恒。' },
                        { emoji: '😇', title: '讲大经纶只是实实落落', subtitle: '有真学问绝不怪怪奇奇。\n白话：讲求经世济民的大学问，不过是实实在在的道理；有真学问的人绝不会表现得怪诞奇异。' },
                        { emoji: '⚡', title: '气性乖张，多是夭亡之子', subtitle: '语言深刻，终为薄福之人。\n白话：脾气性情乖张暴躁的人多半是短命之人；说话尖酸刻薄的人终究是福分浅薄的人。' },
                        { emoji: '📖', title: '读书不可知足，识见不可不广', subtitle: '为学不可不勤，心志不可不专。\n白话：读书求学不能知足，见识学问不可不广博；修习学问不能懒惰，心思志向不能不专注。' },
                        { emoji: '🗣️', title: '莫大之祸起于须臾之不忍', subtitle: '一生之福在于每日之积善。\n白话：再大的祸，通常起于一念之间的不忍耐；一辈子的福，全在于每天都做一点善事。' },
                        { emoji: '⚔️', title: '以直报怨，以德报德', subtitle: '处大事不辞劳怨，堪为栋梁之材。\n白话：用正直回报怨恨，用恩惠回报恩惠。能承担重任不怕辛劳的人，才是国家的栋梁之材。' },
                        { emoji: '🧠', title: '人虽无艰难之时，却不可忘艰难之境', subtitle: '世虽有侥幸之事，断不可存侥幸之心。\n白话：即使人生平顺时也切不可忘记日子艰难时是怎么过的；世间偶尔有走大运的事，但千万不可抱着侥幸的心理。' },
                        { emoji: '🌱', title: '种田人改习尘市生涯，定为败路', subtitle: '读书人干与衙门词讼，便入下流。\n白话：耕田种地的人改行学做市井买卖往往失败；读书人去参与衙门官司就会品格渐入下流。' },
                        { emoji: '💧', title: '浪子回头，仍不惭为君子', subtitle: '贵人失足，便贻笑于庸人。\n白话：走过弯路的人若能回头，仍可做个无愧的君子；高贵的人一旦失足犯错，反而会被庸人嘲笑。' },
                        { emoji: '🫶', title: '把自己看太高了便不能长进', subtitle: '把自己太看低了便不能振兴。\n白话：把自己看得过高，容易骄傲自满无法进步；把自己看得太低，容易丧失信心萎靡不振。' },
                        { emoji: '💼', title: '有不可及之志，必有不可及之功', subtitle: '有不忍言之心，必有不忍言之祸。\n白话：有别人赶不上的志向，才能建立别人达不到的功业；不忍指出别人缺点的人，往往会招致不忍言说的灾祸。' },
                        { emoji: '📚', title: '习读书之业，便当知读书之乐', subtitle: '存为善之心，不必邀为善之名。\n白话：做了读书的事业就要懂得读书的乐趣；心里有行善的念头就好不必贪图行善的名声。' },
                        { emoji: '🕊️', title: '人虽无喜事，常带喜容', subtitle: '便是活神仙。\n白话：一个人虽然没有喜事也常常面露欢喜神情，那他就和活神仙一样让人感到舒服。' },
                        { emoji: '🔨', title: '创业维艰，守成不易', subtitle: '唯有敬事而信，节用而爱人，可以守成。\n白话：开创事业非常艰难，守住成果也很不容易。唯有严肃认真地办事、讲信用、节省开支、爱护人，才能守住家业。' }
                    ]
                },
                '小窗幽记': {
                    name: '小窗幽记',
                    description: '闭门阅佛书 · 开门接佳客 · 出门寻山水',
                    icon: '🪟',
                    cards: [
                        // ===== 卷一 醒 =====
                        { emoji: '🍶', title: '花繁柳密处，拨得开，才是手段', subtitle: '风狂雨急时，立得定，方见脚根。\n白话：在繁复局面中能拨开迷雾才算本事；在危急动荡时能站稳脚跟才见定力。\n——《小窗幽记》卷一·醒' },
                        { emoji: '😊', title: '澹泊之守，须从浓艳场中试来', subtitle: '镇定之操，还向纷纭境上勘过。\n白话：淡泊的操守要在热闹场中检验，镇定的节操要在纷乱环境中磨炼。\n——《小窗幽记》卷一·醒' },
                        { emoji: '🔍', title: '市恩不如报德之为厚', subtitle: '要誉不如逃名之为适，矫情不如直节之为真。\n白话：施恩图报不如知恩报德厚道，追求名声不如逃避虚名自在，矫揉造作不如坦率正直真性情。\n——《小窗幽记》卷一·醒' },
                        { emoji: '😌', title: '使人有面前之誉，不若使人无背后之毁', subtitle: '使人有乍交之欢，不若使人无久处之厌。\n白话：让人当面夸赞不如让人背后不骂，让人初交欢喜不如让人长久相处不生厌烦。\n——《小窗幽记》卷一·醒' },
                        { emoji: '💧', title: '天薄我福，吾厚吾德以迎之', subtitle: '天劳我形，吾逸吾心以补之；天厄我遇，吾亨吾道以通之。\n白话：命运不好就修德来迎接，身体劳累就放松心情来弥补，际遇困厄就顺道而行来打通。\n——《小窗幽记》卷一·醒' },
                        { emoji: '🤐', title: '开口辄生雌黄月旦之言，吾恐微言将绝', subtitle: '捉笔便惊缤纷绮丽之饰，当是妙处不传。\n白话：张口就是评头论足的话，真知灼见就没了；下笔就是华丽修饰，精妙处反而失传了。\n——《小窗幽记》卷一·醒' },
                        { emoji: '⛰️', title: '山穷鸟道，纵藏花谷少流莺', subtitle: '路曲羊肠，虽覆柳荫难放马。\n白话：环境太偏太闭塞，纵然有好风景也难留住人才；条件太差，就算有遮荫处也放不开手脚。\n——《小窗幽记》卷一·醒' },
                        { emoji: '💬', title: '以理听言，则中有主', subtitle: '以道窒欲，则心自清。\n白话：用理智听别人说话，心里就有主见；用大道来克制欲望，心灵自然清净。\n——《小窗幽记》卷一·醒' },
                        { emoji: '💵', title: '斑竹半帘，惟我道心清似水', subtitle: '黄粱一梦，任他世事冷如冰。\n白话：半帘斑竹陪着我，修道之心清冽如水；世事不过梦一场，任它冰冷不挂心。\n——《小窗幽记》卷一·醒' },
                        { emoji: '🌿', title: '淡泊之守，须从浓艳场中试来', subtitle: '镇定之操，还向纷纭境上勘过。\n白话：看淡一切的修养，要在名利场中才见真功；临危不乱的品格，要到混乱局面里才验得出来。\n——《小窗幽记》卷一·醒' },
                        { emoji: '🙂', title: '面上扫开十层甲，眉目才无可憎', subtitle: '胸中涤去数斗尘，语言方觉有味。\n白话：脸上撕掉层层伪装，面目才不让人厌恶；心中洗去厚积的俗尘，言语才耐人寻味。\n——《小窗幽记》卷一·醒' },
                        { emoji: '👁️', title: '眼里无点灰尘，方可读书千卷', subtitle: '胸中没些渣滓，才能处世一番。\n白话：眼睛里不存偏见，读千卷书才能受益；心胸中没有杂念，处世才能干净利落。\n——《小窗幽记》卷一·醒' },
                        { emoji: '⏰', title: '人生有如春睡，一觉便过', subtitle: '世人多忙，不知忙里偷闲。\n白话：人生就像春天打个盹儿，一觉就过去了。世人大多忙碌，却不懂在忙中偷闲。\n——《小窗幽记》卷一·醒' },
                        { emoji: '👂', title: '闻谤而怒，虽巧心力辩，如春蚕作茧', subtitle: '取怨于前，而图报于后，如病叶辞柯。\n白话：听到诽谤就发怒，再怎么巧辩也是春蚕吐丝自缚；前面结下怨恨后面想补救，就像病叶离开树枝已经来不及。\n——《小窗幽记》卷一·醒' },
                        { emoji: '💼', title: '名心未化，对妻孥亦自矜庄', subtitle: '隐衷释然，即梦寐皆成清爽。\n白话：名利心没去干净，对老婆孩子都是一副装腔作势样；内心放松坦然，做梦都觉得清爽自在。\n——《小窗幽记》卷一·醒' },
                        // ===== 卷二 情 =====
                        { emoji: '💕', title: '情最难久，故多情人必至寡情', subtitle: '性自有常，故任性人终不失性。\n白话：感情最不容易长久，所以多情的人最后往往显得无情；本性自有常理，所以任性而为的人反而不失本性。\n——《小窗幽记》卷二·情' },
                        { emoji: '🍂', title: '豆蔻不消心上恨，丁香空结雨中愁', subtitle: '无可奈何花落去，似曾相识燕归来。\n白话：相思之情难消，像豆蔻年华虚度，雨中丁香空结愁怨；花落无法挽回，燕子归来却勾起旧情。\n——《小窗幽记》卷二·情' },
                        { emoji: '🌧️', title: '枕边梦去心亦去，醒后梦还心不还', subtitle: '相思如织，梦魂相萦。\n白话：睡着时心跟着梦走了，醒来梦回人还在原地，心却收不回来了。相思就像织布一样缠绕。\n——《小窗幽记》卷二·情' },
                        { emoji: '🕊️', title: '幽堂昼深，清风忽来好伴', subtitle: '虚窗夜朗，明月不减故人。\n白话：深宅白昼幽静，一阵清风就是好伙伴；夜里窗扉虚掩，明月就像老朋友一样亲近。\n——《小窗幽记》卷二·情' },
                        { emoji: '🌸', title: '陌上繁花，竞是觉来旧梦', subtitle: '天涯游子，可怜未老头白。\n白话：田埂上的繁花，不过是醒来的旧梦；天涯漂泊的人，可怜未老先白了头。\n——《小窗幽记》卷二·情' },
                        { emoji: '🥀', title: '无端饮却相思水，不信相思想煞人', subtitle: '无端坠入红尘梦，惹却三千烦恼丝。\n白话：无缘无故饮下相思之水，竟不信相思真能让人肝肠寸断。\n——《小窗幽记》卷二·情' },
                        { emoji: '🏠', title: '蝴蝶长悬孤枕梦，凤凰不上五更啼', subtitle: '梦里不知身是客，一响贪欢。\n白话：蝴蝶总在孤枕上入梦，凤凰不在五更天啼叫。梦里不知身在何处，只贪恋片刻欢愉。\n——《小窗幽记》卷二·情' },
                        { emoji: '🫂', title: '乍见之欢，不如久处不厌', subtitle: '乍交之兴，不若静思无过。\n白话：初见面的欢愉，不如长久相处不生厌；刚交往的兴奋，不如静下心来彼此无过。\n——《小窗幽记》卷二·情' },
                        // ===== 卷三 峭 =====
                        { emoji: '🪨', title: '立品同白玉，读书到青云', subtitle: '宁为兰摧玉折，不作萧敷艾荣。\n白话：人品像白玉一样高洁，读书追求青云之志；宁为兰草被摧折，也不学艾蒿那样繁茂。\n——《小窗幽记》卷三·峭' },
                        { emoji: '🏔️', title: '贫士肯济人，才是性天中惠泽', subtitle: '闹场能笃学，方为心地上工夫。\n白话：贫穷还能帮助别人，那是天性中的恩惠；热闹场中能专心学习，才是心地上的真功夫。\n——《小窗幽记》卷三·峭' },
                        { emoji: '⚔️', title: '存心邪僻，任尔烧香无点益', subtitle: '扶身正大，见吾不拜有何妨。\n白话：心里全是歪门邪道，烧再多香也没用；立身正大光明，见了神像不拜也无妨。\n——《小窗幽记》卷三·峭' },
                        { emoji: '💪', title: '轻财足以聚人，律己足以服人', subtitle: '量宽足以得人，身先足以率人。\n白话：看轻钱财能团结人，严格律己能让人信服，度量宽宏能赢得人心，事事率先能领导众人。\n——《小窗幽记》卷三·峭' },
                        { emoji: '🧭', title: '大事难事看担当，逆境顺境看襟度', subtitle: '临喜临怒看涵养，群行群止看识见。\n白话：大事当前看担当，顺逆之境看胸襟，喜怒之际看涵养，群体行动时看一个人的见识。\n——《小窗幽记》卷三·峭' },
                        { emoji: '🔥', title: '以货财害子孙，不必操戈入室', subtitle: '以学术杀后世，有如持刀复仇。\n白话：给子孙留过多钱财如同持刀入室；用错误学说毒害后世等于拿着刀乱砍后人。\n——《小窗幽记》卷三·峭' },
                        { emoji: '🫧', title: '仕途虽赫奕，常思林下的风味', subtitle: '则权势之念自轻；世途虽纷华，常思泉下的光景，则利欲之心自淡。\n白话：官做得再大，常想想山林闲居的滋味，权欲就淡了；红尘再繁华，常想想泉下的光景，利欲就轻了。\n——《小窗幽记》卷三·峭' },
                        { emoji: '🎋', title: '一节高一节，虚心直上', subtitle: '一片连一片，绿荫满庭。\n白话：一节比一节高，虚心而直上青云；一片连一片，绿荫满院清凉。\n——《小窗幽记》卷三·峭' },
                        // ===== 卷四 灵 =====
                        { emoji: '🌿', title: '天下无书则已，有则必当读', subtitle: '无酒则已，有则必当饮；无名山则已，有则必当游。\n白话：有书一定要读，有酒一定要饮，有名山一定要去游览。人生不可错过好事物。\n——《小窗幽记》卷四·灵' },
                        { emoji: '🎨', title: '风流自赏，只容花鸟趋陪', subtitle: '真率谁知，合受烟霞供养。\n白话：才情风雅自我欣赏，只让花鸟来作伴；真心率性谁能理解，合该受烟霞来滋养。\n——《小窗幽记》卷四·灵' },
                        { emoji: '🏞️', title: '胸藏丘壑，城市不异山林', subtitle: '兴寄烟霞，阎浮有如蓬岛。\n白话：胸中装有丘壑，身在城市也像身处山林；兴致寄托烟霞，尘世也像蓬莱仙岛。\n——《小窗幽记》卷四·灵' },
                        { emoji: '🌸', title: '花前解佩，湖上停桡', subtitle: '弄月放歌，清风明月不用一钱买。\n白话：花前解下玉佩，湖上停船弄月高歌，清风明月不用花一分钱就能享受。\n——《小窗幽记》卷四·灵' },
                        { emoji: '🌧️', title: '雨过蝉声来，花气令人醉', subtitle: '山中无历日，寒尽不知年。\n白话：雨后蝉声入耳，花香让人沉醉；山中不用历书，寒尽也不知过去多少年。\n——《小窗幽记》卷四·灵' },
                        // ===== 卷五 素 =====
                        { emoji: '🏺', title: '田园有真乐，不读过终为忙人', subtitle: '诵读有真趣，不玩味终为鄙夫；山水有真赏，不领会终为漫游。\n白话：田园有真乐趣，不亲身走过只是忙人；读书有真趣味，不细细品味就是粗人；山水有真赏，不领悟就是瞎逛。\n——《小窗幽记》卷五·素' },
                        { emoji: '📖', title: '闭门阅佛书，开门接佳客，出门寻山水', subtitle: '此人生三乐。\n白话：闭门读佛经，开门迎贵客，出门游山玩水，这是人生三大快乐。\n——《小窗幽记》卷五·素' },
                        { emoji: '🍵', title: '佳茗可以清心，好书可以养性', subtitle: '清琴可以怡情，奇石可以镇宅。\n白话：好茶清心，好书养性，清音舒畅心情，奇石安定家宅。\n——《小窗幽记》卷五·素' },
                        { emoji: '🧹', title: '净几明窗，一轴画，一囊琴', subtitle: '一只鹤，一瓯茶，一炉香，一部法帖；小园幽径，几丛花，几群鸟，几区亭，几拳石，几池水，几片闲云。\n白话：窗明几净，挂一幅画、放一张琴，养鹤喝茶焚香赏字帖；小园幽径，花丛鸟群亭台奇石池水闲云，足慰平生。\n——《小窗幽记》卷五·素' },
                        { emoji: '🪴', title: '栽花种草，可以避俗', subtitle: '焚香煮茗，可以清心。\n白话：栽些花种些草可以远离俗气，点上一炷香煮上一壶茶可以清静心神。\n——《小窗幽记》卷五·素' },
                        { emoji: '🌙', title: '灯下玩花，帘内看月', subtitle: '雨后观景，醉里题诗，梦中闻书声，皆有别趣。\n白话：灯下赏花帘内望月，雨后观景醉中写诗梦中听读书声，都别有一番趣味。\n——《小窗幽记》卷五·素' },
                        // ===== 卷六 景 =====
                        { emoji: '🌅', title: '一抹万家烟，板桥人迹，野航灯火', subtitle: '孤鸿遥天，残照西风，数点栖鸦，无限诗情画意。\n白话：一抹炊烟万家烟火，板桥上行人足迹，小船里灯火摇曳，远处孤雁西风残照归鸦几处，到处是诗情画意。\n——《小窗幽记》卷六·景' },
                        { emoji: '🌳', title: '门内有径，径欲曲', subtitle: '径边有松，松欲古；松畔有石，石欲怪；石后有亭，亭欲朴。\n白话：门里有小径，径要曲折幽深；径边有松树，树要古拙苍劲；松旁有怪石，石后有小亭，亭要朴素自然。\n——《小窗幽记》卷六·景' },
                        { emoji: '🌧️', title: '春雨宜读书，夏雨宜弈棋', subtitle: '秋雨宜检藏，冬雨宜饮酒。\n白话：春雨适合读书，夏雨适合下棋，秋雨适合整理收藏，冬雨适合温酒小酌。\n——《小窗幽记》卷六·景' },
                        { emoji: '❄️', title: '雪之妙在能积，云之妙在不留', subtitle: '月之妙在有圆有缺。\n白话：雪妙在能堆积，云妙在不留痕迹，月亮妙在有阴晴圆缺。\n——《小窗幽记》卷六·景' },
                        { emoji: '🌊', title: '水之为声有四：有瀑声，有流声，有滩声，有沟浍声', subtitle: '风之为声有三：有松涛声，有秋叶声，有波浪声。\n白话：水的声音有瀑布声、溪流声、滩声、沟渠声；风的声音有松涛声、秋叶声、浪涛声。\n——《小窗幽记》卷六·景' },
                        // ===== 卷七 韵 =====
                        { emoji: '🎵', title: '春听鸟声，夏听蝉声', subtitle: '秋听虫声，冬听雪声；白昼听棋声，月下听箫声，山中听松声，水际听欸乃声，方不虚此生耳。\n白话：春听鸟叫夏听蝉鸣秋听虫声冬听雪落，白天听棋子声月下听箫声山中听松涛水边听桨声，才算不辜负此生。\n——《小窗幽记》卷七·韵' },
                        { emoji: '🍵', title: '窗宜竹雨声，亭宜松风声', subtitle: '几宜洗砚磨墨声，榻宜翻书声。\n白话：窗前宜听竹叶雨声，亭子里宜听松风阵阵，书案宜有洗砚磨墨声，床上宜有翻书声。\n——《小窗幽记》卷七·韵' },
                        { emoji: '🎋', title: '竹风一阵，飘扬茶灶疏烟', subtitle: '梅月半弯，掩映书窗残雪。\n白话：一阵竹风吹过，飘起茶灶上袅袅轻烟；半弯梅花月色，映照书窗外未消的残雪。\n——《小窗幽记》卷七·韵' },
                        { emoji: '🌸', title: '花看半开，酒饮微醉', subtitle: '此中大有佳趣。若至烂漫酕醄，便成恶境矣。\n白话：赏花要看半开时的娇羞，喝酒喝到微醺即可，这里面趣味无穷；花开烂漫酒到酩酊大醉，就落入不好的境地了。\n——《小窗幽记》卷七·韵' },
                        { emoji: '📜', title: '楷书须如文人，草书须如名将', subtitle: '行书介乎二者之间，如羊叔子缓带轻裘，正是佳处。\n白话:楷书要像文人那样端正，草书要像名将那样豪放，行书介乎二者之间，像羊祜那样宽缓衣带轻裘加身，恰到好处。\n——《小窗幽记》卷七·韵' },
                        // ===== 卷八 奇 =====
                        { emoji: '🌊', title: '山以虚而受，水以实而流', subtitle: '山虚则云生，水实则月印。\n白话：山因为空旷就能容纳，水因为充实才流动不息；山空旷云雾缭绕，水充盈才能印出月亮。\n——《小窗幽记》卷八·奇' },
                        { emoji: '🦅', title: '有大通必有大塞，无奇遇必无奇穷', subtitle: '自古英雄多被折磨。\n白话：有大通达必有大阻塞，没有非凡的机遇也就没有出奇的困境。自古英雄都免不了被折磨。\n——《小窗幽记》卷八·奇' },
                        { emoji: '🧘', title: '以无累之神，合有道之器', subtitle: '宫商暂离，不可得已。\n白话：用无牵无挂的精神，配上合乎大道的器物，就算乐曲暂时停止，余韵也不可断绝。\n——《小窗幽记》卷八·奇' },
                        // ===== 卷九 绮 =====
                        { emoji: '💃', title: '艳如桃李，冷若冰霜', subtitle: '在浓艳之中，须有一段冷趣。\n白话：艳丽如桃李，却冷若冰霜；在极致的繁华浓艳里要有一股冷清的韵致。\n——《小窗幽记》卷九·绮' },
                        { emoji: '💄', title: '镜花水月，若使慧眼看透', subtitle: '笔彩剑光，须教壮志消磨。\n白话：镜中花水中月，若用智慧眼看透虚幻，就不再沉迷；笔端的文采剑上的锋芒，也要让雄心壮志被岁月冲刷。\n——《小窗幽记》卷九·绮' },
                        { emoji: '🌷', title: '流苏帐底，披之而见月影星辉', subtitle: '沉香阁中，举之而聆鸾鸣鹤唳。\n白话：流苏帐里撩开帘子望见月影星光，沉香阁中抬头听到鸾鹤和鸣。\n——《小窗幽记》卷九·绮' },
                        { emoji: '🌙', title: '梦以昨日为前身，可以今夕为来世', subtitle: '人在梦中，不知是梦。\n白话：梦里以昨日为前世，把今夜当作来生。人在梦中，往往不知道自己在做梦。\n——《小窗幽记》卷九·绮' },
                        // ===== 卷十 豪 =====
                        { emoji: '🍷', title: '胸中荷香馥郁，不染半点尘', subtitle: '眼前霁月光风，常存一片豪情。\n白话：胸怀如荷花般芬芳，不沾半点俗尘；眼前光风霁月，常怀一片豪情壮志。\n——《小窗幽记》卷十·豪' },
                        { emoji: '🐴', title: '驷马难追，吾欲三缄其口', subtitle: '浮云易散，谁能一诺千金。\n白话：驷马难追回说出去的话，我要把嘴管得牢牢的；浮云最容易散去，谁又能把诺言看得像千金那么重。\n——《小窗幽记》卷十·豪' },
                        { emoji: '⚡', title: '烈士须一剑，则芙蓉赤精', subtitle: '豪士须一醉，则肝胆相照。\n白话：刚烈之士需要一把利剑才衬得出赤诚；豪迈之士需要一场大醉才能肝胆相照。\n——《小窗幽记》卷十·豪' },
                        { emoji: '🔥', title: '身世浮名余以梦蝶视之', subtitle: '切莫受其颠倒。\n白话：身外浮名我把它看作庄周梦蝶一般虚幻，切不可被它颠倒了心神。\n——《小窗幽记》卷十·豪' },
                        // ===== 卷十一 法 =====
