                        { emoji: '📏', title: '处事宜宽，操守宜严', subtitle: '居家宜简，教子宜正。\n白话：处理事情要宽厚，持守节操要严格，治家应该俭朴，教育子女应该正道直行。\n——《小窗幽记》卷十一·法' },
                        { emoji: '🌱', title: '童子智少，愈少而愈完', subtitle: '成人智多，愈多而愈散。\n白话：小孩知识少，越少越圆满；大人知识多，越多越散乱。\n——《小窗幽记》卷十一·法' },
                        { emoji: '🧠', title: '多躁者必无沉潜之识', subtitle: '多畏者必无卓越之见；多欲者必无慷慨之节，多言者必无笃实之心。\n白话：暴躁的人一定缺乏深沉的见识，胆小的人一定没有卓越的见解；贪欲多的人一定没有慷慨气节，话多的人一定缺乏踏实的心。\n——《小窗幽记》卷十一·法' },
                        { emoji: '📖', title: '读书贵神解，无事守章句', subtitle: '混迹尘中，高视物外。\n白话：读书贵在领会精神，不要死守章句；混迹于红尘中，眼光要超越世俗之外。\n——《小窗幽记》卷十一·法' },
                        { emoji: '💼', title: '人有一字不识，而多诗意', subtitle: '一偈不参，而多禅意；一勺不濡，而多酒意；一石不晓，而多画意。\n白话：不识字的人未必没有诗意，没参过禅的人未必没有禅意，不沾酒的人未必没有酒兴，不懂奇石的人未必没有赏画的眼光。\n——《小窗幽记》卷十一·法' },
                        { emoji: '👥', title: '简傲不可谓高，谄谀不可谓谦', subtitle: '刻薄不可谓严明，阘茸不可谓宽大。\n白话：简慢孤傲不能说是清高，阿谀奉承不能说是谦虚，刻薄不能说是严明，庸懦拖拉不能说是宽容。\n——《小窗幽记》卷十一·法' },
                        { emoji: '🔑', title: '士君子尽心利济，使海内少他不得', subtitle: '则天亦自然少他不得，即此便是立命。\n白话：一个君子诚心救助世人，让天下少不得他，那么上天自然也少不得他，这就是安身立命的根本。\n——《小窗幽记》卷十一·法' },
                        // ===== 卷十二 倩 =====
                        { emoji: '🎭', title: '会心处不必在远', subtitle: '翳然林水，便自有濠濮间想也，觉鸟兽禽鱼自来亲人。\n白话：让人会心舒畅的地方不定要远处，就在水边林下，也自然而然地生出庄子在濠梁之上的逍遥感觉，连鸟兽禽鱼都像来亲近你。\n——《小窗幽记》卷十二·倩' },
                        { emoji: '🌸', title: '花关曲折，云来不认湾头', subtitle: '草径幽深，叶落但敲门扇。\n白话：花间小路曲曲折折，白云飘来都认不得路在哪个湾头；草木小径又深又静，落叶只是轻轻敲打柴门。\n——《小窗幽记》卷十二·倩' },
                        { emoji: '🌿', title: '半坞白云耕不尽，一潭明月钓无痕', subtitle: '忙里偷闲，苦中作乐。\n白话：半山坳的白云耕不完，一潭明月钓起却不见痕迹；在忙碌中偷得片刻清闲，在苦日子里自己找乐子。\n——《小窗幽记》卷十二·倩' },
                        { emoji: '🏡', title: '茅斋独坐茶频煮，七碗后气爽神清', subtitle: '竹榻高眠书漫抛，一枕余心闲梦稳。\n白话：在茅草小屋里独坐，把茶煮了一遍又一遍，喝过七碗神清气爽；在竹榻上高枕无忧，书随便扔着，心里闲适睡觉也安稳了。\n——《小窗幽记》卷十二·倩' },
                        { emoji: '🌙', title: '清宵独坐，邀月言愁', subtitle: '良夜孤眠，呼蛩语恨。\n白话：清静的夜里独自坐着，邀明月来听我说愁苦；美好的夜晚独自入眠，叫蟋蟀来和我一起诉说遗憾。\n——《小窗幽记》卷十二·倩' },
                        { emoji: '🫧', title: '孤帆落照中，见青山映带', subtitle: '征鸿回渚，争栖竞啄，宿水鸣云，声凄夜月。\n白话：一只帆船在夕阳余晖里，望见青山相映，远飞的大雁回到沙洲，争着栖宿啄食，夜月下叫声凄清。\n——《小窗幽记》卷十二·倩' }
                    ]
                },
                '培根随笔': {
                    name: '培根随笔',
                    description: '世事洞明皆学问 · 人情练达即文章',
                    icon: '🥓',
                    cards: [
                        { emoji: '📖', title: '论读书', subtitle: '读书足以怡情，足以傅彩，足以长才。其怡情也，最见于独处幽居之时；其傅彩也，最见于高谈阔论之中；其长才也，最见于处世判事之际。\n白话：读书可以陶冶情操、增添文采、增长才干。独处时最见乐趣，高谈阔论中最显光彩，处理世事时最能发挥才能。\n——《培根随笔·论读书》' },
                        { emoji: '🌿', title: '论真理', subtitle: '善戏谑的彼拉多曾问：“真理是什么呢？”问了之后却不等回答。世上还有许多人心随境转，认为固守真理等于自戴枷锁。\n白话：什么是真理？许多人提问却不等答案，因为他们觉得遵守真理会束缚自由。\n——《培根随笔·论真理》' },
                        { emoji: '☠️', title: '论死亡', subtitle: '成人畏惧死亡，犹如儿童畏惧黑暗；儿童天然的畏惧因故事而加深，成人对死亡的恐惧亦然。\n白话：大人怕死如同小孩怕黑，听了太多恐怖故事就更害怕。其实死亡本身未必那么可怕。\n——《培根随笔·论死亡》' },
                        { emoji: '🤝', title: '论复仇', subtitle: '报复是一种野蛮的司法。人若习惯了复仇，他的伤口便永远无法愈合。\n白话：复仇是野蛮人的法律，执著于报复只会让伤口一直溃烂。宽恕才是疗愈。\n——《培根随笔·论复仇》' },
                        { emoji: '😨', title: '论逆境', subtitle: '顺境的美德是节制，逆境的美德是坚韧。后者是更为伟大的德行。\n白话：顺境中展现的美德是节制，逆境中展现的美德是坚韧，坚韧比节制更伟大。\n——《培根随笔·论逆境》' },
                        { emoji: '🎭', title: '论伪装与掩饰', subtitle: '伪装不过是短处的一种权宜之计，这种短处必须善于弥补，才能转化为长处。\n白话：伪装是弱者的权宜之计，只有懂得适时弥补自身弱点，才能把短处变成长处。\n——《培根随笔·论伪装与掩饰》' },
                        { emoji: '👨‍👦', title: '论父母与子女', subtitle: '父母的欢乐藏而不露，他们的悲哀与恐惧也是这样。欢乐无法说出口，悲哀与恐惧则不愿意说。\n白话：父母对子女的喜悦藏在心里不说出来，他们的忧虑和害怕也同样沉默。\n——《培根随笔·论父母与子女》' },
                        { emoji: '💍', title: '论结婚与独身', subtitle: '有妻儿者等于向命运抵押了人质，因为妻儿是完成大事业的障碍。\n白话：成家的人等于给命运交出了人质，因为家室有时会成为成就大事的拖累。但也有许多事业因家庭而更有意义。\n——《培根随笔·论结婚与独身》' },
                        { emoji: '⚔️', title: '论嫉妒', subtitle: '嫉妒是魔鬼的属性，它总是在暗地里悄悄毁掉美好的事物。\n白话：嫉妒像魔鬼一样，总在阴暗角落里悄悄毁掉好东西。\n——《培根随笔·论嫉妒》' },
                        { emoji: '❤️', title: '论爱情', subtitle: '舞台上的爱情比生活中的爱情更美好。因为舞台上，爱情是喜剧的素材，也是悲剧的素材；而在生活中，爱情招来的祸患远多于幸福。\n白话：戏台上的爱情比现实中更美，因为现实中爱情虽然也有甜蜜，但常常带来灾祸。\n——《培根随笔·论爱情》' },
                        { emoji: '👑', title: '论高位', subtitle: '居高位的人是三重奴仆：君主的奴仆、名声的奴仆、事业的奴仆。他们没有自由。\n白话：做高官的人其实是三种奴隶：君主的奴隶、名声的奴隶、工作的奴隶，他们没有真正的自由。\n——《培根随笔·论高位》' },
                        { emoji: '🎮', title: '论权位', subtitle: '居高位者身不由己，他们想做好事往往受到掣肘，想做坏事则易于成功。\n白话：处在权力位置上的人往往身不由己，想做好事有人拦着，想干坏事却很容易做成。\n——《培根随笔·论权位》' },
                        { emoji: '🧘', title: '论养生', subtitle: '人应当把心得调适放在首位，因为身体是灵魂的居所，居所若不洁，主人便不能安居。\n白话：养生先养心，因为身体是心灵住的房子，房子不干净，住在里面也不会舒服。\n——《培根随笔·论养生》' },
                        { emoji: '🤫', title: '论猜疑', subtitle: '猜疑之心犹如蝙蝠，它总是在黑暗中飞起。这种心理使人陷入迷惘，混淆敌友，破坏事业。\n白话：猜疑像蝙蝠一样总在黑暗中起飞，让人分不清敌友，坏了很多大事。\n——《培根随笔·论猜疑》' },
                        { emoji: '💬', title: '论言谈', subtitle: '善于辞令的人能把一句寻常话调弄得活泼生动，他们像流水而非死水，活泼流畅。\n白话：会说话的人能把平常话讲得生动有趣，话语像流水一样活泼，而不是一潭死水。\n——《培根随笔·论言谈》' },
                        { emoji: '💰', title: '论财富', subtitle: '财富是德行的包袱，这个包袱有时拖累德行，有时又支撑德行，但终究是包袱。\n白话：财富就像德行背的包袱，有时候拖累德行，有时候又给德行提供支撑，但归根结底是负担。\n——《培根随笔·论财富》' },
                        { emoji: '⚖️', title: '论司法', subtitle: '为法官者，应当记住他们的职权是对法律的解释，而不是创造法律，否则就会像罗马教会那样。\n白话：法官的职责是解释法律而不是创造法律，不能越权。\n——《培根随笔·论司法》' },
                        { emoji: '😡', title: '论愤怒', subtitle: '愤怒是一种卑贱的性情，它使人在最需要理智的时候变得最为愚蠢。\n白话：愤怒是一种低级情绪，人在最需要用脑的时候，愤怒却让人变得最愚蠢。\n——《培根随笔·论愤怒》' },
                        { emoji: '🌪️', title: '论变易兴衰', subtitle: '一切事物的变化都是波浪式的，有起有伏，没有一件事物永远停在高峰。\n白话：万事万物的变化都像波浪一样有起有伏，没有永远站在高峰不下来的。\n——《培根随笔·论变易兴衰》' },
                        { emoji: '🏠', title: '论建筑', subtitle: '造房子是为了居住，而不是为了观赏。所以应当先求实用，而后再讲匀称美观，除非两者可以兼顾。\n白话：盖房子首先是用来住的不是用来看的，要先讲实用再看美观，能兼得最好。\n——《培根随笔·论建筑》' },
                        { emoji: '🌳', title: '论花园', subtitle: '万能的上帝是第一个经营花园者，园艺是最纯净的人生乐趣之一，是给人类精神的最好的补养品。\n白话：花园是纯洁的人生乐趣，上帝最早就是园丁。园艺能给精神最好的滋养。\n——《培根随笔·论花园》' },
                        { emoji: '🤝', title: '论交涉', subtitle: '与人交涉时，与其用言辞来打动对方，不如以对方习惯的方式来交涉，这样更为有效。\n白话：跟人打交道，与其光靠嘴皮子，不如用对方习惯且接受的方式来办事更有效。\n——《培根随笔·论交涉》' },
                        { emoji: '🧑‍🤝‍🧑', title: '论随从与友人', subtitle: '多交朋友，却不要太依赖朋友；有朋友的帮助固然好，但不可事事依赖。\n白话：多交朋友但不要过分依赖，有朋友帮忙是好事，但别什么事都靠别人。\n——《培根随笔·论随从与友人》' },
                        { emoji: '⏳', title: '论时机', subtitle: '机会总是先给你一个可握的把手，然后让你抓住它的全身；如果你错过了这个把手，那便再难抓住它了。\n白话：机会来时会先给你一个抓的把手，抓住了就得到全部；错过这个把手就很难再抓到了。\n——《培根随笔·论时机》' },
                        { emoji: '📚', title: '论学问', subtitle: '历史使人明智，诗歌使人灵秀，数学使人周密，科学使人深刻，伦理学使人庄重，逻辑修辞之学使人善辩。\n白话：读历史让人明智，诗歌让人灵秀，数学使人周密，科学使人深刻，伦理使人庄重，逻辑修辞教人善于辩论。\n——《培根随笔·论学问》' },
                        { emoji: '🎭', title: '论礼貌', subtitle: '讲究礼貌的人，正如有了光滑的磁石，便能吸引铁针；但若是磁石本身有内在的吸力，则更为可贵。\n白话：有礼貌就像光滑的磁石能吸住铁针，但若内在有真实的吸引力就更可贵了。\n——《培根随笔·论礼貌》' },
                        { emoji: '🏅', title: '论荣誉', subtitle: '荣誉之获得，好比在市场上交易，你要肯出价，才能买进；你若空手而来，则空手而归。\n白话：赢得荣誉就像赶集做买卖，你得出得起价钱才能买到；空着手来只能空着手回去。\n——《培根随笔·论荣誉》' },
                        { emoji: '⚖️', title: '论党派', subtitle: '党争是政治的发烧，如果热度适当，也许不至于危害国家；但如果烧得过了头，便会毁掉一切。\n白话：党派争斗像发烧，低烧或许不碍事，高烧能毁了一切。\n——《培根随笔·论党派》' },
                        { emoji: '💡', title: '论快捷', subtitle: '过于求速是做事冒进的原因之一，好像医生给人治病，只顾迅速把病压下去，却不管调理。\n白话：一味求快是做事的冒失鬼，像只顾压住病情不管调理身体的医生。\n——《培根随笔·论快捷》' },
                        { emoji: '🕊️', title: '论狡猾', subtitle: '狡猾是一种阴险的聪明，它与智慧的距离，就像猴子与人的距离。\n白话：狡猾是见不得光的聪明，和智慧之间的差距，好比猴子跟人之间的差距。\n——《培根随笔·论狡猾》' },
                        { emoji: '🌱', title: '论青年与老年', subtitle: '青年人富于直觉，老年人长于思考。青年人的错误常使事务败坏，老年人的错误则只是本该做得更多更快而已。\n白话：年轻人直觉强，老年人擅长思考。年轻人犯错容易把事情搞砸，老年人犯错往往是做得太少太慢。\n——《培根随笔·论青年与老年》' },
                        { emoji: '🎨', title: '论美', subtitle: '形体之美要胜于颜色之美，而优雅行为之美又胜于形体之美。\n白话：身材美胜过肤色美，而优雅的举止又胜过身材美。最高的美是行为的美。\n——《培根随笔·论美》' },
                        { emoji: '🧠', title: '论残疾', subtitle: '身体残疾的人，常常借精神的力量来弥补，所以他们往往比常人更聪明、更机警。\n白话：身体有缺陷的人往往用精神力量弥补，所以常比普通人更聪明、更机敏。\n——《培根随笔·论残疾》' },
                        { emoji: '🏗️', title: '论营造', subtitle: '兴建大工程要量力而行，如果中途停止，那已经建成的部分也会成为别人的笑柄。\n白话：建大工程要先算好财力，盖到一半停工，建好的那部分也会成笑话。\n——《培根随笔·论营造》' },
                        { emoji: '🔄', title: '论革新', subtitle: '初生之物往往形状丑陋，革新也是这样，任何改革在初始阶段看起来都是难看的。\n白话：新事物一开始往往难看，任何变革刚出现时都显得丑陋。\n——《培根随笔·论革新》' },
                        { emoji: '⏰', title: '论游历', subtitle: '年轻人游历，是一种教育的一部分；年长者游历，则是一种经验的一部分。\n白话：年轻人旅游是受教育，年长者旅游是增长阅历。\n——《培根随笔·论游历》' },
                        { emoji: '👑', title: '论帝王', subtitle: '帝王身居至高之位，却没有什么东西属于自己，他们的一切都归属于国事。\n白话：当皇帝站得最高，但没什么是自己的，一切都属于国家。\n——《培根随笔·论帝王》' },
                        { emoji: '🎓', title: '论贵族', subtitle: '一个纯粹的贵族阶层，能增加国家的威严，却会削减君主的权力。\n白话：纯粹的贵族阶层能增添国家的威严，但会削弱君主的实权。\n——《培根随笔·论贵族》' },
                        { emoji: '🗣️', title: '论谣言', subtitle: '谣言的力量极大，它能把最牢靠的信任摧毁，正如风能把最坚固的大树连根拔起。\n白话：谣言的力量极大，能像风把大树连根拔起一样，摧毁最牢固的信任。\n——《培根随笔·论谣言》' },
                        { emoji: '🧭', title: '论殖民地', subtitle: '创建殖民地是一种英雄的壮举，如同牧人赶着羊群去寻找新的牧场。\n白话：建立殖民地是一种英雄般的行动，像牧人领着羊群寻找新草场。\n——《培根随笔·论殖民地》' },
                        { emoji: '⛏️', title: '论司法与公道', subtitle: '为法官者应当学鹌鹑，鹌鹑虽在丛中鸣叫，却把眼睛望着天空。\n白话：法官应该像鹌鹑，在灌木丛里鸣叫，眼睛却望天，意思是虽在地面周旋，却要仰望天理公道。\n——《培根随笔·论司法与公道》' },
                        { emoji: '🚫', title: '论拖延', subtitle: '拖延就像剥猫皮，永远无法干净利落地完成，它总是要再拖一会儿。\n白话：做事拖拖拉拉就像剥猫皮，永远没法一刀两断地完成。\n——《培根随笔·论拖延》' },
                        { emoji: '👨‍👧', title: '论习惯与教育', subtitle: '习惯是一种顽强而巨大的力量，它可以主宰人生。因此，人自幼就应该通过完美的教育去建立一种好的习惯。\n白话：习惯的力量大得能主宰人生，所以从小就要用好的教育培养好习惯。\n——《培根随笔·论习惯与教育》' },
                        { emoji: '🍀', title: '论幸运', subtitle: '幸运是个任性而盲目的女神，她总是偏爱那些胆大敢闯的人。\n白话：幸运总是盲目任性的，她更偏爱那些胆子大、敢行动的人。\n——《培根随笔·论幸运》' },
                        { emoji: '📜', title: '论法律', subtitle: '法律之于国家，正如墙垣之于房屋；没有墙垣，房屋便不成其为房屋。\n白话：法律对于国家就像墙壁对于房子，没墙壁的房子不叫房子。\n——《培根随笔·论法律》' },
                        { emoji: '🔥', title: '论野心', subtitle: '野心如同胆汁，它是一种促人奋发行动的体液；但若不受控制，也会使人变得焦躁、恶毒。\n白话：野心像胆汁，可以促使人奋发，但不受控制也会让人急躁阴毒。\n——《培根随笔·论野心》' },
                        { emoji: '🎭', title: '论假聪明', subtitle: '有些人喜欢用装腔作势来显示聪明，正如哑巴用手势来表达一样。\n白话：有人喜欢装腔作势地显摆自己，像哑巴比手画脚，其实不是真聪明。\n——《培根随笔·论假聪明》' },
                        { emoji: '🧑‍💻', title: '论消费', subtitle: '日常的消费应当量入为出，如果只是为了摆阔，那便是最愚蠢的行为。\n白话：花钱要看自己挣多少，为了面子铺张浪费是最蠢的事。\n——《培根随笔·论消费》' },
                        { emoji: '🌍', title: '论世事之变迁', subtitle: '一切事物都是循环往复的，有开始便有结束，有昌盛便有衰败。\n白话：万事万物都有起有落、有始有终，繁荣必有衰落的一天。\n——《培根随笔·论世事之变迁》' },
                        { emoji: '🔮', title: '论预言', subtitle: '预言，多半是一些人在事实发生后编造出来的谎言。\n白话：很多预言都是事后诸葛亮，事情发生了才编出来骗人的。\n——《培根随笔·论预言》' },
                        { emoji: '💪', title: '论勇气', subtitle: '勇气是衡量灵魂大小的标准，在伟大的事业中，勇气往往比计谋更为重要。\n白话：勇气是灵魂大小的尺子，干大事时勇气常常比计谋更关键。\n——《培根随笔·论勇气》' },
                        { emoji: '🦊', title: '论狡猾与智慧', subtitle: '狡猾是一种扭曲的智慧，它与智慧之间的距离，就像猴子与人的距离。\n白话：狡猾是被扭曲过的智慧，它和真正智慧的距离，就像猴子和人一样远。\n——《培根随笔·论狡猾与智慧》' },
                        { emoji: '🎓', title: '论学问', subtitle: '多诈的人藐视学问，愚鲁的人羡慕学问，聪明的人运用学问。\n白话：奸诈的人看不起学问，愚笨的人羡慕学问，聪明的人则运用学问。\n——《培根随笔·论学问》' },
                        { emoji: '🤲', title: '论仁慈', subtitle: '仁慈是人性中的黄金，它比任何宝石都更光辉璀璨。\n白话：仁慈是人性中的金子，比什么宝石都光辉耀眼。\n——《培根随笔·论仁慈》' },
                        { emoji: '🗡️', title: '论战争', subtitle: '战争是上帝惩罚人类的鞭子，没有一场战争是真正正义且完全必要的，除非是为了自卫。\n白话：战争是老天用来惩罚人的鞭子，除了自卫，很少有战争真正正义又非打不可。\n——《培根随笔·论战争》' },
                        { emoji: '🍽️', title: '论饮食', subtitle: '饮食应当适量，吃得太多会使人迟钝，吃得太少又使人无力。节制是饮食最好的调料。\n白话：吃饭要适量，吃多了反应迟钝，吃少了没力气。最好的调味品是节制。\n——《培根随笔·论饮食》' },
                        { emoji: '🏛️', title: '论国家真正伟大之道', subtitle: '国家的伟大不在于疆土广阔，而在于其人民的素质；正如人的伟大不在于身材高大，而在于心胸宽广。\n白话：国家的伟大不在地盘大，而在国民素质高；就像人不在个头高，在心胸宽。\n——《培根随笔·论国家真正伟大之道》' },
                        { emoji: '🏥', title: '论养生', subtitle: '人应当把自己的身体当作庙宇，而不是当作工具来使用。\n白话：要把身体当圣殿来爱护，不要只当工具来使用。\n——《培根随笔·论养生》' }
                    ]
                },
                '传习录': {
                    name: '传习录',
                    description: '心即理 · 知行合一 · 致良知',
                    icon: '🧠',
                    cards: [
                        { emoji: '💡', title: '心即理', subtitle: '心即理也。天下又有心外之事，心外之理乎？\n白话：心就是天理。天下哪有心外的事、心外的理？一切道理都在自己的心里。\n——《传习录》卷上·徐爱录' },
                        { emoji: '🤝', title: '知行合一', subtitle: '知是行的主意，行是知的功夫；知是行之始，行是知之成。\n白话：知和行本是一体，知是行的开始，行是知的完成。真知必能行，不行只是未知。\n——《传习录》卷上·徐爱录' },
                        { emoji: '👶', title: '致良知', subtitle: '致吾心之良知于事事物物也。吾心之良知，即所谓天理也。\n白话：把自己心里的良知推展到万事万物上去。心内的良知就是天理，不必外求。\n——《传习录》卷中·答顾东桥书' },
                        { emoji: '🌱', title: '存天理，去人欲', subtitle: '只在此心去人欲、存天理上用功便是。\n白话：只要在自己心上做去掉私欲、存养天理的功夫就够了。\n——《传习录》卷上·陆澄录' },
                        { emoji: '🧘', title: '心外无物', subtitle: '你未看此花时，此花与汝心同归于寂；你来看此花时，则此花颜色一时明白起来，便知此花不在你的心外。\n白话：你没看花时，花和你的心都静寂；你来看花，花色便鲜活起来，这就知道花不在你心外。\n——《传习录》卷下·黄省曾录' },
                        { emoji: '⚡', title: '破山中贼易，破心中贼难', subtitle: '破山中贼易，破心中贼难。\n白话：打败山中的贼寇容易，战胜心里的私欲杂念才难。\n——《传习录》卷下·黄直录' },
                        { emoji: '🔍', title: '省察克治', subtitle: '省察克治之功，则无时而可间，如去盗贼，须有个扫除廓清之意。\n白话：反省自己的过错、克制私欲的功夫，一刻也不能停，就像扫除盗贼，必须彻底清除干净。\n——《传习录》卷上·陆澄录' },
                        { emoji: '😌', title: '事上磨练', subtitle: '人须在事上磨，方能立得住，方能静亦定、动亦定。\n白话：人必须经历具体事情的磨练，才能立得稳，无论安静还是行动时心都能安定。\n——《传习录》卷上·陆澄录' },
                        { emoji: '📏', title: '持志如心痛', subtitle: '持志如心痛，一心在痛上，岂有功夫说闲话、管闲事？\n白话：持守志向要像心口痛一样，全部心思都集中在痛上，哪还有闲工夫说闲话、管闲事？\n——《传习录》卷上·陆澄录' },
                        { emoji: '💧', title: '心犹镜也', subtitle: '圣人心如明镜，常人心如昏镜。却须痛加磨刮一番，方能照物。\n白话：心像镜子，圣人的心是明亮的镜子，普通人的心是昏浊的镜子，必须下功夫打磨，才能清楚照见事物。\n——《传习录》卷上·陆澄录' },
                        { emoji: '🔥', title: '知而不行，只是未知', subtitle: '知是行之始，行是知之成。若会得时，只说一个知，已自有行在；只说一个行，已自有知在。\n白话：知道了却不去做，等于还是不知道。真知道了，自然就会去做，知行不能分家。\n——《传习录》卷上·徐爱录' },
                        { emoji: '🧭', title: '志不立，天下无可成之事', subtitle: '志不立，如无舵之舟，无衔之马，漂荡奔逸，终亦何所底乎？\n白话：不立志向就像没有舵的船、没有嚼子的马，到处漂荡乱跑，终归没有着落。\n——《传习录》卷上·陆澄录' },
                        { emoji: '🏠', title: '格物是止至善之功', subtitle: '格者，正也，正其不正以归于正也。\n白话：格物就是纠正不合天理的地方，使它回归正轨。格物就是正心。\n——《传习录》卷上·徐爱录' },
                        { emoji: '📚', title: '读书不在徒事记诵', subtitle: '读书须入化境，方能深造自得。\n白话：读书不是为了死记硬背，而是要领会精神，达到融会贯通的境界才能真有收获。\n——《传习录》卷下·黄省曾录' },
                        { emoji: '🤲', title: '人皆可以为尧舜', subtitle: '各人尽着自己力量精神，只在此心纯天理上用功，即人人自有，个个圆成。\n白话：每个人都可以成为尧舜那样的圣人，只要在自己的心上纯粹用天理的功夫，人人都自有圆满的潜能。\n——《传习录》卷上·陆澄录' },
                        { emoji: '🌊', title: '心体本自宁静', subtitle: '心体便是天理，原自宁静。只被私欲隔断，便失其本体。\n白话：心的本体就是天理，原本就是宁静的。只是被私欲遮蔽，才失去了本来的状态。\n——《传习录》卷中·答陆原静书' },
                        { emoji: '🎯', title: '有着有恶是意之动', subtitle: '无善无恶心之体，有善有恶意之动，知善知恶是良知，为善去恶是格物。\n白话：心体本来无善无恶，意念发动才有善恶之分；良知能分辨善恶，格物就是做善去恶的功夫。\n——《传习录》卷下·黄省曾录' },
                        { emoji: '💪', title: '人须有为己之心，方能克己', subtitle: '能克己，方能成己。\n白话：人须有真正为自己好的心，才能克服私欲；能克制自己，才能真正成就自己。\n——《传习录》卷上·薛侃录' },
                        { emoji: '✋', title: '悔悟是去病之药', subtitle: '悔悟是去病之药，然以改之为贵。若留滞于中，则又因药发病。\n白话：悔悟是治病的良药，但贵在改正过失。如果一味后悔而不改，留在心里不走，又反而因药生出新病。\n——《传习录》卷上·薛侃录' },
                        { emoji: '🧹', title: '省察是有事时存养，存养是无事时省察', subtitle: '省察克治，必有事焉而勿正，心勿忘，勿助长。\n白话：遇到事情时反省内心就是存养，没事时涵养本心等于省察。不要刻意求效，既不忘也不揠苗助长。\n——《传习录》卷上·陆澄录' },
                        { emoji: '🌞', title: '虚灵不昧，众理具而万事出', subtitle: '心之本体无所不该，原是一个天。只为私欲障碍，则天之本体失了。\n白话：心的本体空灵不暗，万理具备，万事皆从此出。只因私欲阻挡，才失了天的本来面目。\n——《传习录》卷上·陆澄录' },
                        { emoji: '🧩', title: '不可专在册子上考究', subtitle: '人若真实切己用功不已，则于此心常见得精明。\n白话：读书不能只在书本上考究，如果真实在自己的身心上下不间断的功夫，心自然会越来越清明。\n——《传习录》卷下·黄修易录' },
                        { emoji: '🎓', title: '圣人气象不在圣人而在我矣', subtitle: '学者学圣人，不过是去人欲而存天理耳。\n白话：圣人的气象不在圣人身上，而在我自己心中。学圣人不过是去掉私欲存养天理罢了。\n——《传习录》卷上·陆澄录' },
                        { emoji: '🕊️', title: '克己须要扫除廓清，一毫不存方是', subtitle: '有一毫在，则众恶相引而来。\n白话：克制自己的私欲须彻底清除，一丝一毫不留才算是真功夫。如果还有一毫存在，各种恶念就会又引出来。\n——《传习录》卷上·陆澄录' },
                        { emoji: '💡', title: '致知在格物', subtitle: '所谓致知在格物者，致吾心之良知于事事物物也。\n白话：致知的功夫在于格物，就是把自己内心的良知推展到每一件事物上去。\n——《传习录》卷中·答顾东桥书' },
                        { emoji: '🍃', title: '饥来吃饭倦来眠', subtitle: '饥来吃饭倦来眠，只此修行玄更玄。说与世人浑不信，却从身外觅神仙。\n白话：饿了吃饭困了睡觉，这就是最奥妙的修行。说给世人听他们不信，反而去身外寻找神仙。\n——《传习录》卷下·黄省曾录' },
                        { emoji: '⚖️', title: '为学须有本原', subtitle: '须从本原上用力，渐渐盈科而进。\n白话：做学问要从根本上下功夫，像泉水盈满一个洼地再向前流，循序渐进。\n——《传习录》卷上·陆澄录' },
                        { emoji: '🔑', title: '知识愈广而人欲愈滋', subtitle: '记诵之广，适以长其傲；知识之多，适以行其恶。\n白话：单纯地多记多背只会增长傲气，知识丰富若没有德行驾驭，反而方便行恶。\n——《传习录》卷上·徐爱录' },
                        { emoji: '🛤️', title: '须从根本求生死', subtitle: '人于生死念头，本从生身命根上带来，故不易去。\n白话：对生死的执念是与生俱来的，不容易去除。但要在根本心性上用功，才能看破。\n——《传习录》卷下·黄省曾录' },
                        { emoji: '🌱', title: '初种根时，只管栽培灌溉', subtitle: '勿作枝想，勿作叶想，勿作花想，勿作实想。悬想何益？但不忘栽培之功，怕没有枝叶花实？\n白话：像种树一样，只管培土浇水，不要总想着枝、叶、花、果。空想有什么用？只管做栽培功夫，还怕没有果实吗？\n——《传习录》卷上·陆澄录' },
                        { emoji: '📐', title: '道无精粗，人之所见有精粗', subtitle: '如这一间房，人初进来只见一个大规模如此；处久便柱壁之类，一一看得明白。\n白话：道理本身没有精粗之分，人的见识却有深浅。像进一间屋子，初来只看大概，住久了连柱子墙壁都看分明。\n——《传习录》卷上·陆澄录' },
                        { emoji: '😔', title: '喜怒哀乐，本体自是中和的', subtitle: '才自家着些意思，便过不及，便是私。\n白话：喜怒哀乐本体是中和适度的，一旦加上自己的偏颇私意，就过度或不及，就是私欲。\n——《传习录》卷上·薛侃录' },
                        { emoji: '🌊', title: '此心不动如山', subtitle: '心之本体原自不动。心之本体即是性，性即是理。\n白话：心的本体原本像山一样不动。心体就是人的本性，本性就是天理。\n——《传习录》卷上·陆澄录' },
                        { emoji: '💬', title: '勿欺而犯', subtitle: '忠告而善道之，不可则止。\n白话：进忠告要善意引导，对方听不进就先停下来，不要自取其辱。\n——《传习录》卷下·黄直录' },
                        { emoji: '🧠', title: '心之虚灵明觉', subtitle: '心之虚灵明觉，即所谓本然之良知也。\n白话：心那空灵又明朗的觉知，就是人人本来就有的良知。\n——《传习录》卷中·答顾东桥书' },
                        { emoji: '🔄', title: '一念发动处，便即是行了', subtitle: '发动处有不善，就将这不善的念克倒了，须要彻根彻底，不使那一念不善潜伏在胸中。\n白话：一个念头一起就等于行动了，如果起的是恶念，就要彻底克掉它，不让它潜伏在心里。\n——《传习录》卷下·黄直录' },
                        { emoji: '🏋️', title: '变化气质', subtitle: '初学必须用力，久久自然纯熟，不须用力。\n白话：初学的人必须用功，日子久了自然熟练，就不再觉得费力了。\n——《传习录》卷下·黄修易录' },
                        { emoji: '🪞', title: '圣人之心如明镜', subtitle: '只是一个明，则随感而应，无物不照。\n白话：圣人的心像明亮的镜子，只是清澈透亮，则任何事物来都能清楚照出，随机应对。\n——《传习录》卷上·陆澄录' },
                        { emoji: '🍂', title: '万事万物之理，不外于吾心', subtitle: '心外无理，心外无事。\n白话：万事万物的道理都不在我心之外，心外没有理，也没有事。\n——《传习录》卷上·徐爱录' },
                        { emoji: '🎭', title: '人须在事上磨炼做功夫乃有益', subtitle: '若只好静，遇事便乱，终无长进。\n白话：人必须在具体事务中磨练才有益，如果只喜欢安静，一遇事就慌乱，终究没有长进。\n——《传习录》卷下·陈九川录' },
                        { emoji: '🌿', title: '无欲则静', subtitle: '无欲故静，有欲则动。\n白话：没有私欲心就安静，有了私欲心就骚动。\n——《传习录》卷上·陆澄录' },
                        { emoji: '💎', title: '良知即是易', subtitle: '良知即是道，良知妙用，无方无体。\n白话：良知就是变化之道，良知的妙用没有固定的方式，没有具体的形体。\n——《传习录》卷下·黄省曾录' },
                        { emoji: '👂', title: '凡朋友论学，须委曲谦下', subtitle: '若攻发太过，反成激怒。\n白话：和朋友讨论学问，应该委婉谦逊，如果攻击责难太过分，反而会激怒对方。\n——《传习录》卷下·黄修易录' },
                        { emoji: '🎓', title: '学问也要点化', subtitle: '但不如自家解化者，自一了百当。不然，亦点化许多不得。\n白话：学问也需要别人点化，但不如自己悟透，自己悟透就能一通百通。否则别人点化再多也没用。\n——《传习录》卷下·黄省曾录' },
                        { emoji: '🔍', title: '良知只是个是非之心', subtitle: '是非之心，不虑而知，不学而能，所谓良知也。\n白话：良知只是分辨是非的心，不用思考不用学习就知道，这就是良知。\n——《传习录》卷下·黄省曾录' },
                        { emoji: '🛡️', title: '天理人欲，其精微必时时省察克治', subtitle: '方日渐有见。\n白话：天理和人欲的精微差别，必须时时反省克制，一天天才会明见。\n——《传习录》卷上·陆澄录' },
                        { emoji: '🌻', title: '学是学去人欲，存天理', subtitle: '从事于去人欲存天理，则自正。\n白话：学问就是去掉私欲、存养天理，下这个功夫，心自然就正了。\n——《传习录》卷上·薛侃录' },
                        { emoji: '🗣️', title: '言语无序，亦足以见心之不存', subtitle: '心外无事，心外无理，故心不在焉，则言无序。\n白话：说话语无伦次，也可以看出心不在。心里不放着道理，话自然无序。\n——《传习录》卷上·陆澄录' },
                        { emoji: '🏖️', title: '澄心在澹泊', subtitle: '学要鞭辟近里着己，君子之道暗然而日章。\n白话：静心在于淡泊名利，做学问要贴近自己身心，像君子那样暗暗用功而日渐光辉。\n——《传习录》卷上·陆澄录' },
                        { emoji: '🧮', title: '知者行之始，行者知之成', subtitle: '圣学只一个功夫，知行不可分作两事。\n白话：知是行的开始，行是知的完成。圣人的学问只有一个功夫，知行不能分成两件事。\n——《传习录》卷上·徐爱录' },
                        { emoji: '⚡', title: '心正则中，身修则和', subtitle: '心正则中，身修则和。\n白话：心端正了，情就中正；涵养修身做好了，气就和顺。\n——《传习录》卷上·陆澄录' },
                        { emoji: '🎨', title: '此心常卓然公正', subtitle: '方是真实的学问。\n白话：这颗心时时能保持公正超然，才是真实学问的体现。\n——《传习录》卷下·黄直录' },
                        { emoji: '🌙', title: '无彻头彻尾的功夫', subtitle: '若以真切心去用功，则己私日消，天理日明。\n白话：没有一劳永逸的功夫，只有以真切的心不断用功，私欲才会一天天消退，天理才会一天天明现。\n——《传习录》卷下·黄修易录' },
                        { emoji: '✍️', title: '学须反己', subtitle: '若徒责人，只见得人不是，不见自己非。若能反己，方见自己有许多未尽处。\n白话：做学问必须反省自己，如果光责备别人，就只看得到别人的过错，看不到自己的毛病。能反求诸己，才知自己还有很多不足之处。\n——《传习录》卷下·黄修易录' }
                    ]
                },
                '论语': {
                    name: '论语',
                    description: '半部论语治天下 · 入世第一书',
                    icon: '📖',
                    cards: [
                        // ========== 学而篇第一 ==========
                        { emoji: '😊', title: '学而时习之', subtitle: '学而时习之，不亦说乎？有朋自远方来，不亦乐乎？人不知而不愠，不亦君子乎？\n白话：学了又时常温习实践，不也愉悦吗？有朋友从远方来，不也快乐吗？别人不了解我也不恼怒，不正是君子吗？\n——《论语·学而篇》' },
                        { emoji: '🌱', title: '孝弟为仁之本', subtitle: '孝弟也者，其为仁之本与！\n白话：孝顺父母、敬爱兄长，这就是仁道的根本。\n——《论语·学而篇》' },
                        { emoji: '🎨', title: '巧言令色鲜矣仁', subtitle: '巧言令色，鲜矣仁。\n白话：花言巧语、装出讨好的面孔，这种人是很少有仁德的。\n——《论语·学而篇》' },
                        { emoji: '🧘', title: '吾日三省吾身', subtitle: '为人谋而不忠乎？与朋友交而不信乎？传不习乎？\n白话：我每天多次反省自己：替人谋划有没有尽心？与朋友交往有没有诚信？老师教的有没有温习实践？\n——《论语·学而篇》' },
                        { emoji: '🌍', title: '敬事而信，节用爱人', subtitle: '道千乘之国，敬事而信，节用而爱人，使民以时。\n白话：治理大国要谨慎处事而守信，节省开支爱护百姓，征用民力要在农闲时节。\n——《论语·学而篇》' },
                        { emoji: '📚', title: '行有余力则以学文', subtitle: '弟子入则孝，出则弟，谨而信，泛爱众而亲仁。行有余力，则以学文。\n白话：少年在家孝顺，出外敬长，谨慎守信，博爱大众亲近仁者。这些都做到了还有余力，再来学习文献。\n——《论语·学而篇》' },
                        { emoji: '⚖️', title: '贤贤易色', subtitle: '事父母能竭其力，事君能致其身，与朋友交言而有信。\n白话：看重品德胜过外表，侍奉父母能尽孝，为国君能献身，与朋友相交守信用。\n——《论语·学而篇》' },
                        { emoji: '🧱', title: '过则勿惮改', subtitle: '君子不重则不威，学则不固。主忠信，无友不如己者。过则勿惮改。\n白话：君子不庄重就没有威严，学习就不会固陋。恪守忠信，不交不如自己的朋友。有了过错不要怕改正。\n——《论语·学而篇》' },
                        { emoji: '🕊️', title: '慎终追远', subtitle: '慎终追远，民德归厚矣。\n白话：慎重办理丧事追念先祖，民众的德行就会归于淳厚。\n——《论语·学而篇》' },
                        { emoji: '🤝', title: '礼之用，和为贵', subtitle: '礼之用，和为贵。先王之道，斯为美。\n白话：礼的运用，以和谐为贵。古代圣王治国之道，可贵之处就在这里。\n——《论语·学而篇》' },
                        { emoji: '💎', title: '君子食无求饱，居无求安', subtitle: '敏于事而慎于言，就有道而正焉，可谓好学也已。\n白话：君子饮食不求饱足，居住不求安逸，做事勤快说话谨慎，向有道的人看齐以匡正自己，这样可称好学了。\n——《论语·学而篇》' },
                        { emoji: '😌', title: '贫而无谄，富而无骄', subtitle: '未若贫而乐，富而好礼者也。\n白话：贫穷却不谄媚，富有却不骄横，但还不如贫穷而仍乐于道，富有而崇尚礼节。\n——《论语·学而篇》' },
                        { emoji: '🔍', title: '不患人之不己知，患不知人也', subtitle: '不患人之不己知，患不知人也。\n白话：不怕别人不了解自己，只怕自己不了解别人。\n——《论语·学而篇》' },
            
                        // ========== 为政篇第二 ==========
                        { emoji: '🌟', title: '为政以德，譬如北辰', subtitle: '为政以德，譬如北辰，居其所而众星共之。\n白话：用道德来治理国政，就像北极星，安居在自己的位置上，众星都环绕着它。\n——《论语·为政篇》' },
                        { emoji: '📖', title: '《诗》三百，一言以蔽之', subtitle: '曰：“思无邪。”\n白话：《诗经》三百篇，用一句话来概括，就是“思想纯正无邪念”。\n——《论语·为政篇》' },
                        { emoji: '🗺️', title: '道之以政，齐之以刑', subtitle: '民免而无耻；道之以德，齐之以礼，有耻且格。\n白话：用政令引导刑罚整治，百姓只求免罪没有羞耻；用道德教化和礼制规范，百姓有羞耻心而且人心归服。\n——《论语·为政篇》' },
                        { emoji: '🧭', title: '三十而立，四十不惑', subtitle: '吾十有五而志于学，三十而立，四十而不惑，五十而知天命，六十而耳顺，七十而从心所欲不逾矩。\n白话：十五岁立志求学，三十能立身处世，四十通达事理不再迷惑，五十知天命，六十听什么都能泰然，七十随心所欲不越规矩。\n——《论语·为政篇》' },
                        { emoji: '👨‍👩‍👦', title: '孝无违', subtitle: '生，事之以礼；死，葬之以礼，祭之以礼。\n白话：父母活着时按礼节侍奉，去世后按礼节安葬，按礼节祭奠，就是尽孝不违背。\n——《论语·为政篇》' },
                        { emoji: '❤️', title: '父母唯其疾之忧', subtitle: '孟武伯问孝。子曰：父母唯其疾之忧。\n白话：让父母只为自己的疾病担心（而不担心其他品行问题），这就是孝了。\n——《论语·为政篇》' },
                        { emoji: '🐶', title: '今之孝者谓能养', subtitle: '至于犬马，皆能有养；不敬，何以别乎？\n白话：现在人把养活父母当孝，家里狗马也能养，不存敬爱之心，养父母和养犬马有什么分别？\n——《论语·为政篇》' },
                        { emoji: '😊', title: '色难', subtitle: '有事弟子服其劳，有酒食先生馔，曾是以为孝乎？\n白话：对父母保持和颜悦色最难。有活年轻人抢着干，有酒肉长辈先吃，这难道就算孝吗？\n——《论语·为政篇》' },
                        { emoji: '🕰️', title: '温故而知新', subtitle: '温故而知新，可以为师矣。\n白话：重温旧知识并能从中获得新体会，这样的人就可以做老师了。\n——《论语·为政篇》' },
                        { emoji: '🔧', title: '君子不器', subtitle: '君子不器。\n白话：君子不能像器具那样只有单一用途，应博学多能，不拘于一技一艺。\n——《论语·为政篇》' },
                        { emoji: '🗣️', title: '先行其言而后从之', subtitle: '子贡问君子。子曰：先行其言而后从之。\n白话：先去实践自己要说的，做到之后再讲出来，这样才算君子。\n——《论语·为政篇》' },
                        { emoji: '🤝', title: '君子周而不比', subtitle: '小人比而不周。\n白话：君子团结众人而不结党营私，小人互相勾结搞小圈子。\n——《论语·为政篇》' },
                        { emoji: '🧠', title: '学而不思则罔，思而不学则殆', subtitle: '学而不思则罔，思而不学则殆。\n白话：只学习不思考就会迷惘无所得，只思考不学习就会陷入疲惫疑殆的危险。\n——《论语·为政篇》' },
                        { emoji: '⚖️', title: '攻乎异端，斯害也已', subtitle: '攻乎异端，斯害也已。\n白话：专门钻研极端偏颇的学说，这是有害的。\n——《论语·为政篇》' },
                        { emoji: '👁️', title: '知之为知之，不知为不知', subtitle: '知之为知之，不知为不知，是知也。\n白话：知道就是知道，不知道就是不知道，这才是真正的智慧。\n——《论语·为政篇》' },
                        { emoji: '👂', title: '多闻阙疑，慎言其余', subtitle: '多闻阙疑，慎言其余，则寡尤；多见阙殆，慎行其余，则寡悔。\n白话：多听有疑问的保留，谨慎讲其余的部分，就能减少错误；多看有疑惑的保留，谨慎做其余的事，就能减少后悔。\n——《论语·为政篇》' },
                        { emoji: '🏛️', title: '举直错诸枉', subtitle: '举直错诸枉，则民服；举枉错诸直，则民不服。\n白话：选拔正直的人安置在邪曲的人之上，百姓就信服；反之，百姓就不会信服。\n——《论语·为政篇》' },
                        { emoji: '🫂', title: '临之以庄则敬', subtitle: '孝慈则忠，举善而教不能则劝。\n白话：你对待百姓庄重他们就恭敬，你孝顺父母慈爱大众他们就忠心，你提拔好人教导能力弱的他们就会相互勉励。\n——《论语·为政篇》' },
                        { emoji: '📜', title: '人而无信，不知其可也', subtitle: '大车无輗，小车无軏，其何以行之哉？\n白话：人如果不讲信用，就像牛车马车没有连接横木的关键，怎么走得了呢？\n——《论语·为政篇》' },
                        { emoji: '🔮', title: '十世可知也', subtitle: '殷因于夏礼，所损益可知也；周因于殷礼，所损益可知也。\n白话：殷商继承夏代礼仪，增减之处可以推知；周朝继承殷商，增减也可知晓。继周而起的朝代，即使百代之后也可预知。\n——《论语·为政篇》' },
                        { emoji: '🙏', title: '非其鬼而祭之，谄也', subtitle: '见义不为，无勇也。\n白话：不该祭祀的鬼神却去祭拜，是谄媚；见到该挺身而出的正义之事不做，是没勇气。\n——《论语·为政篇》' },
            
                        // ========== 八佾篇第三 ==========
                        { emoji: '🏛️', title: '八佾舞于庭，是可忍孰不可忍', subtitle: '孔子谓季氏：八佾舞于庭，是可忍也，孰不可忍也？\n白话：季氏在家庙中用天子的八佾之舞，这样僭越的事都能忍，还有什么事不能忍？\n——《论语·八佾篇》' },
                        { emoji: '🎵', title: '人而不仁如礼何', subtitle: '人而不仁，如礼何？人而不仁，如乐何？\n白话：一个人没有仁爱之心，礼制对他有什么意义？音乐对他有什么意义？\n——《论语·八佾篇》' },
                        { emoji: '💭', title: '绘事后素', subtitle: '绘事后素。曰：礼后乎？\n白话：绘画要先有洁白底子再施色彩。礼也是后起于仁义本心之上的。\n——《论语·八佾篇》' },
                        { emoji: '🏺', title: '祭如在，祭神如神在', subtitle: '吾不与祭，如不祭。\n白话：祭祀祖先时，要像祖先真的在那里；祭祀神灵，也如神灵亲身在面前。如果我心不在场，等于没祭。\n——《论语·八佾篇》' },
                        { emoji: '🌐', title: '周监于二代，郁郁乎文哉', subtitle: '吾从周。\n白话：周朝的礼乐文化是借鉴夏商两代建立起来的，多么丰富华美啊！我遵从周代的文化。\n——《论语·八佾篇》' },
                        { emoji: '🏹', title: '射不主皮', subtitle: '射不主皮，为力不同科，古之道也。\n白话：射礼不以射穿皮靶为主，因为各人力量不同等，这是古来的规矩。\n——《论语·八佾篇》' },
                        { emoji: '🕊️', title: '尔爱其羊，我爱其礼', subtitle: '子贡欲去告朔之饩羊。子曰：赐也！尔爱其羊，我爱其礼。\n白话：子贡想省去祭庙的活羊。孔子说：你心疼那只羊，我心疼那个礼。\n——《论语·八佾篇》' },
                        { emoji: '🤲', title: '事君尽礼，人以为谄也', subtitle: '事君尽礼，人以为谄也。\n白话：对君王完全按应有的礼数来待奉，旁人反以为是在谄媚讨好。\n——《论语·八佾篇》' },
                        { emoji: '🌳', title: '成事不说，遂事不谏，既往不咎', subtitle: '成事不说，遂事不谏，既往不咎。\n白话：已经完成的事不要再解释，已经办成的事不要再进忠告，已经过去的错误不要再追究。\n——《论语·八佾篇》' },
                        { emoji: '🎶', title: '尽美矣，未尽善也', subtitle: '子谓《韶》：尽美矣，又尽善也。谓《武》：尽美矣，未尽善也。\n白话：孔子评舜的《韶》乐，尽善尽美；评武王的《武》乐，声容极美，但未达到尽善的境界。\n——《论语·八佾篇》' },
                        { emoji: '📏', title: '居上不宽，为礼不敬', subtitle: '临丧不哀，吾何以观之哉？\n白话：身居高位却不宽厚，行礼时候不恭敬，面对丧事不悲哀，这种人我怎么看得下去？\n——《论语·八佾篇》' },
            
                        // ========== 里仁篇第四 ==========
                        { emoji: '🏡', title: '里仁为美', subtitle: '里仁为美。择不处仁，焉得知？\n白话：居住在有仁德风气的地方才是好的。选择住处不挑仁厚之地，怎么能算明智呢？\n——《论语·里仁篇》' },
                        { emoji: '💪', title: '不仁者不可以久处约', subtitle: '不可以长处乐。\n白话：没有仁德的人不能长期处在困穷之中，也不能长久生活在安乐里。无仁心，穷会为非，乐会骄逸。\n——《论语·里仁篇》' },
                        { emoji: '✨', title: '唯仁者能好人，能恶人', subtitle: '唯仁者能好人，能恶人。\n白话：只有具备仁德的人，才能真正喜爱当爱的人，厌恶当厌恶的人。\n——《论语·里仁篇》' },
                        { emoji: '🎯', title: '苟志于仁矣，无恶也', subtitle: '苟志于仁矣，无恶也。\n白话：如果诚心立志求仁，就不会做出恶事。\n——《论语·里仁篇》' },
                        { emoji: '💰', title: '富与贵，是人之所欲也', subtitle: '不以其道得之，不处也。贫与贱，是人之所恶也，不以其道得之，不去也。\n白话：富贵人人想求，不以正道得到君子不接受；贫贱人人厌恶，不以正道摆脱君子宁可坚守。\n——《论语·里仁篇》' },
                        { emoji: '⚡', title: '君子无终食之间违仁', subtitle: '造次必于是，颠沛必于是。\n白话：君子一时一刻不会离开仁，仓促匆忙间是这样，颠沛流离时也是这样。\n——《论语·里仁篇》' },
                        { emoji: '👁️', title: '观过，斯知仁矣', subtitle: '人之过也，各于其党。观过，斯知仁矣。\n白话：什么样的过失与人的品行类别相关。看一个人犯什么类型的错，就知道他仁不仁了。\n——《论语·里仁篇》' },
                        { emoji: '🌅', title: '朝闻道，夕死可矣', subtitle: '朝闻道，夕死可矣。\n白话：早晨闻知人生大道，就算晚上死去也心甘了。\n——《论语·里仁篇》' },
                        { emoji: '🍚', title: '士志于道，而耻恶衣恶食', subtitle: '未足与议也。\n白话：一个人立志求道，却以穿得破吃得差为羞耻，这种人就不值得和他说什么了。\n——《论语·里仁篇》' },
                        { emoji: '⚖️', title: '君子之于天下也，无适也，无莫也', subtitle: '义之与比。\n白话：君子对于天下事，没有非要怎样、绝不怎样的固定模式，一切以道义为准则来衡量。\n——《论语·里仁篇》' },
                        { emoji: '💎', title: '君子怀德，小人怀土', subtitle: '君子怀刑，小人怀惠。\n白话：君子心里念念不忘的是道德和法度，小人念念不忘的是田产和利益。\n——《论语·里仁篇》' },
                        { emoji: '📏', title: '放于利而行，多怨', subtitle: '放于利而行，多怨。\n白话：一切照着利己的私心去行事，一定会招来很多的怨恨。\n——《论语·里仁篇》' },
                        { emoji: '🎭', title: '能以礼让为国乎？何有', subtitle: '不能以礼让为国，如礼何？\n白话：能用礼让的精神来治理国家，有什么难处呢？不能用礼让来治国，那些空壳礼文有什么用？\n——《论语·里仁篇》' },
                        { emoji: '🚶', title: '不患无位，患所以立', subtitle: '不患莫己知，求为可知也。\n白话：不担心没有地位，担心凭什么立足；不忧别人不知道自己，力求有值得被人知道的真本事。\n——《论语·里仁篇》' },
                        { emoji: '🧵', title: '吾道一以贯之', subtitle: '夫子之道，忠恕而已矣。\n白话：我的学说由一个基本思想贯穿始终，那就是忠和恕。\n——《论语·里仁篇》' },
                        { emoji: '🧭', title: '君子喻于义，小人喻于利', subtitle: '君子喻于义，小人喻于利。\n白话：君子懂的是道义，小人懂的是利益。\n——《论语·里仁篇》' },
                        { emoji: '🪞', title: '见贤思齐焉，见不贤而内自省也', subtitle: '见贤思齐焉，见不贤而内自省也。\n白话：看到贤人就想向他看齐，看到不贤的人就在心里反省自己有没有同样的毛病。\n——《论语·里仁篇》' },
                        { emoji: '👨‍👦', title: '事父母几谏', subtitle: '见志不从，又敬不违，劳而不怨。\n白话：侍奉父母，有不对的地方要委婉劝说，父母不听从仍恭敬顺从不忤逆，为父母操劳也无怨。\n——《论语·里仁篇》' },
                        { emoji: '🏠', title: '父母在，不远游', subtitle: '游必有方。\n白话：父母活着的时候不出远门，如果一定要去，必须有确定的去处让父母安心。\n——《论语·里仁篇》' },
                        { emoji: '⏳', title: '父母之年，不可不知也', subtitle: '一则以喜，一则以惧。\n白话：父母的年纪必须清楚记在心里，一方面为他们的高寿而欢喜，一方面又忧惧他们日渐衰老。\n——《论语·里仁篇》' },
                        { emoji: '🤐', title: '古者言之不出，耻躬之不逮也', subtitle: '古者言之不出，耻躬之不逮也。\n白话：古人不轻易把话说出去，因为怕自己做不到而引以为耻。\n——《论语·里仁篇》' },
                        { emoji: '⚓', title: '以约失之者鲜矣', subtitle: '以约失之者鲜矣。\n白话：因为约束克制自己而犯过失的事，是很少的。\n——《论语·里仁篇》' },
                        { emoji: '🧘', title: '君子欲讷于言而敏于行', subtitle: '君子欲讷于言而敏于行。\n白话：君子说话宁可笨拙迟钝一点，做事却要勤劳敏捷。\n——《论语·里仁篇》' },
                        { emoji: '🤝', title: '德不孤，必有邻', subtitle: '德不孤，必有邻。\n白话：有道德的人不会孤单，一定会有志同道合的人来和他做伴。\n——《论语·里仁篇》' },
                        { emoji: '📏', title: '事君数，斯辱矣', subtitle: '朋友数，斯疏矣。\n白话：侍奉君主太过频繁进谏就会自取其辱，朋友间交往过于频繁啰嗦反而会疏远。\n——《论语·里仁篇》' },
            
                        // ========== 公冶长篇第五 ==========
                        { emoji: '🏅', title: '虽在缧绁之中，非其罪也', subtitle: '子谓公冶长：可妻也，虽在缧绁之中，非其罪也。以其子妻之。\n白话：公冶长入过狱，但孔子说那并不是他的罪过，仍把女儿嫁给他。看人重本质不重外在境遇。\n——《论语·公冶长篇》' },
                        { emoji: '🏝️', title: '道不行，乘桴浮于海', subtitle: '子曰：道不行，乘桴浮于海，从我者其由与？\n白话：大道推行不开，不如坐木筏飘去海外，敢跟随我去的恐怕只有子路吧。\n——《论语·公冶长篇》' },
                        { emoji: '🧠', title: '听其言而观其行', subtitle: '始吾于人也，听其言而信其行；今吾于人也，听其言而观其行。\n白话：以前我听了人说的话就相信他的行为；现在我听了他的话还要看看他的行动是不是一致。\n——《论语·公冶长篇》' },
                        { emoji: '💧', title: '敏而好学，不耻下问', subtitle: '子贡问曰：孔文子何以谓之“文”也？子曰：敏而好学，不耻下问，是以谓之文也。\n白话：聪敏又喜欢学习，不以向地位低的人请教为羞耻，孔文子因此得到了“文”的谥号。\n——《论语·公冶长篇》' },
                        { emoji: '🌳', title: '三思而后行', subtitle: '季文子三思而后行。子闻之，曰：再，斯可矣。\n白话：季文子遇事想三次才行动。孔子说：想两次，就可以了。事贵果断，多思容易瞻前顾后反误事。\n——《论语·公冶长篇》' },
                        { emoji: '🦊', title: '巧言、令色、足恭', subtitle: '匿怨而友其人，左丘明耻之，丘亦耻之。\n白话：花言巧语、伪善脸色、过分恭顺，心里藏着怨恨表面却与人交友，左丘明引以为耻，我也引以为耻。\n——《论语·公冶长篇》' },
                        { emoji: '💭', title: '老者安之，朋友信之，少者怀之', subtitle: '子路曰：愿闻子之志。子曰：老者安之，朋友信之，少者怀之。\n白话：老者能安心度日，朋友彼此信任，少年能常受关怀，这就是孔子的志向。\n——《论语·公冶长篇》' },
            
                        // ========== 雍也篇第六 ==========
                        { emoji: '😇', title: '不迁怒，不贰过', subtitle: '有颜回者好学，不迁怒，不贰过。不幸短命死矣，今也则亡。\n白话：颜回很好学，能把怒气发泄在别处，同样的过错绝不犯第二次。可惜英年早逝，再没这样好学的了。\n——《论语·雍也篇》' },
                        { emoji: '🌾', title: '君子周急不继富', subtitle: '吾闻之也：君子周急不继富。\n白话：君子只救济急难穷困的人，而不会给富有的人再锦上添花。\n——《论语·雍也篇》' },
                        { emoji: '❤️', title: '贤哉回也', subtitle: '一箪食，一瓢饮，在陋巷，人不堪其忧，回也不改其乐。贤哉回也。\n白话：颜回用竹碗盛饭木瓢喝水，住破烂小屋，别人都受不了那种穷苦，颜回却仍自得其乐。多么贤德啊！\n——《论语·雍也篇》' },
                        { emoji: '⚖️', title: '文质彬彬，然后君子', subtitle: '质胜文则野，文胜质则史。文质彬彬，然后君子。\n白话：质朴多过文采就显得粗野，文采多于质朴就流于虚浮。文采和质朴配合恰当才称得上君子。\n——《论语·雍也篇》' },
                        { emoji: '🏃', title: '知之者不如好之者', subtitle: '好之者不如乐之者。\n白话：知道它的人不如喜好它的人，喜好它的人不如以它为乐的人。\n——《论语·雍也篇》' },
                        { emoji: '🧗', title: '中人以上，可以语上也', subtitle: '中人以上，可以语上也；中人以下，不可以语上也。\n白话：中等资质以上的人，可以同他讲高深道理；中等以下的人，就不可说太深奥的东西。\n——《论语·雍也篇》' },
                        { emoji: '🔑', title: '务民之义，敬鬼神而远之', subtitle: '可谓知矣。\n白话：专心为民大义所在，对鬼神心存敬意但保持适当距离，可算明智了。\n——《论语·雍也篇》' },
                        { emoji: '🤝', title: '己欲立而立人，己欲达而达人', subtitle: '夫仁者，己欲立而立人，己欲达而达人。能近取譬，可谓仁之方也已。\n白话：自己想站得住就帮别人站住，自己想通达就让别人先通达。能从近旁小事做起推此及彼，就是行仁之道。\n——《论语·雍也篇》' },
            
                        // ========== 述而篇第七 ==========
                        { emoji: '📜', title: '述而不作，信而好古', subtitle: '述而不作，信而好古，窃比于我老彭。\n白话：我只是传达传统典籍而不好创作，笃信并喜好古人的文化，私下以殷大夫老彭自比。\n——《论语·述而篇》' },
                        { emoji: '📖', title: '学而不厌，诲人不倦', subtitle: '学而不厌，诲人不倦，何有于我哉？\n白话：求学问永不满足，教导别人从不疲倦，除了这三点我还有什么呢？\n——《论语·述而篇》' },
                        { emoji: '😟', title: '德之不修，学之不讲', subtitle: '闻义不能徙，不善不能改，是吾忧也。\n白话：品德不去修养，学问不去讲求，听到义理不去奔赴，有缺点不能改正，这都是我心忧的事。\n——《论语·述而篇》' },
                        { emoji: '🕊️', title: '志于道，据于德，依于仁，游于艺', subtitle: '志于道，据于德，依于仁，游于艺。\n白话：立志向大道，据守于德行，不离开仁心，游憩于礼乐射御书数六艺之中。\n——《论语·述而篇》' },
                        { emoji: '🎓', title: '自行束脩以上，吾未尝无诲焉', subtitle: '自行束脩以上，吾未尝无诲焉。\n白话：只要自愿送上一束干肉作为最基本的薄礼，我从来没有不教诲的。\n——《论语·述而篇》' },
                        { emoji: '💡', title: '不愤不启，不悱不发', subtitle: '举一隅不以三隅反，则不复也。\n白话：不到想不通而愤闷时不启发，不到想说而说不出口时不点拨；教给他一隅他不能类推其余三个角的道理，就不重教这一条。\n——《论语·述而篇》' },
                        { emoji: '😢', title: '子食于有丧者之侧，未尝饱也', subtitle: '子食于有丧者之侧，未尝饱也。\n白话：孔子在有丧事的人旁边吃饭，从来没有吃饱过。悲悯之心发乎真情。\n——《论语·述而篇》' },
                        { emoji: '🎵', title: '子在齐闻《韶》，三月不知肉味', subtitle: '不图为乐之至于斯也。\n白话：孔子在齐国听了《韶》乐，三个月连肉味都尝不出来了，想不到音乐之美竟能达到这种程度。\n——《论语·述而篇》' },
                        { emoji: '🍚', title: '饭疏食饮水，曲肱而枕之', subtitle: '乐亦在其中矣。不义而富且贵，于我如浮云。\n白话：吃粗粮喝淡水，枕着自己弯起来的胳膊，快乐就在里面。不合道义得来的富贵，对我来说像浮云一样轻飘飘。\n——《论语·述而篇》' },
                        { emoji: '⏳', title: '发愤忘食，乐以忘忧', subtitle: '女奚不曰，其为人也，发愤忘食，乐以忘忧，不知老之将至云尔。\n白话：他的为人，用起功来连饭都忘了吃，快乐起来一切忧愁都丢掉，连自己快要老了都不觉得。\n——《论语·述而篇》' },
                        { emoji: '🧬', title: '我非生而知之者', subtitle: '好古，敏以求之者也。\n白话：我不是生下来就知道一切的人，只是爱好古代文化，靠着勤奋敬勉去求索罢了。\n——《论语·述而篇》' },
                        { emoji: '🤐', title: '子不语怪、力、乱、神', subtitle: '子不语怪、力、乱、神。\n白话：孔子从来不谈怪异、暴力、悖乱、鬼神这类话题。\n——《论语·述而篇》' },
                        { emoji: '🌿', title: '三人行，必有我师焉', subtitle: '择其善者而从之，其不善者而改之。\n白话：几个人一块走路，其中一定有可以做我老师的人。拣他们的好处学习，对照他们的坏处来改正自己。\n——《论语·述而篇》' },
                        { emoji: '🛡️', title: '天生德于予，桓魋其如予何', subtitle: '天生德于予，桓魋其如予何？\n白话：老天赋予我这样的品德，桓魋能把我怎样呢？正气在胸，生死无惧。\n——《论语·述而篇》' },
                        { emoji: '🧘', title: '君子坦荡荡，小人长戚戚', subtitle: '君子坦荡荡，小人长戚戚。\n白话：君子心胸宽广光明磊落，小人却老是忧戚不宁，心情总放不开。\n——《论语·述而篇》' },
                        { emoji: '🎋', title: '子温而厉，威而不猛，恭而安', subtitle: '子温而厉，威而不猛，恭而安。\n白话：孔子温和又严肃，威严却不凶暴，恭敬而又安详自在。\n——《论语·述而篇》' },
            
                        // ========== 泰伯篇第八 ==========
                        { emoji: '👑', title: '泰伯其可谓至德也已矣', subtitle: '三以天下让，民无得而称焉。\n白话：泰伯三次把天下让给弟弟季历，百姓简直找不出最贴切的词来称颂这样至高的德行。\n——《论语·泰伯篇》' },
                        { emoji: '😇', title: '恭而无礼则劳，慎而无礼则葸', subtitle: '勇而无礼则乱，直而无礼则绞。\n白话：恭敬而不合礼就会烦劳，谨慎失礼成畏缩，勇敢无礼会生乱，直率失礼成刻薄尖酸。礼是调和四德的准则。\n——《论语·泰伯篇》' },
                        { emoji: '🦅', title: '鸟之将死，其鸣也哀', subtitle: '人之将死，其言也善。\n白话：鸟快死时叫声凄凉，人快死时说的话往往充满善意。\n——《论语·泰伯篇》' },
                        { emoji: '🧭', title: '士不可以不弘毅，任重而道远', subtitle: '仁以为己任，不亦重乎？死而后已，不亦远乎？\n白话：志士不能不心胸宽广、意志坚强，因为责任重大路途遥远。以行仁为己任，到死才停下，确实重而远。\n——《论语·泰伯篇》' },
                        { emoji: '🎵', title: '兴于《诗》，立于礼，成于乐', subtitle: '兴于《诗》，立于礼，成于乐。\n白话：兴于由《诗经》感发志意，立身靠循礼行事，完成人格得从乐的熏陶中归宿。\n——《论语·泰伯篇》' },
                        { emoji: '🚫', title: '不在其位，不谋其政', subtitle: '不在其位，不谋其政。\n白话：不在那个职位，就不参与谋划它的政务。\n——《论语·泰伯篇》' },
                        { emoji: '✨', title: '学如不及，犹恐失之', subtitle: '学如不及，犹恐失之。\n白话：学习就像追赶什么生怕赶不上，赶上了又还担心会丢失。\n——《论语·泰伯篇》' },
                        { emoji: '🌊', title: '巍巍乎，舜禹之有天下也而不与焉', subtitle: '巍巍乎，舜禹之有天下也而不与焉。\n白话：多崇高伟大呀，舜和禹虽拥有天下，却一点都不为自己谋私。\n——《论语·泰伯篇》' },
            
                        // ========== 子罕篇第九 ==========
                        { emoji: '🤫', title: '子罕言利与命与仁', subtitle: '子罕言利与命与仁。\n白话：孔子很少主动谈有关利益、天命和仁德的话题。\n——《论语·子罕篇》' },
                        { emoji: '🧠', title: '子绝四：毋意，毋必，毋固，毋我', subtitle: '子绝四：毋意，毋必，毋固，毋我。\n白话：孔子完全没有四种毛病：不凭空猜测，不绝对肯定，不固执拘泥，不以自我为中心。\n——《论语·子罕篇》' },
                        { emoji: '⏳', title: '逝者如斯夫，不舍昼夜', subtitle: '子在川上曰：逝者如斯夫，不舍昼夜。\n白话：孔子在河边感叹说：消逝的时光就像这河水，日夜不停地向前流去。\n——《论语·子罕篇》' },
                        { emoji: '🏔️', title: '譬如为山，未成一篑', subtitle: '止，吾止也。譬如平地，虽覆一篑，进，吾往也。\n白话：堆山只差一筐土，停止全在自弃；平地刚倒一筐土，前进也由自己。功亏一篑和日进有功都在自己选择。\n——《论语·子罕篇》' },
                        { emoji: '💬', title: '语之而不惰者，其回也与', subtitle: '语之而不惰者，其回也与。\n白话：听我讲学而从不懈怠懒散的，大概只有颜回一个人吧。\n——《论语·子罕篇》' },
                        { emoji: '🌱', title: '苗而不秀者有矣夫，秀而不实者有矣夫', subtitle: '苗而不秀者有矣夫，秀而不实者有矣夫。\n白话：长了苗却未扬花的有，扬了花没结籽实的也有，求学也要常葆初心才能见效。\n——《论语·子罕篇》' },
                        { emoji: '🧑‍🦳', title: '后生可畏，焉知来者之不如今也', subtitle: '四十、五十而无闻焉，斯亦不足畏也已。\n白话：年轻人是可敬畏的，怎知将来不如今呢？但活到四五十仍默默无闻，那也就不值得敬畏了。\n——《论语·子罕篇》' },
                        { emoji: '💎', title: '三军可夺帅也，匹夫不可夺志也', subtitle: '三军可夺帅也，匹夫不可夺志也。\n白话：一国大军可以掳去它的主帅，一个普通人却不可能强迫他改变志向。\n——《论语·子罕篇》' },
                        { emoji: '❄️', title: '岁寒，然后知松柏之后凋也', subtitle: '岁寒，然后知松柏之后凋也。\n白话：天冷了才知道松柏是最后凋零的。人在严峻考验中才能见到真正的节操。\n——《论语·子罕篇》' },
                        { emoji: '🤝', title: '知者不惑，仁者不忧，勇者不惧', subtitle: '知者不惑，仁者不忧，勇者不惧。\n白话：真正有智慧的人心中不迷惑，仁德的人不忧愁，勇敢的人无所畏惧。\n——《论语·子罕篇》' },
            
                        // ========== 乡党篇第十 ==========
                        { emoji: '🏠', title: '孔子于乡党，恂恂如也', subtitle: '似不能言者。\n白话：孔子在家乡显得温和恭顺，好像不太会说话的样子。\n——《论语·乡党篇》' },
                        { emoji: '🍽️', title: '食不厌精，脍不厌细', subtitle: '食饐而餲，鱼馁而肉败不食。\n白话：粮食舂得越精越好，鱼肉切得越细越好。饭食馊了、鱼烂了、肉腐了，都不吃。\n——《论语·乡党篇》' },
                        { emoji: '🐎', title: '厩焚，子退朝', subtitle: '曰：伤人乎？不问马。\n白话：孔子的马棚失火烧了，退朝回来只问伤了人没有，并不先问马匹损失。\n——《论语·乡党篇》' },
            
                        // ========== 先进篇第十一 ==========
                        { emoji: '📚', title: '先进于礼乐，野人也', subtitle: '后进于礼乐，君子也。如用之，则吾从先进。\n白话：先学了礼乐然后当官的，是来自民间的素朴之人；先当了官再学礼乐的，是世族子弟。要用人才我挑前者。\n——《论语·先进篇》' },
                        { emoji: '😢', title: '子哭之恸', subtitle: '颜渊死，子哭之恸。从者曰：子恸矣！曰：有恸乎？非夫人之为恸而谁为？\n白话：颜渊死了，孔子哭得极为伤痛。弟子们说太悲伤了，孔子说：我不为他伤悲还为难伤心呢？\n——《论语·先进篇》' },
                        { emoji: '🛤️', title: '未知生，焉知死', subtitle: '季路问事鬼神。子曰：未能事人，焉能事鬼？曰：敢问死。曰：未知生，焉知死？\n白话：还没能正确待人，怎能懂得事奉鬼神？人生之道还不知道，何必急着去追索死后的世界。\n——《论语·先进篇》' },
            
                        // ========== 颜渊篇第十二 ==========
                        { emoji: '🕊️', title: '克己复礼为仁', subtitle: '一日克己复礼，天下归仁焉。为仁由己，而由人乎哉？\n白话：克制自己的私欲，使言行合于礼，就是仁。一旦做到这步，天下人都会称赞。仁的实践全在自己。\n——《论语·颜渊篇》' },
                        { emoji: '👁️', title: '非礼勿视，非礼勿听', subtitle: '非礼勿言，非礼勿动。\n白话：不合礼义的东西不看，不合礼义的言论不听、不说、不行动。\n——《论语·颜渊篇》' },
                        { emoji: '🤲', title: '己所不欲，勿施于人', subtitle: '己所不欲，勿施于人。在邦无怨，在家无怨。\n白话：自己不想遭受的事不要强加给别人。在国家服务无怨，在家里也无怨。\n——《论语·颜渊篇》' },
                        { emoji: '💎', title: '君子不忧不惧', subtitle: '内省不疚，夫何忧何惧？\n白话：反省自己内心毫无愧疚，那还有什么可忧愁和恐惧的呢？\n——《论语·颜渊篇》' },
                        { emoji: '🌾', title: '君君，臣臣，父父，子子', subtitle: '齐景公问政于孔子。孔子对曰：君君，臣臣，父父，子子。\n白话：国君像个国君，臣子像臣子，父亲像父亲，儿子像儿子，各尽其职。\n——《论语·颜渊篇》' },
                        { emoji: '⚖️', title: '听讼，吾犹人也', subtitle: '必也使无讼乎。\n白话：审理官司我和别人差不多。但要紧的是，想办法让再也没有诉讼发生才好。\n——《论语·颜渊篇》' },
                        { emoji: '📏', title: '君子成人之美，不成人之恶', subtitle: '小人反是。\n白话：君子促成别人的好事，不帮助别人干坏事。小人恰好相反。\n——《论语·颜渊篇》' },
                        { emoji: '🏛️', title: '政者正也', subtitle: '子帅以正，孰敢不正？\n白话：政治就是端正风气。您自己率先走正路，还有谁敢不走正路？\n——《论语·颜渊篇》' },
            
                        // ========== 子路篇第十三 ==========
                        { emoji: '🌱', title: '先之劳之', subtitle: '子路问政。子曰：先之劳之。请益。曰：无倦。\n白话：为政要率先给百姓做榜样，然后让大家勤勉劳作，再做也不要不懈怠厌倦。\n——《论语·子路篇》' },
                        { emoji: '📋', title: '名不正则言不顺', subtitle: '言不顺则事不成，事不成则礼乐不兴，礼乐不兴则刑罚不中，刑罚不中则民无所措手足。\n白话：名分不正言语就不顺当，说话不顺当事情就办不成，礼乐不兴刑罚就不恰当，百姓将手足无措。\n——《论语·子路篇》' },
                        { emoji: '🌾', title: '上好礼，则民莫敢不敬', subtitle: '上好义，则民莫敢不服；上好信，则民莫敢不用情。\n白话：君主崇尚礼，百姓没人敢不敬畏；君主讲求义，没人敢不服；君主恪守信，没人敢不以真情相待。\n——《论语·子路篇》' },
                        { emoji: '🤝', title: '君子和而不同，小人同而不和', subtitle: '君子和而不同，小人同而不和。\n白话：君子能与人和睦相处但保留独立意见，小人意见相同却只是表面附和、内心不和。\n——《论语·子路篇》' },
                        { emoji: '😊', title: '近者悦，远者来', subtitle: '叶公问政。子曰：近者悦，远者来。\n白话：让境内的人安居欢悦，远方的人就会慕名而来归服。\n——《论语·子路篇》' },
                        { emoji: '⏰', title: '欲速则不达', subtitle: '欲速则不达，见小利则大事不成。\n白话：只图快往往反而达不到目的，只顾眼前小利就做不成大事。\n——《论语·子路篇》' },
                        { emoji: '⚓', title: '刚、毅、木、讷近仁', subtitle: '刚、毅、木、讷近仁。\n白话：刚强、坚毅、质朴、言语慎重，这四种品格接近仁德的境界。\n——《论语·子路篇》' },
            
                        // ========== 宪问篇第十四 ==========
                        { emoji: '🏅', title: '君子耻其言而过其行', subtitle: '君子耻其言而过其行。\n白话：君子以说的比做的多为可耻。\n——《论语·宪问篇》' },
                        { emoji: '🧭', title: '不患人之不己知，患其不能也', subtitle: '不患人之不己知，患其不能也。\n白话：不怕别人不知道自己的名声，只怕自己没有真实的本事。\n——《论语·宪问篇》' },
                        { emoji: '⚖️', title: '以直报怨，以德报德', subtitle: '或曰：以德报怨，何如？子曰：何以报德？以直报怨，以德报德。\n白话：有人问用恩德来回报怨恨好不好？孔子说：那拿什么回报恩德呢？应该用正直来面对怨恨，用恩德来回报恩德。\n——《论语·宪问篇》' },
                        { emoji: '🦉', title: '古之学者为己，今之学者为人', subtitle: '古之学者为己，今之学者为人。\n白话：古人求学是为了修养自己的身心，现在的人求学是为了在别人面前炫耀。\n——《论语·宪问篇》' },
                        { emoji: '📢', title: '其言之不怍，则为之也难', subtitle: '其言之不怍，则为之也难。\n白话：一个人说起大话来一点也不惭愧，要真的实行起来可就难了。\n——《论语·宪问篇》' },
            
                        // ========== 卫灵公篇第十五 ==========
                        { emoji: '🍞', title: '君子固穷，小人穷斯滥矣', subtitle: '在陈绝粮，从者病，莫能兴。子路愠见曰：君子亦有穷乎？子曰：君子固穷，小人穷斯滥矣。\n白话：君子虽然穷但能坚守节操，小人一穷困就无所不为了。\n——《论语·卫灵公篇》' },
                        { emoji: '🔗', title: '言忠信，行笃敬', subtitle: '言忠信，行笃敬，虽蛮貊之邦行矣。\n白话：说话诚信忠实，行为敦厚恭敬，即使到了边疆蛮荒之地也能通得开。\n——《论语·卫灵公篇》' },
                        { emoji: '🤝', title: '己所不欲，勿施于人', subtitle: '子贡问曰：有一言而可以终身行之者乎？子曰：其恕乎！己所不欲，勿施于人。\n白话：有没有一个字可以终身奉行的呢？那就是“恕”，自己不愿接受的事，绝不要强加给别人。\n——《论语·卫灵公篇》' },
                        { emoji: '⚖️', title: '人能弘道，非道弘人', subtitle: '人能弘道，非道弘人。\n白话：人能发扬光大道，道不能自动把人变得伟大。\n——《论语·卫灵公篇》' },
                        { emoji: '🧠', title: '君子求诸己，小人求诸人', subtitle: '君子求诸己，小人求诸人。\n白话：君子凡事要求自己，小人凡事苛求别人。\n——《论语·卫灵公篇》' },
            
                        // ========== 季氏篇第十六 ==========
                        { emoji: '⚖️', title: '不患寡而患不均，不患贫而患不安', subtitle: '有国有家者，不患寡而患不均，不患贫而患不安。\n白话：不担心财富少，只担心分配不均匀；不担心人丁少，只担心上下不能相安。\n——《论语·季氏篇》' },
                        { emoji: '🤝', title: '益者三友，损者三友', subtitle: '友直，友谅，友多闻，益矣。友便辟，友善柔，友便佞，损矣。\n白话：有益的朋友三种：正直的、诚实的、见闻广博的；有害的朋友三种：谄媚逢迎的、表面恭顺的、花言巧语的。\n——《论语·季氏篇》' },
                        { emoji: '🎵', title: '益者三乐，损者三乐', subtitle: '乐节礼乐，乐道人之善，乐多贤友，益矣。乐骄乐，乐佚游，乐宴乐，损矣。\n白话：有益的快乐三种：调和的礼乐、扬人善处、交贤良友；有害的快乐三种：骄纵瞎乐、游荡嬉戏、大吃大喝。\n——《论语·季氏篇》' },
                        { emoji: '🧘', title: '君子有三戒', subtitle: '少之时，血气未定，戒之在色；及其壮也，血气方刚，戒之在斗；及其老也，血气既衰，戒之在得。\n白话：少年戒色，壮年戒争强斗狠，老年戒贪得无厌。\n——《论语·季氏篇》' },
            
                        // ========== 阳货篇第十七 ==========
                        { emoji: '🎭', title: '性相近也，习相远也', subtitle: '性相近也，习相远也。\n白话：人天性本是相近的，因为后天习染不同而差距越来越大。\n——《论语·阳货篇》' },
                        { emoji: '🥀', title: '饱食终日，无所用心', subtitle: '难矣哉！不有博弈者乎？为之，犹贤乎已。\n白话：整天吃饱了饭什么事不干，什么心不用，这种人难以长进！哪怕下下棋也比什么都不做要好。\n——《论语·阳货篇》' },
                        { emoji: '💬', title: '道听而涂说，德之弃也', subtitle: '道听而涂说，德之弃也。\n白话：路上听见就四处传播，是对品德的背弃。\n——《论语·阳货篇》' },
                        { emoji: '😡', title: '唯女子与小人为难养也', subtitle: '近之则不孙，远之则怨。\n白话：只有家里的婢仆和品行不端的人最难相处：亲近了会没大没小，疏远了又会抱怨。\n——《论语·阳货篇》' },
            
                        // ========== 微子篇第十八 ==========
                        { emoji: '🏃', title: '往者不可谏，来者犹可追', subtitle: '楚狂接舆歌而过孔子曰：往者不可谏，来者犹可追。已而已而！今之从政者殆而！\n白话：过去了的已经不可挽回，未来的还来得及追寻改正。算了吧，当下从政太危险了！\n——《论语·微子篇》' },
                        { emoji: '🌾', title: '四体不勤，五谷不分', subtitle: '子路从而后，遇丈人，以杖荷蓧。问曰：子见夫子乎？丈人曰：四体不勤，五谷不分，孰为夫子？\n白话：四肢不劳作，五谷都分不清，谁知道你的老师是什么人？不实践躬行，光有学问也是空的。\n——《论语·微子篇》' },
            
                        // ========== 子张篇第十九 ==========
                        { emoji: '⚱️', title: '士见危致命，见得思义', subtitle: '子张曰：士见危致命，见得思义，祭思敬，丧思哀，其可已矣。\n白话：读书人遇到危难能献出生命，见到利益考虑是否合义，祭祀时恭敬，居丧时哀戚，这样就可以了。\n——《论语·子张篇》' },
                        { emoji: '📚', title: '学而优则仕', subtitle: '子夏曰：仕而优则学，学而优则仕。\n白话：做官有富余的精力就该去学习，学习充足有余力便该去做官。\n——《论语·子张篇》' },
                        { emoji: '🌙', title: '君子之过也，如日月之食焉', subtitle: '过也，人皆见之；更也，人皆仰之。\n白话：君子的过错好比日食月食：犯错时人人都看得见，改正了大家仍怀着敬意仰望他。\n——《论语·子张篇》' },
            
                        // ========== 尧曰篇第二十 ==========
                        { emoji: '👑', title: '天之历数在尔躬', subtitle: '尧曰：咨！尔舜！天之历数在尔躬，允执其中。四海困穷，天禄永终。\n白话：上天的使命降在你身上了，你要诚实地持守中正之道。若天下百姓陷入穷困，上天给你的禄位就永远终止了。\n——《论语·尧曰篇》' },
                        { emoji: '⚖️', title: '尊五美，屏四恶', subtitle: '君子惠而不费，劳而不怨，欲而不贪，泰而不骄，威而不猛。\n白话：使民受惠而自己不费，役使百姓百姓不怨，有追求却不贪心，安泰自若却不骄纵，有威严却不凶猛。\n——《论语·尧曰篇》' },
                        { emoji: '🧭', title: '不知命，无以为君子也', subtitle: '不知礼，无以立也。不知言，无以知人也。\n白话：不懂得天命，就不能做君子；不知礼，不能立身处世；不懂得分辨言语的真伪，就不能了解人。\n——《论语·尧曰篇》' }
                    ]
                },
                '沉思录': {
                    name: '沉思录',
                    description: '帝王哲学 · 斯多葛智慧 · 内心安宁',
                    icon: '🏛️',
                    cards: [
                        { emoji: '🌅', title: '每日清晨提醒自己', subtitle: '今天我会遇见好管闲事、忘恩负义、傲慢无礼、欺诈嫉妒的人。但他们如此，是因为不辨善恶。而我已看清善的本质与恶的面目，因此不会被他们伤害或激怒。\n白话：每天提醒自己会碰到不友善的人，但他们错在不知善恶；我既然明白，就不必生气或被伤害。\n——《沉思录》卷二·1' },
                        { emoji: '🧠', title: '支配能力是神圣的', subtitle: '你的心灵是神明的一部分，它使你能够不受干扰地生活，只要你愿意。\n白话：人的理性源自神圣，只要愿意运用它，内心就能获得宁静，不受外界纷扰。\n——《沉思录》卷二·13' },
                        { emoji: '⏳', title: '记住你已经拖延够久了', subtitle: '你已拖延够久，现在是你领悟宇宙本质的时候了。你只能活一次，而生命正在流逝。\n白话：不要再拖了，生命有限，现在就该去理解人生的真谛，做真正重要的修行。\n——《沉思录》卷二·4' },
                        { emoji: '⚖️', title: '不要浪费时间争论好人该是怎样', subtitle: '去做一个好人。\n白话：与其空谈好人标准，不如直接去做一个好人。行动比言语重要得多。\n——《沉思录》卷十·16' },
                        { emoji: '🌊', title: '宇宙即变化，人生即看法', subtitle: '万事万物都在流动变化之中，你对事物的看法而非事物本身决定了你的平静。\n白话：一切都在变，真正影响我们的不是事情本身，而是我们对事情的看法。\n——《沉思录》卷四·3' },
                        { emoji: '🔥', title: '不要为外在事物烦恼', subtitle: '困扰人的不是事物本身，而是人对事物的判断。所以当你苦恼时，反省内心，看看是否可以修正你的想法。\n白话：让你难受的往往不是事情本身，而是你对它的看法。改变想法就能解脱。\n——《沉思录》卷八·47' },
                        { emoji: '🧘', title: '退入自己的内心', subtitle: '人们总想退隐到乡村、海边、山林，但你完全可以随时退入自己的内心。在内心深处，有着最安宁的庇护所。\n白话：真正的宁静不是换个地方，而是随时把心收回内在，那里就是最安稳的避难所。\n——《沉思录》卷四·3' },
                        { emoji: '☀️', title: '早晨起床时提醒自己', subtitle: '我起来是为了做人的工作，既然存在就是为了行动，为什么还要抱怨呢？难道我生来就为了赖在被窝里吗？\n白话：早起是为履行人的职责，活着的意义就是行动，别赖床抱怨，该做的事就要去做。\n——《沉思录》卷五·1' },
                        { emoji: '💎', title: '追求内在的品质', subtitle: '不要再随波逐流。你读过的书教会了你什么？避开浮躁，追求内心的宁静和简朴。\n白话：别被外界牵着走，从书中汲取智慧，过简单、安静、有内涵的生活。\n——《沉思录》卷二·2' },
                        { emoji: '🤝', title: '人们彼此是为了对方而存在的', subtitle: '人与人之间本应互相帮助，就像身体各部位互相配合。抱怨别人对你的冒犯，就等于忘了这个基本法则。\n白话：人生来就该互相帮助，像身体的器官协作一样。别人冒犯你时，想想这个道理，就不会太计较。\n——《沉思录》卷二·1' },
                        { emoji: '🛡️', title: '伤害你的是你自己的看法', subtitle: '去掉“我受了伤害”这个念头，伤害就消失了。\n白话：当你觉得受了伤害时，试着放下“受害”的想法，那伤害的感觉自然就消散了。\n——《沉思录》卷四·7' },
                        { emoji: '🌿', title: '顺应自然本性', subtitle: '凡事都要问自己：做这事是否必要？说这话是否必要？越是简省，越接近自然之道。\n白话：说话做事前先问自己有没有必要去做或说。减少不必要的言行，生活就更加自然平和。\n——《沉思录》卷四·24' },
                        { emoji: '⏰', title: '像最后一天那样生活', subtitle: '把每一天都当作生命的最后一天来度过，你就会感到平静而满足，不再沉溺于欲望与拖延。\n白话：把今天当作人生的最后一天，许多杂念就会消散，你会更专注、更认真、更坦然。\n——《沉思录》卷二·5' },
                        { emoji: '🪞', title: '看看自己的内心', subtitle: '无论发生什么，都要记住：我有能力承受它。没有什么能真正伤害我的内心，除非我自己允许。\n白话：遇到什么事都告诉自己，只要内心不被击垮，就没有什么能真正伤害你。\n——《沉思录》卷五·18' },
                        { emoji: '🌙', title: '夜晚反思一天的行为', subtitle: '今天我做了什么？是否被欲望支配？是否因愤怒失去理智？反省这些，是为了明天更接近善。\n白话：每晚花几分钟回顾今天的言行，看看哪里有私欲或怒火，以便明天变得更好。\n——《沉思录》卷五·1' },
                        { emoji: '⚡', title: '不要被别人的恶行拖下水', subtitle: '别人对你行不义，那是他的错。如果你的反应也同样不义，你也犯了错。\n白话：别人做坏事，错在他；你要是用同样的方式报复，你也错了。保持自己的正直。\n——《沉思录》卷九·4' },
                        { emoji: '🌲', title: '生命短暂，追求智慧吧', subtitle: '人生不过是昙花一现，何必把精力浪费在无谓的争执和欲望上？追求智慧与德行，才是正途。\n白话：人生很短，别耗在争吵和欲望里。专心追求智慧和德行，这才是正经事。\n——《沉思录》卷三·10' },
                        { emoji: '💡', title: '接受命运的安排', subtitle: '凡是与宇宙自然和谐的事，对我都是适宜的。任何事情，只要它在那时间发生，对我都有益处。\n白话：发生的所有事情都是宇宙安排的一部分，试着接受它，你会发现其中也藏着益处。\n——《沉思录》卷四·23' },
                        { emoji: '🏔️', title: '保持内心的堡垒', subtitle: '心灵的堡垒不可攻破。只要你不交出城门，任何外力都无法破坏你的内心平和。\n白话：你的内心是一座坚固的堡垒，只要你自己不放弃守护，外界的攻击就无法动摇它。\n——《沉思录》卷八·48' },
                        { emoji: '🙏', title: '对一切感恩', subtitle: '不要抱怨事情不如意，而要感恩一切发生的事。宇宙给予你的，总是适合你承受和成长的。\n白话：少抱怨，多感恩。发生的一切，都是你可以承受并从中获得成长的。\n——《沉思录》卷七·27' }
                    ]
                },
                '活出生命的意义': {
                    name: '活出生命的意义',
                    description: '意义疗法 · 苦难的价值 · 选择的态度',
                    icon: '💡',
                    cards: [
                        { emoji: '🕯️', title: '人可以被剥夺一切，除了一样东西', subtitle: '人最后的自由——在任何境遇中选择自己态度的自由，选择自己道路的自由。\n白话：哪怕一切都被夺走，你还有选择如何面对的自由。这是谁也无法夺去的。\n——《活出生命的意义》集中营经历' },
                        { emoji: '🧭', title: '知道“为什么”而活的人，几乎能忍受任何“如何”', subtitle: '这是尼采的名言，也是意义疗法的核心。只要找到活下去的理由，再大的苦也能扛过去。\n白话：只要你知道为什么活着，再艰难的处境你都能忍受。意义给人超越痛苦的力量。\n——《活出生命的意义》意义疗法' },
                        { emoji: '💪', title: '生命的意义是具体的', subtitle: '每个人的生命意义都不同，每天每时每刻都不一样。重要的不是泛泛的生命意义，而是某时某刻对某人的具体意义。\n白话：不用追问人生的大意义，而要问此刻此境下，我的使命和责任是什么。\n——《活出生命的意义》意义疗法' },
                        { emoji: '🎨', title: '发现生命意义的三种途径', subtitle: '一、通过创造或工作；二、通过体验某种事物或爱上某人；三、通过面对苦难时采取的态度。\n白话：找到意义有三种方式：做有意义的事、去爱、以及勇敢地承受苦难。\n——《活出生命的意义》意义疗法' },
                        { emoji: '❤️', title: '爱是理解一个人最深的途径', subtitle: '爱是直达另一个人内心深处的唯一途径。只有深爱一个人时，才能真正了解他的本质、他的潜能。\n白话：真正理解另一个人的唯一方式，就是爱他。爱能穿透表面，直抵内心深处。\n——《活出生命的意义》爱之意义' },
                        { emoji: '🗿', title: '苦难一旦找到意义就不再是苦难', subtitle: '在不可避免的苦难中发现意义，那么苦难就变成了一种成就。人可以带着尊严承受痛苦。\n白话：不是所有痛苦都能避免，但当你在痛苦中找到意义，它就变成了一种精神升华。\n——《活出生命的意义》苦难的意义' },
                        { emoji: '⏳', title: '生命不是从死亡那一刻才开始虚无', subtitle: '生命在每一刻都可以被充实。如果生前没有活出意义，死亡也不能赋予它意义。\n白话：别想着死后才得解脱，每一刻都有活出意义的机会。活好每个当下才是根本。\n——《活出生命的意义》对生命负责' },
                        { emoji: '🔮', title: '我们对生命发问，而生命向我们提出挑战', subtitle: '人不该问生命的意义是什么，而该认识到自己的生活每时每刻都在受到生命的追问。\n白话：别总追问人生有什么意义，反过来想想生命正在问你怎么担起责任。你的行动就是回答。\n——《活出生命的意义》意义疗法' },
                        { emoji: '🌧️', title: '未来可能发生的事，不等于剥夺你现在快乐的依据', subtitle: '集中营里，有人仍能仰望星空。为将来真正的苦难预先痛苦，是毫无意义的自我折磨。\n白话：不要为还没到来的痛苦现在就焦虑，再难的处境中，此刻也能找到一点美和希望。\n——《活出生命的意义》集中营心理观察' },
                        { emoji: '🔥', title: '要像是在经历第二次生命那样生活', subtitle: '而且前生犯过一次错，现在正在重蹈覆辙，这样的想像能使人高扬责任意识，过无悔的一生。\n白话：假想你已经活过一次，而这次是第二次机会。这种心态能让你更审慎、更负责地过好每一天。\n——《活出生命的意义》意义疗法' },
                        { emoji: '🌟', title: '每个人都是不可替代的', subtitle: '意识到自己无可替代，就会产生对生命强烈的责任感。没有人能代替你完成你的使命。\n白话：每个人在宇宙里都有独特的价值和使命，没人能替你完成。这让人活得有责任感。\n——《活出生命的意义》意义疗法' },
                        { emoji: '🧱', title: '集体罪疚并不存在', subtitle: '把一群人整体定罪，就是用偏见代替了思考。每个人都必须为自己的行为负责。\n白话：不能因为某个人群的共同标签，就把所有人都判有罪。每人只对自己的行为负责。\n——《活出生命的意义》后记' },
                        { emoji: '💬', title: '幽默是灵魂的武器', subtitle: '集中营里，我们编笑话、苦中作乐。幽默是困境中保护灵魂完整的一件有力武器。\n白话：在最黑暗的环境里，幽默也能让人保有一份心灵的独立和抵抗，使人不致崩溃。\n——《活出生命的意义》集中营经历' },
                        { emoji: '🎯', title: '有目标的紧张是健康的', subtitle: '人需要的不是毫无压力的状态，而是为一个值得的目标而奋斗和努力的那种健康的紧张。\n白话：人生不是越轻松越好。为自己认可的目标而紧张奋斗，这本身就是活出意义的一种状态。\n——《活出生命的意义》意义疗法' },
                        { emoji: '🌈', title: '悲剧三位一体', subtitle: '人生难免面对痛苦、内疚和死亡这三样。但正因如此，人们才更需要找到意义，在痛苦中变成英雄，在内疚中改进，在死亡中认识有限。\n白话：痛苦、内疚、死亡是人生常态。不能消灭它们，但能通过找到意义而升华，在有限里创造永恒。\n——《活出生命的意义》意义疗法' }
                    ]
                },
                '西西弗神话': {
                    name: '西西弗神话',
                    description: '荒谬哲学 · 反抗即意义 · 推石上山',
                    icon: '🪨',
                    cards: [
                        { emoji: '🪨', title: '真正严肃的哲学问题只有一个：自杀', subtitle: '判断人生是否值得活下去，这是哲学最根本的问题。其他一切形而上的争论，在这个问题面前都显得次要。\n白话：如果人生本质是荒诞无意义，那为什么还要活着？这是所有哲学问题中首先要回答的。\n——《西西弗神话·荒谬与自杀》' },
                        { emoji: '🏗️', title: '荒谬就诞生于人与世界的对峙', subtitle: '人呼唤意义，世界却报以沉默。荒谬不在于人或世界单独一方，而在于两者的碰撞。\n白话：人拼命找意义，世界却冷冰冰没有回应。这种需求和现实的错位，就是荒谬的根源。\n——《西西弗神话·荒谬的墙》' },
                        { emoji: '💡', title: '意识到荒谬，是清醒的开始', subtitle: '有一天，人忽然感到生活是重复、机械而乏味的，这质问“为什么”的瞬间，就是荒谬感的觉醒。\n白话：当你突然觉得每天重复的日子有点不对劲时，这就是觉醒的时刻。荒诞感是人清醒的标志。\n——《西西弗神话·荒谬的墙》' },
                        { emoji: '🌅', title: '活着，就是让荒谬活下去', subtitle: '关键在于不要试图消除荒谬，而是带着它继续生活。消灭荒谬等于消灭清醒，等于自欺欺人。\n白话：别指望能找到终极意义来消除荒谬，接受它，带着这份清醒继续活下去才是正解。\n——《西西弗神话·哲学上的自杀》' },
                        { emoji: '❤️', title: '唐璜是荒谬的人', subtitle: '唐璜不求永恒的爱情，只是把每一份爱都当作全部。他明白一切都会终结，所以此刻的激情就是全部意义。\n白话：不在乎爱情能不能永远，只把当下的每一份爱当最后一次去爱。这种全身心投入就是荒谬人的英雄主义。\n——《西西弗神话·荒谬的人》' },
                        { emoji: '🎭', title: '演员是荒谬的人', subtitle: '演员在几小时的舞台上活完一个完整的人生，明知角色终将落幕，却用全部的热情去燃烧每一个瞬间。\n白话：像演员一样，明知道会散场，仍然在短暂的舞台上淋漓尽致地活。不求永恒，但求此刻的淋漓尽致。\n——《西西弗神话·荒谬的人》' },
                        { emoji: '⚔️', title: '征服者是荒谬的人', subtitle: '征服者明知最终还是会被时间埋葬，但不相信永恒，只信仰眼前的行动。每一次战斗本身就是全部。\n白话：明知最后一场空，仍全力以赴。征服者不图未来，只看当前这一仗打得漂亮不漂亮。\n——《西西弗神话·荒谬的人》' },
                        { emoji: '✍️', title: '创作者是荒谬的人', subtitle: '创造者不期望作品永生，但创造的行为本身就是对虚无的反抗。他建造一座城，明知将被沙掩埋，却偏要建造。\n白话：写书、作画未必能留芳百世，但创造的过程就是意义。明知大厦将倾还在建，这就是反抗。\n——《西西弗神话·荒谬的创造》' },
                        { emoji: '⛰️', title: '我们须想象西西弗是幸福的', subtitle: '西西弗被罚永无止境地推石上山，巨石一到山顶就滚落，他重新下山再推。当他带着清醒与蔑视重新下山时，他就是幸福的。\n白话：日复一日重复无意义的苦役，只要心里明白且不屈服，那么即便推石头也是自由的、幸福的。\n——《西西弗神话·西西弗》' },
                        { emoji: '🕰️', title: '西西弗下山的那一刻最值得注视', subtitle: '巨石滚落，他必须重新下山再推。就在他转身下山的那一瞬间，他意识到自己的宿命，却仍然走下去——此刻他超越了他的命运。\n白话：推石的苦役不是最关键的，关键在于明知石头要滚下来，他还一步步往下走去重新开始。这种清醒就是超越。\n——《西西弗神话·西西弗》' },
                        { emoji: '🔥', title: '没有一种命运不能被蔑视所超越', subtitle: '当人对自己的苦难报以轻蔑的一笑时，他就已经赢了。不是赢了命运，而是赢了内心的屈服。\n白话：只要对苦命冷笑一声，就没有什么东西能真正压垮你的内心。轻蔑苦难本身，就是一种胜利。\n——《西西弗神话·西西弗》' },
                        { emoji: '💪', title: '反抗赋予生命价值', subtitle: '荒谬本身不提供意义，但人面对荒谬时的反抗、自由与激情，就构成了全部的生活意义。\n白话：活着本来就没什么预设的意义，但你怎样反抗这个没意义的状态——你付出的努力、自由和热情本身就是答案。\n——《西西弗神话·荒谬的自由》' },
                        { emoji: '⛓️', title: '重要的不是活得最好，而是活得最多', subtitle: '既然没有永恒的意义，那么一生中尽可能多地体验、感受、行动，就是最充实的人生。\n白话：这辈子不用比谁活得最成功，而要比谁体验了最多可能。量而非质，当然丰富比单调要好。\n——《西西弗神话·荒谬的人》' },
                        { emoji: '🎯', title: '荒谬的人只相信当下', subtitle: '他不寄望于未来，不迷信永恒，只认可眼前能抓住的东西。下一秒没用，现在这一刻用力去做了才重要。\n白话：荒谬的人不靠幻想未来过日子，他活着就靠此时此刻切切实实的感觉和行动。\n——《西西弗神话·荒谬的人》' },
                        { emoji: '🗿', title: '希望其实是最大的陷阱', subtitle: '总把意义寄托在明天，是一种变相的自我欺骗。活在希望里，等于把今天抵押出去，换取一个永远不会到来的结局。\n白话：一直觉得答案在未来，今天只好凑合过。这不就是画饼充饥吗？把当下活好，别把希望老往明天推。\n——《西西弗神话·荒谬的墙》' },
                        { emoji: '🦅', title: '没有明天，才是自由的开始', subtitle: '当人认清不会有更好的来世或永恒救赎，就会把全部精力注入此刻，从而迎来真正的自由。\n白话：不指望下辈子或明天会更好，人就只能拼命把今天过得有劲。这就是彻底解脱的开始。\n——《西西弗神话·荒谬的自由》' },
                        { emoji: '🌌', title: '活着是一种习惯', subtitle: '多数人并非因为觉得人生有意义才活着，而是因为习惯了活下去。直到某一天猛然发觉：“我为什么要这样日复一日？”\n白话：大多数人活下去往往凭惯性推着走，而不是当真觉得活着有多了不起的意义。偶尔停下来问一问，便是清醒的开端。\n——《西西弗神话·荒谬的墙》' },
                        { emoji: '🗡️', title: '自杀不是反抗，而是逃避', subtitle: '真正的反抗不是结束生命，而是一边清醒地知道没有希望，一边仍然热情地投入生活。\n白话：因为觉得没意思就去死，这不算反抗。真正的反抗是明明知道没有答案还要继续热烈地活下去。\n——《西西弗神话·荒谬与自杀》' },
                        { emoji: '🫂', title: '荒谬是人与世界唯一的纽带', subtitle: '它不可消除，也不该消除。一旦放弃寻求绝对意义，人就能回到大地，在与荒谬共处中获得全部当下。\n白话：别想除掉荒诞感了，它就是你跟现实世界之间最诚实的一条纽带。承认它，反而能踏实活在当下。\n——《西西弗神话·荒谬与自杀》' }
                    ]
                },
                '查拉图斯特拉如是说': {
                    name: '查拉图斯特拉如是说',
                    description: '上帝已死 · 超人哲学 · 永恒轮回',
                    icon: '⚡',
                    cards: [
                        { emoji: '🌅', title: '上帝已死', subtitle: '上帝死了！是人类杀死了他。现在最伟大的事情莫过于此，这件事对于人类来说，将永远是把最神圣、最强大的东西流血的恐怖。\n白话：人类杀死了绝对信仰，从此必须面对一个没有外在根据的世界，也正因此，人类才有机会成为真正自由、为自己创造价值的存在。\n——《查拉图斯特拉如是说》序言·2' },
                        { emoji: '🦅', title: '人是桥梁，不是目的', subtitle: '人之伟大，在于他是桥梁，而不是目的。人之可爱，在于他是过渡，也是坠落。\n白话：人不是为了成为什么固定终极的样子，而是不断超越自己、向更高方向迈进的过程。人的高贵正在于这种过渡和超越。\n——《查拉图斯特拉如是说》序言·4' },
                        { emoji: '⚡', title: '我教你们超人', subtitle: '超人就是大地的意义。让你们的意志说：超人必定是大地的意义！不要相信那些对你们谈论超尘世希望的人。\n白话：别把希望寄托在来世和天堂，要忠于大地、忠于肉体。超人是你们在大地上能创造出的最高存在。\n——《查拉图斯特拉如是说》序言·3' },
                        { emoji: '🐪', title: '精神的三段变形', subtitle: '精神怎样变成骆驼，骆驼怎样变成狮子，狮子又怎样终成赤子。\n白话：人先像骆驼一样负重服从传统，然后像狮子一样反抗争取自由，最终回归赤子般的天真与创造力，开启全新的自我。\n——《查拉图斯特拉如是说》卷一·论三种变形' },
                        { emoji: '🦁', title: '狮子反抗“你应当”', subtitle: '狮子说“我要”，它反抗那名为“你应当”的巨龙。\n白话：骆驼阶段背负了太多“你应该怎样”，狮子阶段敢于反抗所有外界强加的道德、律令，夺回自我决定的权利。\n——《查拉图斯特拉如是说》卷一·论三种变形' },
                        { emoji: '👶', title: '赤子是新的开始', subtitle: '赤子是纯洁，是遗忘，是一个新的开始，一个游戏，一个自转的轮子，一个最初的运动，一个神圣的肯定。\n白话：通过反抗旧价值后，人需要回归到孩童般纯粹的状态，这样才能从零创造属于自己的价值，而不是停留在反对一切里。\n——《查拉图斯特拉如是说》卷一·论三种变形' },
                        { emoji: '🏔️', title: '热爱命运', subtitle: '我的公式是：热爱命运。不求任何东西有所不同，不向前求，不向后求，不求永恒。不但要忍受必然，还要热爱它。\n白话：对自己的命运不只是被动接受，而是要主动爱它——好的坏的全都拥抱，这就是最高的人生态度。\n——《查拉图斯特拉如是说》卷二·论救赎' },
                        { emoji: '💃', title: '身体是大理性', subtitle: '身体是一种大理性，一种具有单一意义的多元体，一种战争与和平，一群牧者和一匹牧羊。\n白话：别看不起肉体，身体本身就拥有强大的智慧。你的感情、冲动、本能都值得被倾听，而不是一味压抑。\n——《查拉图斯特拉如是说》卷一·论身体的蔑视者' },
                        { emoji: '🐍', title: '永恒轮回', subtitle: '这人生，如你现在所过的、曾经度过的，你将必须再经历一次、乃至无数次。其中不会有什么新意，一切苦和乐都将以同样顺序回来。\n白话：如果你的人生必须一模一样地重复无数次，你能心甘情愿地说“是”吗？这是检验你到底有没有真正爱你的生活的最重试金石。\n——《查拉图斯特拉如是说》卷三·论幻象与谜' },
                        { emoji: '🌙', title: '午夜钟声', subtitle: '这是午夜，我要说许多话。人啊！注意听！深沉的午夜在说什么？我睡了，我睡了——我从深沉的梦中醒来！世界是深沉的，比白天想到的更深。\n白话：在灵魂最安静沉到底的午夜时分，人才能听见那些被白天喧嚣掩盖的、关于生命深处的真相。\n——《查拉图斯特拉如是说》卷四·醉歌' },
                        { emoji: '🏛️', title: '国家是冷酷的怪物', subtitle: '国家是各民族身上最冷酷的怪物。它也冷酷地说谎，而这话从它嘴里爬出来：“朕即人民。”\n白话：国家常常假借“人民”的名义说谎，实质上是一个吞噬个体自由和责任的冰冷机器。别把一切交给国家。\n——《查拉图斯特拉如是说》卷一·论新偶像' },
                        { emoji: '💍', title: '婚姻应是一场伟大的长谈', subtitle: '婚姻：我这样称呼那种意志，即两个人要创造胜于他们自己的东西。婚姻就是互相尊重，尊重这个意志。\n白话：好的婚姻不是互相占有或搭伙过日子，而是两个人一同追求更高远的目标，彼此鼓励创造更有意义的生命。\n——《查拉图斯特拉如是说》卷一·论孩子与婚姻' },
                        { emoji: '⚖️', title: '不要用报复来对付敌人', subtitle: '如果你的敌人对你做了恶，你也对他做了一点善事，你们究竟谁更快乐？\n白话：与其用仇恨报复来拉低自己，不如保持你的高贵。善意的行动不会削弱你的力量，反而让你更高出对手一筹。\n——《查拉图斯特拉如是说》卷一·论毒蛇的咬' },
                        { emoji: '🌲', title: '山上的树', subtitle: '它越是往高处伸展，扎根就越深，伸向黑暗与大地的深处——也就是伸向恶中去。\n白话：人想达到精神高度，就不能否定内心深处那些阴暗面和欲望，真正的成长是根扎进最深的土壤，向着恶也向善延伸。\n——《查拉图斯特拉如是说》卷一·论山上之树' },
                        { emoji: '🎭', title: '市场和苍蝇', subtitle: '市场上充满了喋喋不休的小丑，而你不再关注自己的灵魂。离开市场吧，你的孤独将保护你免受小苍蝇的嗡鸣烦扰。\n白话：众人喧闹的世俗场所，会让你被无数细小的杂音分心。要保护自己的内心完整性，就得敢于离开喧嚣。\n——《查拉图斯特拉如是说》卷一·论市场之蝇' },
                        { emoji: '🤝', title: '朋友是走向超人的同伴', subtitle: '朋友应当是与你共同越过桥梁的同伴，而不是用来垫脚的踏石。\n白话：真正的朋友不是被你利用的工具，而是朝着共同方向一起超越自我、走向更高处的旅伴。\n——《查拉图斯特拉如是说》卷一·论朋友' },
                        { emoji: '🛤️', title: '走你自己的路', subtitle: '“这是我的路，你的路在哪里？”对于所谓“那条唯一的路”，我的回答是：那根本不存在。\n白话：没有一条适合所有人的标准道路。你的使命是找到并勇敢走上只属于你自己的人生道路。\n——《查拉图斯特拉如是说》卷三·论旧与新的法版' },
                        { emoji: '👤', title: '你必须成为你自己', subtitle: '你现在还是孤独的，但总有一天你会成为你自己的同伴。尚未圆满的人，也将有一天成为充实而圆满的。\n白话：在成为完整的自己之前有一段孤独的探索期都不算坏事，最终你会到达能和自己好好相处的充实阶段。\n——《查拉图斯特拉如是说》卷一·论邻人' },
                        { emoji: '⛓️', title: '创造者必须打破旧法版', subtitle: '谁要创造善恶的新标准，就必须先做破坏者，把旧价值砸碎。\n白话：想建立新的道德与价值，就不能缩手缩脚地维护旧规矩。先勇敢打破腐朽的传统，才有新秩序的立足之地。\n——《查拉图斯特拉如是说》卷三·论旧与新的法版' },
                        { emoji: '💧', title: '灵魂需要最高的战斗', subtitle: '人身上最伟大的就是他有选择战斗的力量。最高的目标值得你为之付出生命。\n白话：一生中一定要有一个值得你拼命的崇高目标。伟大的灵魂总在为它而战斗，至死方休。\n——《查拉图斯特如是说》卷二·论战胜自我' },
                        { emoji: '🎵', title: '一切快乐都渴望永恒', subtitle: '一切快乐都想要事物持久，想要深深的、深深的水恒！\n白话：当你体验到真正的快乐时，会希望这一刻凝固到永远。这种渴望就是生命对自身最深的肯定。\n——《查拉图斯特拉如是说》卷四·醉歌' },
                        { emoji: '🕰️', title: '人类历史是不断的循环', subtitle: '永恒轮回不是教人消极，而是最大的肯定：你得让你的生命这样好，好到足以愿意无数次重来。\n白话：用每分每秒都值得重新活一次的态度去面对当下，别把希望推给以后。如果说永恒轮回很沉重，那是因为你的此刻不够认真对待。\n——《查拉图斯特拉如是说》卷三·康复者' },
                        { emoji: '🐮', title: '不要变成末人', subtitle: '末人发明了幸福，眨着眼说：“我们发明了幸福。”他们什么都有一点，但没有伟大的渴望和力量了。\n白话：现代社会容易滋生平庸的“末人”，他们安逸、琐碎、追求小确幸但失去崇高和超越的可能。警惕成为这种人。\n——《查拉图斯特拉如是说》序言·5' },
                        { emoji: '🧊', title: '保持冷酷是必要的', subtitle: '创造者都必须是冷酷的。你能忍受你自己的火焰灼烧你吗？你能让自己的冰块助你成形而毫不退缩吗？\n白话：对自己严厉，对妨碍你的环境冷酷，才能锻造出想要到达的新高度。自燃般的激情和冰山般的冷静都要具备。\n——《查拉图斯特拉如是说》卷二·论同情者' },
                        { emoji: '⚒️', title: '用你的锤子叩问', subtitle: '对着这时代，我用我的锤子叩问所有他们供奉的偶像，直到它们发出空洞的回声。\n白话：对一切被当世崇拜的价值，不要盲从，要用独立思考不断敲击它，看看它到底有没有坚实的内核，还是空洞作响的废壳。\n——《查拉图斯特拉如是说》偶像的黄昏·锤子之言' }
                    ]
                },
                '庄子': {
                    name: '庄子',
                    description: '逍遥游于无穷 · 齐物我于大化',
                    icon: '🦋',
                    cards: [
                        // ===== 内篇·逍遥游 =====
                        { emoji: '🦅', title: '北冥有鱼，其名为鲲', subtitle: '鲲之大，不知其几千里也。化而为鸟，其名为鹏。\n白话：北海有大鱼叫鲲，大到不知几千里，化为大鹏鸟。人生格局须大，心胸开阔方能成就大业。\n——《庄子·内篇·逍遥游》' },
                        { emoji: '🌊', title: '鹏之徙于南冥也，水击三千里', subtitle: '抟扶摇而上者九万里。\n白话：大鹏飞往南海，靠的是积蓄深厚的水势和旋风。蓄势越深，才能飞得越高。\n——《庄子·内篇·逍遥游》' },
                        { emoji: '🦗', title: '蜩与学鸠笑之', subtitle: '我决起而飞，抢榆枋而止，时则不至，而控于地而已矣，奚以之九万里而南为？\n白话：蝉和斑鸠嘲笑大鹏费力南飞，自己飞到树上就满足了。小聪明不懂大智慧，眼界决定了命运的高度。\n——《庄子·内篇·逍遥游》' },
                        { emoji: '🌳', title: '小知不及大知，小年不及大年', subtitle: '朝菌不知晦朔，蟪蛄不知春秋。\n白话：小智慧不懂大智慧，短命的不懂长寿的。朝生暮死的菌类不知月圆月缺，夏虫不能理解冬天雪景。\n——《庄子·内篇·逍遥游》' },
                        { emoji: '☁️', title: '乘天地之正，御六气之辩', subtitle: '以游无穷者，彼且恶乎待哉？\n白话：顺应自然本性，驾驭阴阳风雨晦明的变化，遨游于无穷境界，还需要依赖什么？真正的自由是不依赖外物。\n——《庄子·内篇·逍遥游》' },
                        { emoji: '👤', title: '至人无己，神人无功，圣人无名', subtitle: '至人无己，神人无功，圣人无名。\n白话：得道的人忘掉自我，神人不求功绩，圣人不贪虚名。放下执念，才能逍遥自在。\n——《庄子·内篇·逍遥游》' },
                        { emoji: '🥜', title: '鹪鹩巢于深林，不过一枝', subtitle: '偃鼠饮河，不过满腹。\n白话：小鸟筑巢只需一根树枝，田鼠喝水最多一肚子饱。人所需其实很少，贪求太多反而累赘。\n——《庄子·内篇·逍遥游》' },
            
                        // ===== 内篇·齐物论 =====
                        { emoji: '🌬️', title: '大块噫气，其名为风', subtitle: '是唯无作，作则万窍怒呺。\n白话：大地吐出的气叫风，一旦发作万种孔窍都会嚎叫。自然之力大无可当，万物各有不同的响应。\n——《庄子·内篇·齐物论》' },
                        { emoji: '🦋', title: '庄周梦蝶', subtitle: '不知周之梦为蝴蝶与，蝴蝶之梦为周与？\n白话：不知是庄周梦里变成了蝴蝶，还是蝴蝶梦里变成了庄周。人生如梦，物我本无绝对界限。\n——《庄子·内篇·齐物论》' },
                        { emoji: '⚖️', title: '彼亦一是非，此亦一是非', subtitle: '是亦彼也，彼亦是也。\n白话：彼此各有是非标准，你认为对的对方未必认可。是非都是相对的，何必执著己见争输赢。\n——《庄子·内篇·齐物论》' },
                        { emoji: '🐵', title: '朝三暮四', subtitle: '狙公赋芧，曰：“朝三而暮四。”众狙皆怒。曰：“然则朝四而暮三。”众狙皆悦。\n白话：养猴人早上给三个橡子晚上四个，猴子大怒；改成早上四个晚上三个，猴子都高兴。名实未变，喜怒不同。\n——《庄子·内篇·齐物论》' },
                        { emoji: '😶', title: '大辩不言', subtitle: '大仁不仁，大廉不嗛，大勇不忮。\n白话：真正的大辩才反而不多话，大仁看似不仁，大廉不露锋芒，大勇不逞强。真正的大境界不张扬。\n——《庄子·内篇·齐物论》' },
                        { emoji: '🕊️', title: '天地与我并生，万物与我为一', subtitle: '天地与我并生，而万物与我为一。\n白话：天地和我同时存在于宇宙间，万物与我在本质上同一。这是天人合一的至高境界。\n——《庄子·内篇·齐物论》' },
            
                        // ===== 内篇·养生主 =====
                        { emoji: '✨', title: '庖丁解牛', subtitle: '彼节者有间，而刀刃者无厚；以无厚入有间，恢恢乎其于游刃必有余地矣。\n白话：牛的骨节有缝隙，刀刃薄，用薄刃入骨缝自然游刃有余。顺其自然行事，则处处通达。\n——《庄子·内篇·养生主》' },
                        { emoji: '🐔', title: '泽雉十步一啄，百步一饮', subtitle: '不蕲畜乎樊中。神虽王，不善也。\n白话：水泽里的野鸡走十步啄一口食，走百步喝一口水，也不愿被关在笼子里。精神虽被供养得旺盛，却并不自在。\n——《庄子·内篇·养生主》' },
                        { emoji: '🔥', title: '指穷于为薪，火传也', subtitle: '指穷于为薪，火传也，不知其尽也。\n白话：油脂在柴上燃烧终会烧尽，但火种却可以传下去不会熄灭。形体会消亡，精神可永存。\n——《庄子·内篇·养生主》' },
            
                        // ===== 内篇·人间世 =====
                        { emoji: '❤️', title: '心斋', subtitle: '若一志，无听之以耳而听之以心，无听之以心而听之以气。\n白话：排除杂念用心专一，不用耳听用静心感应，不用心察用空明之气去顺合，这便是“心斋”。\n——《庄子·内篇·人间世》' },
                        { emoji: '🦗', title: '螳臂当车', subtitle: '汝不知夫螳螂乎？怒其臂以当车辙，不知其不胜任也。\n白话：螳螂发怒举起前臂阻挡车轮，不知自己力不能及。不自量力而妄为，必定危险。\n——《庄子·内篇·人间世》' },
                        { emoji: '🌲', title: '栎社树之无用之用', subtitle: '是不材之木也，无所可用，故能若是之寿。\n白话：这棵大栎树正因为做什么都不成材，才得以不被砍伐而长成巨树。无用之用，方为大用。\n——《庄子·内篇·人间世》' },
            
                        // ===== 内篇·德充符 =====
                        { emoji: '🍃', title: '德有所长，而形有所忘', subtitle: '人不忘其所忘，而忘其所不忘，此谓诚忘。\n白话：德行充实的人，别人就会忽略他外形的缺憾。真正的忘记是非不该忘的道义。\n——《庄子·内篇·德充符》' },
            
                        // ===== 内篇·大宗师 =====
                        { emoji: '🌊', title: '相濡以沫，不如相忘于江湖', subtitle: '泉涸，鱼相与处于陆，相呴以湿，相濡以沫，不如相忘于江湖。\n白话：泉水干了，鱼在陆上互相用口水润湿，困苦相拥不如畅游江河互不相识，自由才是最好的状态。\n——《庄子·内篇·大宗师》' },
                        { emoji: '🧘', title: '堕肢体，黜聪明，离形去知', subtitle: '同于大通，此谓坐忘。\n白话：忘掉自己的身体，抛开聪明智巧，脱离形骸去掉知识，与大道融为一体，这就是坐忘。\n——《庄子·内篇·大宗师》' },
            
                        // ===== 内篇·应帝王 =====
                        { emoji: '👑', title: '游心于淡，合气于漠', subtitle: '顺物自然而无容私焉，而天下治矣。\n白话：心游于恬淡，气和于静漠，顺着万物自然本性去做不夹杂私念，天下自然能治理好。\n——《庄子·内篇·应帝王》' },
                        { emoji: '🔨', title: '浑沌开七窍', subtitle: '日凿一窍，七日而浑沌死。\n白话：北海南海之帝为混沌开凿七窍，一天凿一窍，七天后混沌死了。违反自然刻意有为只会毁掉本真。\n——《庄子·内篇·应帝王》' },
            
                        // ===== 外篇·骈拇 =====
                        { emoji: '🦆', title: '凫胫虽短，续之则忧', subtitle: '鹤胫虽长，断之则悲。故性长非所断，性短非所续。\n白话：野鸭腿短，接上一段就成忧患；白鹤腿长，截去一段便很可悲。天性如此，不可人为强行改变。\n——《庄子·外篇·骈拇》' },
            
                        // ===== 外篇·马蹄 =====
                        { emoji: '🐎', title: '伯乐治马', subtitle: '及至伯乐，曰：“我善治马。”烧之，剔之，刻之，雒之……马之死者已过半矣。\n白话：伯乐自称善于管马，给马烙印、修剪、刻蹄、套笼头，马却死了大半。违背自然天性的管治反而害生。\n——《庄子·外篇·马蹄》' },
                        { emoji: '🏞️', title: '至德之世，同与禽兽居', subtitle: '同与禽兽居，族与万物并。\n白话：道德最高尚的时代，人与禽兽一起生活，与万物并聚一处，没有君子小人的区别。\n——《庄子·外篇·马蹄》' },
            
                        // ===== 外篇·胠箧 =====
                        { emoji: '📦', title: '盗亦有道', subtitle: '夫妄意室中之藏，圣也；入先，勇也；出后，义也；知可否，知也；分均，仁也。\n白话：盗贼也有他的道德，推断房中藏物是圣，抢先进入是勇，最后退出是义，判定是否可行是智慧，分赃平均是仁。道无所不在。\n——《庄子·外篇·胠箧》' },
                        { emoji: '🧳', title: '窃钩者诛，窃国者侯', subtitle: '彼窃钩者诛，窃国者为诸侯，诸侯之门而仁义存焉。\n白话：偷个腰带钩子就要杀头，篡夺整个国家的却能当诸侯。有权势的人家里仁义就自动贴上了。\n——《庄子·外篇·胠箧》' },
            
                        // ===== 外篇·在宥 =====
                        { emoji: '🛡️', title: '无为而治', subtitle: '故君子不得已而临莅天下，莫若无为。\n白话：君子不得已管理天下时，最好的方法就是顺其自然，不要干扰百姓的正常生活。\n——《庄子·外篇·在宥》' },
            
                        // ===== 外篇·天地 =====
                        { emoji: '🗺️', title: '象罔得玄珠', subtitle: '黄帝游乎赤水之北，登昆仑之丘而南望，还归，遗其玄珠。使知索之而不得，使离朱索之而不得……象罔得之。\n白话：黄帝丢失玄珠，派聪明的离朱、善辩的喫诟都找不回，最后是无心无形的象罔找到了。太刻意反而得不到。\n——《庄子·外篇·天地》' },
            
                        // ===== 外篇·天道 =====
                        { emoji: '🛞', title: '轮扁斫轮', subtitle: '斫轮，徐则甘而不固，疾则苦而不入。不徐不疾，得之于手而应于心，口不能言，有数存焉于其间。\n白话：轮扁做车轮，慢了榫头松滑不牢固，快了榫头紧涩插不进，不快不慢才能得心应手，奥妙无法用言语传达。\n——《庄子·外篇·天道》' },
            
                        // ===== 外篇·天运 =====
                        { emoji: '💃', title: '东施效颦', subtitle: '西施病心而矉其里，其里之丑人见而美之，归亦捧心而矉其里。里人见之，皆避之。\n白话：西施心口痛皱着眉头，丑女东施觉得好看也学着捧心皱眉，结果把邻居吓得躲开。盲目模仿反而更丑。\n——《庄子·外篇·天运》' },
            
                        // ===== 外篇·刻意 =====
                        { emoji: '💨', title: '吹呴呼吸，吐故纳新', subtitle: '吹呴呼吸，吐故纳新，熊经鸟申，为寿而已矣。此导引之士，养形之人，彭祖寿考者之所好也。\n白话：呼吸吐纳、活动筋骨，不过是延年益寿的养生之术罢了。刻意雕琢并非真正的道。\n——《庄子·外篇·刻意》' },
            
                        // ===== 外篇·缮性 =====
                        { emoji: '🎭', title: '丧己于物，失性于俗', subtitle: '谓之倒置之民。\n白话：把自己丧失在物欲里，把本性丢失在世俗中，这样的人叫做本末倒置的人。\n——《庄子·外篇·缮性》' },
            
                        // ===== 外篇·秋水 =====
                        { emoji: '🌊', title: '秋水时至，百川灌河', subtitle: '泾流之大，两涘渚崖之间不辩牛马。\n白话：秋天水涨百川汇入黄河，水面宽广到两岸之间分辨不清对岸是牛是马。格局放大便知自身的渺小。\n——《庄子·外篇·秋水》' },
                        { emoji: '🐸', title: '井蛙不可以语于海', subtitle: '夏虫不可以语于冰，曲士不可以语于道。\n白话：井底青蛙无法谈论大海，夏虫不能理解冰雪，见识浅薄的人没法讲大道。人不能被自身局限框住。\n——《庄子·外篇·秋水》' },
                        { emoji: '👟', title: '邯郸学步', subtitle: '且子独不闻夫寿陵余子之学行于邯郸与？未得国能，又失其故行矣，直匍匐而归耳。\n白话：燕国少年去邯郸学走路姿势，没学会赵国人步法，连自己原来走路姿势也忘了，只好爬回去。盲目模仿会失本心。\n——《庄子·外篇·秋水》' },
                        { emoji: '🐟', title: '子非鱼，安知鱼之乐', subtitle: '子非我，安知我不知鱼之乐？\n白话：你又不是鱼怎知鱼的快乐？你也不是我，怎知我不懂鱼的快乐？不要用自己的心揣度他人感受。\n——《庄子·外篇·秋水》' },
                        { emoji: '🎣', title: '庄子钓于濮水', subtitle: '庄子持竿不顾，曰：“吾闻楚有神龟，死已三千岁矣，王巾笥而藏之庙堂之上。此龟者，宁其死为留骨而贵乎？宁其生而曳尾于涂中乎？”\n白话：楚王派人请庄子做官，庄子说宁愿像乌龟在泥里活着摇尾巴，也不愿死后被供奉在庙堂上。\n——《庄子·外篇·秋水》' },
                        { emoji: '🦩', title: '惠子相梁', subtitle: '庄子往见之，曰：“南方有鸟，其名为鹓鶵，子知之乎？夫鹓鶵发于南海而飞于北海，非梧桐不止，非练实不食，非醴泉不饮。于是鸱得腐鼠，鹓鶵过之，仰而视之曰‘吓！’今子欲以子之梁国而吓我邪？”\n白话：惠子在梁国为相，怕庄子取代他。庄子说我像凤凰非梧桐不栖，你那梁国相位不过是只死老鼠，少来吓我。\n——《庄子·外篇·秋水》' },
                        { emoji: '☯️', title: '知道者必达于理，达于理者必明于权', subtitle: '明于权者不以物害己。\n白话：懂得大道的必通达物理，通达物理的必能随机应变，能随机应变就不会受外物伤害。\n——《庄子·外篇·秋水》' },
                        { emoji: '🚫', title: '以道观之，物无贵贱', subtitle: '以物观之，自贵而相贱。\n白话：从道的角度看待一切，事物没有贵贱差别。但在世俗眼光里总觉得自己高贵、别人下贱。\n——《庄子·外篇·秋水》' },
            
                        // ===== 外篇·至乐 =====
                        { emoji: '💀', title: '庄子妻死，鼓盆而歌', subtitle: '人且偃然寝于巨室，而我噭噭然随而哭之，自以为不通乎命，故止也。\n白话：妻子刚去世，庄子敲着瓦盆唱歌。死亡是回到天地这个大屋安睡，又哭又叫是不懂命运的安排。\n——《庄子·外篇·至乐》' },
                        { emoji: '🦴', title: '髑髅之乐', subtitle: '髑髅曰：“死，无君于上，无臣于下，亦无四时之事，从然以天地为春秋，虽南面王乐，不能过也。”\n白话：庄子见路旁骷髅，问它怎么死的，夜梦骷髅说死后的快乐胜过当国王，不用操心人间忧劳。\n——《庄子·外篇·至乐》' },
                        { emoji: '🐦', title: '海鸟止于鲁郊', subtitle: '鲁侯御而觞之于庙，奏九韶以为乐，具太牢以为膳，鸟乃眩视忧悲，不敢食一脔。\n白话：鲁侯用待客最高礼仪招待海鸟，奏乐献酒牛羊供养，鸟反而眼晕心悲不敢啄食。各安天性才是真爱。\n——《庄子·外篇·至乐》' },
            
                        // ===== 外篇·达生 =====
                        { emoji: '⚡', title: '用志不分，乃凝于神', subtitle: '虽天地之大，万物之多，而唯蜩翼之知。\n白话：用心专一，能达到凝神的地步。天地虽大万物虽多，只专注于蝉翼一样的小东西便能得心应手。\n——《庄子·外篇·达生》' },
                        { emoji: '🐔', title: '呆若木鸡', subtitle: '纪渻子为王养斗鸡……望之似木鸡矣，其德全矣，异鸡无敢应者，反走矣。\n白话：训练斗鸡到最后，鸡像木头雕的一样纹丝不动，但精神凝聚，别的鸡见了掉头就跑。大智若愚，沉静胜于浮躁。\n——《庄子·外篇·达生》' },
                        { emoji: '🎻', title: '梓庆削木为鐻', subtitle: '臣将为鐻，未尝敢以耗气也，必齐以静心。齐三日，而不敢怀庆赏爵禄；齐五日，不敢怀非誉巧拙；齐七日，辄然忘吾有四枝形体也。\n白话：梓庆制作乐器前先斋戒静心，忘掉名利、褒贬、自身存在，然后入山林观察天性，才能做出天成的器物。\n——《庄子·外篇·达生》' },
            
                        // ===== 外篇·山木 =====
                        { emoji: '🤝', title: '君子之交淡若水', subtitle: '小人之交甘若醴；君子淡以亲，小人甘以绝。\n白话：君子间的交往平淡如水却感情亲密长远，小人交往如甜酒但容易断绝。平淡真实的交情比热烈的利益之交持久。\n——《庄子·外篇·山木》' },
                        { emoji: '🌲', title: '直木先伐，甘井先竭', subtitle: '直木先伐，甘井先竭。\n白话：笔直的木料会先被砍伐，甘甜的井水会先被汲干。才华太露反而容易遇害，韬光养晦是生存智慧。\n——《庄子·外篇·山木》' },
                        { emoji: '🌳', title: '材与不材之间', subtitle: '周将处乎材与不材之间。材与不材之间，似之而非也，故未免乎累。\n白话：庄子说处在成材和不成材之间最安全，但这也是拘泥，最好的状态是顺应世道而逍遥自得。\n——《庄子·外篇·山木》' },
                        { emoji: '🦗', title: '螳螂捕蝉，黄雀在后', subtitle: '睹一蝉，方得美荫而忘其身；螳螂执翳而搏之，见得而忘其形；异鹊从而利之，见利而忘其真。\n白话：庄子见螳螂想捕蝉，黄雀在后想叼螳螂，都是只顾眼前利益而忘了身后的危险。\n——《庄子·外篇·山木》' },
                        { emoji: '🕊️', title: '林回弃璧', subtitle: '假人之亡，林回弃千金之璧，负赤子而趋。或曰：“为其布与？赤子之布寡矣；为其累与？赤子之累多矣。弃千金之璧，负赤子而趋，何也？”林回曰：“彼以利合，此以天属也。”\n白话：林回逃难时扔掉价值千金的玉璧，却背着婴儿跑。别人问财不够重吗？他说玉璧是因为利益而结合，婴儿是天性骨肉相连。\n——《庄子·外篇·山木》' },
            
                        // ===== 外篇·田子方 =====
                        { emoji: '👀', title: '目击而道存', subtitle: '仲尼见之而不言。子路曰：“吾子欲见温伯雪子久矣，见之而不言，何邪？”仲尼曰：“若夫人者，目击而道存矣，亦不可以容声矣。”\n白话：孔子见到温伯雪子，两人一言不发，孔子说看一眼就已看到大道在他身上，根本不用再多说话。\n——《庄子·外篇·田子方》' },
            
                        // ===== 外篇·知北游 =====
                        { emoji: '🚽', title: '道在屎溺', subtitle: '东郭子问于庄子曰：“所谓道，恶乎在？”庄子曰：“无所不在。”东郭子曰：“期而后可。”庄子曰：“在蝼蚁。”曰：“何其下邪？”曰：“在稊稗。”曰：“何其愈下邪？”曰：“在瓦甓。”曰：“何其愈甚邪？”曰：“在屎溺。”\n白话：东郭子问庄子道在哪里，庄子说无所不在，从蝼蚁到杂草、瓦片、甚至屎尿里都有道。道不可离万物。\n——《庄子·外篇·知北游》' },
            
                        // ===== 杂篇·庚桑楚 =====
                        { emoji: '🧱', title: '学者，学其所不能学也', subtitle: '学者，学其所不能学也；行者，行其所不能行也；辩者，辩其所不能辩也。\n白话：学习就是要去学那些自己还不懂不会的东西，行为要去做没做过的事，辩论要辩清那些还说不清的道理。\n——《庄子·杂篇·庚桑楚》' },
            
                        // ===== 杂篇·徐无鬼 =====
                        { emoji: '🪓', title: '运斤成风', subtitle: '郢人垩漫其鼻端若蝇翼，使匠石斫之。匠石运斤成风，听而斫之，尽垩而鼻不伤，郢人立不失容。\n白话：木匠挥动大斧带起一阵风，一斧削去楚人鼻尖上薄如蝇翅的白灰，鼻子毫发无伤，那人也面不改色。极致的信任与技艺配合。\n——《庄子·杂篇·徐无鬼》' },
            
                        // ===== 杂篇·则阳 =====
                        { emoji: '🐌', title: '蜗角之争', subtitle: '有国于蜗之左角者，曰触氏；有国于蜗之右角者，曰蛮氏。时相与争地而战，伏尸数万，逐北旬有五日而后反。\n白话：蜗牛左角有个触国，右角有个蛮国，两国为争地盘开战，死伤数万人。用来讽刺诸侯间的战争荒唐可笑。\n——《庄子·杂篇·则阳》' },
            
                        // ===== 杂篇·外物 =====
                        { emoji: '🐟', title: '涸辙之鲋', subtitle: '周顾视车辙中，有鲋鱼焉，曰：“我东海之波臣也，君岂有斗升之水而活我哉？”\n白话：庄周见车辙坑水里有条快干死的鱼，鱼说从东海被冲来，能给一升水救命吗？远水救不了近火。\n——《庄子·杂篇·外物》' },
                        { emoji: '📏', title: '得鱼而忘荃，得意而忘言', subtitle: '荃者所以在鱼，得鱼而忘荃；言者所以在意，得意而忘言。\n白话：竹笼用来捕鱼，捕了鱼就忘了竹笼；语言用来表达意思，领会意思就可以忘掉语言了。不拘泥文字本身。\n——《庄子·杂篇·外物》' },
                        { emoji: '🩸', title: '苌弘化碧', subtitle: '人主莫不欲其臣之忠，而忠未必信，故伍员流于江，苌弘死于蜀，藏其血三年而化为碧。\n白话：国君都希望大臣忠心，但忠心往往不受信任，苌弘被杀后，血藏了三年化成碧玉。忠心被冤埋也会发光。\n——《庄子·杂篇·外物》' },
            
                        // ===== 杂篇·寓言 =====
                        { emoji: '🗣️', title: '寓言十九，重言十七', subtitle: '寓言十九，藉外论之。亲父不为其子媒。亲父誉之，不若非其父者也。\n白话：《庄子》里十分之九是寓言，借用别人的故事来说明道理。父亲夸儿子别人不信，外人夸效果就好得多。\n——《庄子·杂篇·寓言》' },
            
                        // ===== 杂篇·让王 =====
                        { emoji: '🌄', title: '日出而作，日入而息', subtitle: '逍遥于天地之间而心意自得。\n白话：太阳升起就劳作，夕阳西下便安歇，逍遥自在地处在天地中间，心情十分舒畅。这是至简生活的自在。\n——《庄子·杂篇·让王》' },
                        { emoji: '🏅', title: '屠羊说不受赏', subtitle: '屠羊说曰：“大王失国，非臣之罪，故不敢伏其诛；大王反国，非臣之功，故不敢当其赏。”\n白话：楚昭王复国后要赏赐屠羊说，他说大王逃难不是我的罪过，重返王位不是我的功劳，推掉赏赐回乡继续宰羊。\n——《庄子·杂篇·让王》' },
            
                        // ===== 杂篇·盗跖 =====
                        { emoji: '📛', title: '尾生抱柱', subtitle: '尾生与女子期于梁下，女子不来，水至不去，抱梁柱而死。\n白话：尾生与女子相约桥下，女子不来洪水来了也不肯离开，结果抱着柱子淹死了。守信太过也是迂腐。\n——《庄子·杂篇·盗跖》' },
            
                        // ===== 杂篇·说剑 =====
                        { emoji: '🗡️', title: '天子之剑，诸侯之剑，庶人之剑', subtitle: '有天子剑，有诸侯剑，有庶人剑。……庶人之剑，蓬头突鬓，垂冠，曼胡之缨，短后之衣，瞋目而语难。相击于前，上斩颈领，下决肝肺。\n白话：庄子用剑法比喻王道与霸道。庶人剑只会蛮斗逞凶，天子剑能匡正诸侯天下归服。\n——《庄子·杂篇·说剑》' },
            
                        // ===== 杂篇·渔父 =====
                        { emoji: '🤝', title: '真者，精诚之至也', subtitle: '不精不诚，不能动人。故强哭者虽悲不哀，强怒者虽严不威，强亲者虽笑不和。\n白话：真诚是修行和待人的最高原则，虚情假意无法打动人心。勉强装出来的悲怒亲善都没有真实力量。\n——《庄子·杂篇·渔父》' },
            
                        // ===== 杂篇·列御寇 =====
                        { emoji: '🐉', title: '朱泙漫学屠龙', subtitle: '单千金之家，三年技成，而无所用其巧。\n白话：朱泙漫散尽千金学屠龙之术，苦学三年学成了，却发现世上根本没有龙可屠。学而无用等于白费力。\n——《庄子·杂篇·列御寇》' },
                        { emoji: '🪢', title: '以随侯之珠弹千仞之雀', subtitle: '世必笑之，所用者重而所要者轻也。\n白话：拿价值连城的随侯宝珠去打千里高空的麻雀，世人也会嘲笑他付出重价换取小利的行为。\n——《庄子·杂篇·列御寇》' },
            
                        // ===== 杂篇·天下 =====
                        { emoji: '🌐', title: '万物毕同毕异', subtitle: '大同而与小同异，此之谓小同异；万物毕同毕异，此之谓大同异。\n白话：事物有大类相同和小类相同的区别，而万物从根本上既完全相同也完全相异，这才是真正的大同异。\n——《庄子·杂篇·天下》' },
                        { emoji: '📏', title: '一尺之棰，日取其半', subtitle: '一尺之棰，日取其半，万世不竭。\n白话：一尺长的木棒，每天截取一半，永远也截不完。说明物质无限可分，道理也无穷无尽。\n——《庄子·杂篇·天下》' }
                    ]
                },
            };
            let BOOK2 = {};
            let BOOK3 = {};
            const BOOKS = { ...BOOK1, ...BOOK2, ...BOOK3 };

            const SITE_MAIN_TITLE = "人生卡壳，翻翻名册";
            let currentBookKey = "毛泽东选集";
            let currentCardList = [];
            let currentCardIndex = 0;
            let drawCount = 0;
            let hasEntered = false;
            let isAnimating = false;
            let toastTimer = null;
            let msgToastTimer = null;
            let recentIndices = [];
            let cardHeightSet = false;
            let lastSetCardHeight = 0;

            const AUTHOR_CONTACT_QR_URL = "https://u.wechat.com/EEbI8vq4ZJps9mAGeDgnWIs?s=2";
            const AUTHOR_CONTACT_QR = "https://quickchart.io/qr?text=" + encodeURIComponent(
            AUTHOR_CONTACT_QR_URL) + "&size=300&margin=2&ecLevel=H";

            const root = document.documentElement;
            const introScreen = document.getElementById('introScreen');
            const mainApp = document.getElementById('mainApp');
            const cardContentEl = document.getElementById('cardContent');
            const cardEmojiEl = document.getElementById('cardEmoji');
            const cardTitleEl = document.getElementById('cardTitle');
            const cardSubtitleEl = document.getElementById('cardSubtitle');
            const drawBtn = document.getElementById('drawBtn');
            const btnTextEl = document.getElementById('btnText');
            const btnWrapper = document.getElementById('btnWrapper');
            const counterEl = document.getElementById('counter');
            const counterNumEl = document.getElementById('counterNum');
            const cardEl = document.getElementById('card');
            const copyToast = document.getElementById('copyToast');
            const messageToast = document.getElementById('messageToast');
            const cardCopyArea = document.getElementById('cardCopyArea');
            const dynamicSubTitle = document.getElementById('dynamicSubTitle');
            const cardBadge = document.getElementById('cardBadge');
            const introBookName = document.getElementById('introBookName');
            const introDesc = document.getElementById('introDesc');
            const introEmoji = document.getElementById('introEmoji');
            const qrMiniImg = document.getElementById('qrMiniImg');
            const bookSelector = document.getElementById('bookSelector');
            const titleGroupTrigger = document.getElementById('titleGroupTrigger');
            const bookSearchInput = document.getElementById('bookSearchInput');
            const bookStats = document.getElementById('bookStats');
            const selectorWrapper = document.getElementById('bookSelectorWrapper');
            const suggestModal = document.getElementById('suggestModal');
            const suggestQrImg = document.getElementById('suggestQrImg');
            const closeSuggestBtn = document.getElementById('closeSuggestBtn');
            const qrLightbox = document.getElementById('qrLightbox');
            const qrLightboxImg = document.getElementById('qrLightboxImg');
            const closeLightboxBtn = document.getElementById('closeLightboxBtn');
            const bookTitleDecorEl = document.getElementById('bookTitleDecor');
            const introCard = document.getElementById('introCard');

            function updateFadeVisibility() {
                if (!selectorWrapper || !bookSelector) return;
                const isScrollable = bookSelector.scrollHeight > bookSelector.clientHeight;
                if (isScrollable) selectorWrapper.classList.add('scrollable');
                else selectorWrapper.classList.remove('scrollable');
            }

            const defaultTheme = { r: 180, g: 35, b: 35 };

            function updateThemeByEmoji(emoji) {
                let theme = defaultTheme;
                if (emoji === '🔥') theme = { r: 210, g: 55, b: 30 };
                else if (emoji === '⚡') theme = { r: 185, g: 85, b: 35 };
                else if (emoji === '☰') theme = { r: 180, g: 35, b: 35 };
                root.style.setProperty('--theme-r', theme.r);
                root.style.setProperty('--theme-g', theme.g);
                root.style.setProperty('--theme-b', theme.b);
                root.style.setProperty('--card-bg-r', 255);
                root.style.setProperty('--card-bg-g', 248);
                root.style.setProperty('--card-bg-b', 240);
                root.style.setProperty('--card-bg-alpha', '0.92');
            }

            function updateCardDOM(card) {
                if (!card) return;
                cardEmojiEl.textContent = card.emoji;
                cardTitleEl.textContent = card.title;
                cardSubtitleEl.textContent = card.subtitle;
                updateThemeByEmoji(card.emoji);
            }

            function getRandomCardIndexAvoidRecent() {
                if (!currentCardList.length) return 0;
                const total = currentCardList.length;
                if (total <= 3) return Math.floor(Math.random() * total);
                const forbidSet = new Set(recentIndices);
                const candidates = [];
                for (let i = 0; i < total; i++) if (!forbidSet.has(i)) candidates.push(i);
                if (candidates.length === 0) return Math.floor(Math.random() * total);
                return candidates[Math.floor(Math.random() * candidates.length)];
            }

            function recordRecentIndex(idx) {
                recentIndices.push(idx);
                while (recentIndices.length > 3) recentIndices.shift();
            }

            function updateBookStats() {
                const total = Object.keys(BOOKS).length;
                const searchTerm = bookSearchInput ? bookSearchInput.value.trim().toLowerCase() : '';
                if (!searchTerm) bookStats.textContent = `共 ${total} 本典籍`;
                else {
                    const filtered = Object.keys(BOOKS).filter(key => BOOKS[key].name.toLowerCase().includes(
                    searchTerm));
                    bookStats.textContent = `找到 ${filtered.length} 本（共 ${total} 本）`;
