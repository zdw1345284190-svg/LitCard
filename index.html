<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人生卡壳，翻翻名册 · 毛泽东选集名言卡片</title>
    <style>
        :root {
            --bg-from: #f5f0e8;
            --bg-via: #efe8dc;
            --bg-to: #e8dfd0;
            --text-title: #1a1008;
            --text-sub: #5c4a36;
            --text-counter: #9e8b78;
            --accent-dot: #c0392b;
            --btn-text: #fdf8f0;
            /* 默认主题色 - 深红 */
            --theme-r: 180;
            --theme-g: 35;
            --theme-b: 35;
            /* 卡片背景色变量 */
            --card-bg-r: 255;
            --card-bg-g: 248;
            --card-bg-b: 240;
            --card-bg-alpha: 1;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            background: linear-gradient(160deg, var(--bg-from) 0%, var(--bg-via) 40%, var(--bg-to) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            transition: background 0.8s ease;
        }

        /* 背景装饰光斑 - 随主题色变化 */
        .bg-orb {
            position: fixed;
            border-radius: 50%;
            pointer-events: none;
            z-index: 0;
            filter: blur(90px);
            transition: background 0.8s ease;
        }
        .bg-orb--top {
            width: 480px;
            height: 480px;
            background: radial-gradient(circle, rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.3) 0%, transparent 70%);
            top: -200px;
            right: -140px;
            opacity: 0.4;
        }
        .bg-orb--bottom {
            width: 360px;
            height: 360px;
            background: radial-gradient(circle, rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.25) 0%, transparent 70%);
            bottom: -160px;
            left: -120px;
            opacity: 0.35;
        }
        .bg-orb--mid {
            width: 220px;
            height: 220px;
            background: radial-gradient(circle, rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.18) 0%, transparent 70%);
            top: 45%;
            left: 50%;
            opacity: 0.28;
        }

        /* 左上角书名装饰 - 更显眼 */
        .book-title-decor {
            position: fixed;
            top: clamp(20px, 4vh, 36px);
            left: clamp(24px, 5vw, 48px);
            z-index: 10;
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 10px;
            opacity: 0.85;
        }
        .book-title-decor .star-icon {
            font-size: 1.6rem;
            color: rgb(var(--theme-r), var(--theme-g), var(--theme-b));
            transition: color 0.8s ease;
            animation: starPulse 4s ease-in-out infinite;
            filter: drop-shadow(0 2px 6px rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.3));
        }
        @keyframes starPulse {
            0%,
            100% {
                opacity: 0.6;
                transform: scale(1);
            }
            50% {
                opacity: 1;
                transform: scale(1.2);
            }
        }
        .book-title-text {
            font-family: 'Songti SC', 'STSong', 'Noto Serif SC', 'KaiTi', 'STKaiti', serif;
            font-size: clamp(1.2rem, 2.2vw, 1.6rem);
            font-weight: 700;
            color: rgb(var(--theme-r), var(--theme-g), var(--theme-b));
            letter-spacing: 0.08em;
            transition: color 0.8s ease;
            text-shadow: 0 1px 3px rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.15);
        }
        .book-title-sub {
            font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif;
            font-size: 0.75rem;
            font-weight: 500;
            color: rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.7);
            letter-spacing: 0.1em;
            margin-top: 1px;
            transition: color 0.8s ease;
        }

        /* 封面 */
        .intro-screen {
            position: fixed;
            inset: 0;
            z-index: 50;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            transition: opacity 0.7s ease, visibility 0.7s ease;
            opacity: 1;
            visibility: visible;
            cursor: pointer;
            pointer-events: all;
            background: linear-gradient(160deg, #f7f3eb 0%, #f2ece1 40%, #ebe3d5 100%);
        }
        .intro-screen.fade-out {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .intro-card {
            background: #ffffff;
            border-radius: 36px;
            padding: 48px 44px 64px;
            max-width: 600px;
            width: 88vw;
            box-shadow: 0 4px 20px rgba(60, 40, 20, 0.07),
                0 12px 48px rgba(60, 40, 20, 0.1),
                0 28px 80px rgba(60, 40, 20, 0.08);
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            animation: cardEntry 0.8s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
            border-left: 5px solid #c0392b;
        }
        .intro-emoji {
            font-size: clamp(4.5rem, 11vw, 6.5rem);
            display: block;
            animation: emojiFloat 3s ease-in-out infinite;
            filter: drop-shadow(0 4px 12px rgba(180, 35, 35, 0.2));
        }
        .intro-book-name {
            font-family: 'Songti SC', 'STSong', 'Noto Serif SC', 'KaiTi', serif;
            font-size: clamp(1.4rem, 3vw, 2rem);
            font-weight: 700;
            color: #c0392b;
            letter-spacing: 0.12em;
            background: linear-gradient(135deg, #a32222, #c0392b);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .intro-title {
            font-family: 'Songti SC', 'STSong', 'Noto Serif SC', serif;
            font-size: clamp(1.8rem, 4.5vw, 2.6rem);
            font-weight: 700;
            color: var(--text-title);
            letter-spacing: 0.05em;
            line-height: 1.3;
        }
        .intro-divider {
            width: 48px;
            height: 4px;
            border-radius: 2px;
            background: linear-gradient(90deg, #c0392b, #e67e22);
            opacity: 0.8;
        }
        .intro-subtitle {
            font-size: clamp(0.95rem, 1.6vw, 1.1rem);
            color: var(--text-sub);
            line-height: 1.7;
            opacity: 0.85;
            max-width: 400px;
        }
        .intro-hint {
            margin-top: 32px;
            font-size: 0.95rem;
            color: #c0392b;
            letter-spacing: 0.06em;
            animation: hintBlink 2s ease-in-out infinite;
            font-weight: 500;
            background: rgba(192, 57, 43, 0.06);
            padding: 10px 24px;
            border-radius: 30px;
        }
        @keyframes hintBlink {
            0%,
            100% {
                opacity: 0.5;
                transform: translateY(0);
            }
            50% {
                opacity: 1;
                transform: translateY(-4px);
            }
        }
        @keyframes cardEntry {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        @keyframes emojiFloat {
            0%,
            100% {
                transform: translateY(0);
            }
            30% {
                transform: translateY(-12px);
            }
            60% {
                transform: translateY(-5px);
            }
        }

        /* 主界面 */
        .main-app {
            position: relative;
            z-index: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            transition: opacity 0.7s ease;
            opacity: 0;
            pointer-events: none;
        }
        .main-app.visible {
            opacity: 1;
            pointer-events: all;
        }

        /* 卡片 - 背景色随图标变化 */
        .card {
            position: relative;
            width: 92vw;
            max-width: 700px;
            height: 75vh;
            height: 75dvh;
            min-height: 420px;
            max-height: 650px;
            background: rgba(var(--card-bg-r), var(--card-bg-g), var(--card-bg-b), var(--card-bg-alpha));
            border-radius: 32px;
            box-shadow: 0 4px 24px rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.08),
                0 12px 48px rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.1),
                0 28px 80px rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.07);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px 36px 100px;
            animation: cardEntry 0.7s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
            border-left: 6px solid rgb(var(--theme-r), var(--theme-g), var(--theme-b));
            border-right: 1px solid rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.1);
            border-top: 1px solid rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.06);
            border-bottom: 1px solid rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.08);
            transition: background 0.8s ease, border-left-color 0.8s ease, box-shadow 0.5s ease,
                border-right-color 0.8s ease, border-top-color 0.8s ease, border-bottom-color 0.8s ease;
        }
        .card.glow {
            border-left-color: rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.7);
            box-shadow: 0 4px 24px rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.12),
                0 12px 56px rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.15),
                0 32px 96px rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.1),
                0 0 0 2px rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.15),
                0 0 100px rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.12);
            transition: border-left-color 0.3s ease, box-shadow 0.3s ease;
        }

        .card__content {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            gap: 0;
            transition: opacity 0.12s ease, transform 0.12s ease;
            opacity: 1;
            transform: scale(1);
            width: 100%;
        }
        .card__content.hiding {
            opacity: 0;
            transform: scale(0.93);
            transition: opacity 0.08s ease, transform 0.08s ease;
        }

        .card__emoji {
            font-size: clamp(3.5rem, 8vw, 5.5rem);
            line-height: 1;
            margin-bottom: clamp(18px, 3.5vh, 30px);
            display: block;
            animation: emojiFloat 3s ease-in-out infinite;
            filter: drop-shadow(0 6px 16px rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.25));
        }
        .card__title {
            font-family: 'Songti SC', 'STSong', 'Noto Serif SC', 'SimSun', 'KaiTi', 'STKaiti', serif;
            font-size: clamp(1.5rem, 3.8vw, 2.5rem);
            font-weight: 700;
            color: var(--text-title);
            line-height: 1.35;
            letter-spacing: 0.05em;
            max-width: 100%;
            word-break: keep-all;
            overflow-wrap: break-word;
            margin-bottom: clamp(14px, 2.5vh, 22px);
        }
        .card__divider {
            width: 40px;
            height: 4px;
            border-radius: 2px;
            background: rgb(var(--theme-r), var(--theme-g), var(--theme-b));
            opacity: 0.6;
            margin-bottom: clamp(14px, 2.5vh, 22px);
            transition: background 0.8s ease;
        }
        .card__subtitle {
            font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', system-ui, sans-serif;
            font-size: clamp(0.88rem, 1.5vw, 1.05rem);
            font-weight: 400;
            color: var(--text-sub);
            line-height: 1.7;
            letter-spacing: 0.02em;
            max-width: 440px;
            opacity: 0.8;
            white-space: pre-line;
        }

        /* 卡片内的书名标识 */
        .card__book-badge {
            position: absolute;
            top: clamp(16px, 3vh, 24px);
            right: clamp(16px, 3vw, 28px);
            font-family: 'Songti SC', 'STSong', 'Noto Serif SC', 'KaiTi', serif;
            font-size: 0.8rem;
            font-weight: 700;
            color: rgb(var(--theme-r), var(--theme-g), var(--theme-b));
            letter-spacing: 0.08em;
            opacity: 0.7;
            transition: color 0.8s ease;
            background: rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.06);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.15);
        }

        .counter {
            position: fixed;
            top: clamp(24px, 5vh, 40px);
            right: clamp(24px, 5vw, 48px);
            z-index: 10;
            font-family: 'SF Mono', 'JetBrains Mono', 'Menlo', 'Consolas', 'Courier New', monospace;
            font-size: 0.8rem;
            color: var(--text-counter);
            letter-spacing: 0.06em;
            display: flex;
            align-items: center;
            gap: 8px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.4s ease;
            background: rgba(255, 255, 255, 0.7);
            padding: 8px 16px;
            border-radius: 20px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .counter.active {
            opacity: 1;
        }
        .counter__dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: rgb(var(--theme-r), var(--theme-g), var(--theme-b));
            opacity: 0.8;
            animation: dotPulse 2s ease-in-out infinite;
            transition: background 0.8s ease;
        }
        @keyframes dotPulse {
            0%,
            100% {
                opacity: 0.4;
                transform: scale(0.7);
            }
            50% {
                opacity: 1;
                transform: scale(1.4);
            }
        }

        .btn-wrapper {
            position: fixed;
            bottom: clamp(28px, 5vh, 48px);
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease 0.3s;
        }
        .btn-wrapper.active {
            opacity: 1;
            pointer-events: all;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 17px 40px;
            font-family: 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans SC', system-ui, sans-serif;
            font-size: 1.1rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            color: #ffffff;
            background: rgb(var(--theme-r), var(--theme-g), var(--theme-b));
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 32px rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.35);
            transition: all 0.35s cubic-bezier(0.25, 0.1, 0.25, 1), background 0.8s ease;
            position: relative;
            overflow: hidden;
            white-space: nowrap;
            animation: btnFloat 3.5s ease-in-out infinite;
            -webkit-tap-highlight-color: transparent;
            outline: none;
            min-width: 190px;
        }
        @keyframes btnFloat {
            0%,
            100% {
                transform: translateY(0);
            }
            35% {
                transform: translateY(-8px);
            }
            65% {
                transform: translateY(-3px);
            }
        }
        .btn:hover {
            background: rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.82);
            box-shadow: 0 12px 40px rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.5);
            transform: translateY(-3px);
            animation-play-state: paused;
        }
        .btn:active {
            background: rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.65);
            box-shadow: 0 4px 16px rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.4);
            transform: translateY(1px) scale(0.96);
            transition: all 0.1s ease;
            animation-play-state: paused;
        }
        .btn:focus-visible {
            outline: 3px solid rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.6);
            outline-offset: 5px;
        }
        .btn__ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.25);
            transform: scale(0);
            animation: ripple 0.6s ease-out forwards;
            pointer-events: none;
        }
        @keyframes ripple {
            to {
                transform: scale(4);
                opacity: 0;
            }
        }
        .btn:disabled {
            cursor: not-allowed;
            opacity: 0.65;
            animation-play-state: paused;
            pointer-events: none;
        }
        .btn:disabled:hover {
            background: rgb(var(--theme-r), var(--theme-g), var(--theme-b));
            box-shadow: 0 8px 32px rgba(var(--theme-r), var(--theme-g), var(--theme-b), 0.35);
            transform: none;
        }
        .btn__icon {
            display: inline-block;
            font-size: 1.3rem;
            transition: transform 0.3s ease;
        }
        .btn:not(:disabled):hover .btn__icon {
            transform: rotate(-15deg) scale(1.15);
        }
        .btn:disabled .btn__icon {
            animation: spinIcon 0.6s linear infinite;
        }
        @keyframes spinIcon {
            to {
                transform: rotate(360deg);
            }
        }

        @media (max-width: 480px) {
            .intro-card {
                padding: 32px 22px 48px;
                border-radius: 28px;
            }
            .card {
                width: 94vw;
                height: 72dvh;
                min-height: 360px;
                border-radius: 24px;
                padding: 36px 22px 90px;
            }
            .btn {
                padding: 15px 30px;
                font-size: 1rem;
                min-width: 160px;
                border-radius: 44px;
            }
            .bg-orb--top {
                width: 280px;
                height: 280px;
                top: -130px;
                right: -90px;
            }
            .bg-orb--bottom {
                width: 220px;
                height: 220px;
                bottom: -110px;
                left: -80px;
            }
            .bg-orb--mid {
                width: 130px;
                height: 130px;
            }
            .book-title-decor {
                top: 14px;
                left: 16px;
                gap: 6px;
            }
            .book-title-text {
                font-size: 1rem;
            }
            .card__book-badge {
                font-size: 0.7rem;
                padding: 4px 10px;
            }
        }
        @media (min-width: 1200px) {
            .card {
                max-width: 750px;
                height: 70dvh;
                max-height: 680px;
                border-radius: 36px;
                padding: 52px 52px 120px;
            }
        }
        @media (max-height: 500px) {
            .intro-card {
                padding: 20px 20px 32px;
            }
            .card {
                height: 82dvh;
                min-height: 300px;
                padding: 16px 20px 75px;
                border-radius: 20px;
            }
            .card__emoji {
                font-size: 2.4rem;
                margin-bottom: 8px;
            }
            .card__title {
                font-size: 1.2rem;
                margin-bottom: 6px;
            }
            .card__divider {
                margin-bottom: 8px;
                width: 28px;
                height: 3px;
            }
            .card__subtitle {
                font-size: 0.8rem;
            }
            .btn {
                padding: 10px 24px;
                font-size: 0.9rem;
            }
            .card__book-badge {
                font-size: 0.65rem;
                top: 10px;
                right: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="bg-orb bg-orb--top" aria-hidden="true"></div>
    <div class="bg-orb bg-orb--bottom" aria-hidden="true"></div>
    <div class="bg-orb bg-orb--mid" aria-hidden="true"></div>

    <!-- 左上角书名标识 -->
    <div class="book-title-decor" aria-hidden="true">
        <span class="star-icon">★</span>
        <div>
            <div class="book-title-text">毛泽东选集</div>
            <div class="book-title-sub">名言卡片集</div>
        </div>
    </div>

    <!-- 封面 -->
    <div class="intro-screen" id="introScreen">
        <div class="intro-card">
            <span class="intro-emoji" aria-hidden="true">📕</span>
            <div class="intro-book-name">毛泽东选集</div>
            <h1 class="intro-title">人生卡壳，翻翻名册</h1>
            <div class="intro-divider" aria-hidden="true"></div>
            <p class="intro-subtitle">经典名言卡片集<br>汲取智慧，砥砺前行</p>
            <p class="intro-hint">✨ 点击任意位置翻开书页</p>
        </div>
    </div>

    <!-- 主界面 -->
    <div class="main-app" id="mainApp">
        <div class="counter" id="counter" aria-live="polite">
            <span class="counter__dot" aria-hidden="true"></span>
            <span>已抽取&nbsp;<strong id="counterNum">0</strong>&nbsp;次</span>
        </div>

        <main class="card" id="card" role="region" aria-label="毛选名言卡片展示区">
            <div class="card__book-badge">毛泽东选集</div>
            <div class="card__content" id="cardContent">
                <span class="card__emoji" id="cardEmoji">📕</span>
                <h1 class="card__title" id="cardTitle">点击下方按钮</h1>
                <div class="card__divider" aria-hidden="true"></div>
                <p class="card__subtitle" id="cardSubtitle">抽取一张毛选名言卡片</p>
            </div>
        </main>

        <div class="btn-wrapper" id="btnWrapper">
            <button class="btn" id="drawBtn" title="随机抽取一张毛选名言卡片" aria-label="随机抽取卡片">
                <span class="btn__icon" aria-hidden="true">🎲</span>
                <span id="btnText">随机抽取</span>
            </button>
        </div>
    </div>

    <script>
        (function() {
            // 图标 -> 主题色 + 卡片背景色 映射
            const emojiColorMap = {
                '🔥': { theme: { r: 210, g: 55, b: 30 }, cardBg: { r: 255, g: 242, b: 237 } }, // 火焰红 -> 浅粉红卡片
                '📋': { theme: { r: 70, g: 105, b: 140 }, cardBg: { r: 238, g: 245, b: 252 } }, // 沉稳蓝灰 -> 浅蓝卡片
                '🐯': { theme: { r: 205, g: 135, b: 40 }, cardBg: { r: 255, g: 248, b: 232 } }, // 虎纹金 -> 暖金卡片
                '🎯': { theme: { r: 185, g: 35, b: 35 }, cardBg: { r: 255, g: 238, b: 238 } }, // 靶心红 -> 浅红卡片
                '🤝': { theme: { r: 55, g: 125, b: 95 }, cardBg: { r: 237, g: 252, b: 244 } }, // 信任绿 -> 浅绿卡片
                '🌾': { theme: { r: 155, g: 130, b: 60 }, cardBg: { r: 255, g: 251, b: 238 } }, // 麦穗金 -> 米金卡片
                '♟️': { theme: { r: 65, g: 65, b: 75 }, cardBg: { r: 242, g: 242, b: 246 } }, // 战略深灰 -> 浅灰卡片
                '🔍': { theme: { r: 45, g: 85, b: 140 }, cardBg: { r: 236, g: 244, b: 255 } }, // 探索蓝 -> 淡蓝卡片
                '🏔️': { theme: { r: 90, g: 120, b: 140 }, cardBg: { r: 240, g: 246, b: 250 } }, // 山峰青 -> 青灰卡片
                '⏰': { theme: { r: 175, g: 115, b: 55 }, cardBg: { r: 255, g: 245, b: 235 } }, // 光阴铜 -> 暖铜卡片
                '👥': { theme: { r: 115, g: 70, b: 125 }, cardBg: { r: 248, g: 242, b: 252 } }, // 群众紫 -> 浅紫卡片
                '⚔️': { theme: { r: 145, g: 55, b: 45 }, cardBg: { r: 255, g: 240, b: 238 } } // 刀锋红褐 -> 浅褐红卡片
            };

            const cards = [
                { emoji: '🔥', title: '星星之火，可以燎原', subtitle: '革命力量虽小，但发展壮大是必然趋势。\n——《星星之火，可以燎原》1930年' },
                { emoji: '📋', title: '没有调查，就没有发言权', subtitle: '一切结论产生于调查情况的末尾，而不是先头。\n——《反对本本主义》1930年' },
                { emoji: '🐯', title: '一切反动派都是纸老虎', subtitle: '看起来可怕，实际上经不起人民力量的一击。\n——1946年会见安娜·路易斯·斯特朗' },
                { emoji: '🎯', title: '实事求是', subtitle: '从实际出发，探求事物的客观规律，不凭主观想象。\n——延安整风运动核心思想' },
                { emoji: '🤝', title: '为人民服务', subtitle: '人固有一死，或重于泰山，或轻于鸿毛。\n——《为人民服务》1944年' },
                { emoji: '🌾', title: '自己动手，丰衣足食', subtitle: '依靠自身力量克服困难，独立自主艰苦奋斗。\n——大生产运动时期号召' },
                { emoji: '♟️', title: '战略上藐视敌人，战术上重视敌人', subtitle: '既要有必胜的信念，又要慎重对待每一个具体问题。\n——军事斗争重要策略思想' },
                { emoji: '🔍', title: '虚心使人进步，骄傲使人落后', subtitle: '戒骄戒躁，永远保持谦逊学习的态度。\n——1956年中国共产党第八次全国代表大会开幕词' },
                { emoji: '🏔️', title: '前途是光明的，道路是曲折的', subtitle: '坚定信念的同时，也要做好战胜困难的充分准备。\n——《论联合政府》1945年' },
                { emoji: '⏰', title: '一万年太久，只争朝夕', subtitle: '抓住当下，分秒必争地去奋斗，不等不靠。\n——《满江红·和郭沫若同志》1963年' },
                { emoji: '👥', title: '群众是真正的英雄', subtitle: '人民群众是历史的创造者，是真正的铜墙铁壁。\n——《〈农村调查〉的序言和跋》1941年' },
                { emoji: '⚔️', title: '在战争中学习战争', subtitle: '实践是最好的老师，干就是学习，边干边学。\n——《中国革命战争的战略问题》1936年' }
            ];

            const root = document.documentElement;
            const introScreen = document.getElementById('introScreen');
            const mainApp = document.getElementById('mainApp');
            const cardContentEl = document.getElementById('cardContent');
            const cardEmojiEl = document.getElementById('cardEmoji');
            const cardTitleEl = document.getElementById('cardTitle');
            const cardSubtitleEl = document.getElementById('cardSubtitle');
            const drawBtn = document.getElementById('drawBtn');
            const btnTextEl = document.getElementById('btnText');
            const btnWrapper = document.getElementById('btnWrapper');
            const counterEl = document.getElementById('counter');
            const counterNumEl = document.getElementById('counterNum');
            const cardEl = document.getElementById('card');

            let isAnimating = false;
            let drawCount = 0;
            let currentCardIndex = 0;
            let hasEntered = false;

            function updateThemeByEmoji(emoji) {
                const colorConfig = emojiColorMap[emoji] || {
                    theme: { r: 180, g: 35, b: 35 },
                    cardBg: { r: 255, g: 240, b: 238 }
                };
                const t = colorConfig.theme;
                const bg = colorConfig.cardBg;

                // 更新主题色
                root.style.setProperty('--theme-r', t.r);
                root.style.setProperty('--theme-g', t.g);
                root.style.setProperty('--theme-b', t.b);

                // 更新卡片背景色
                root.style.setProperty('--card-bg-r', bg.r);
                root.style.setProperty('--card-bg-g', bg.g);
                root.style.setProperty('--card-bg-b', bg.b);
                root.style.setProperty('--card-bg-alpha', '0.92');
            }

            function updateCardDOM(card) {
                cardEmojiEl.textContent = card.emoji;
                cardTitleEl.textContent = card.title;
                cardSubtitleEl.textContent = card.subtitle;
                updateThemeByEmoji(card.emoji);
            }

            function getRandomCardIndex() {
                return Math.floor(Math.random() * cards.length);
            }

            function wait(ms) {
                return new Promise(resolve => setTimeout(resolve, ms));
            }

            function hideContent() {
                return new Promise(resolve => {
                    cardContentEl.classList.add('hiding');
                    setTimeout(resolve, 80);
                });
            }

            function showContent() {
                return new Promise(resolve => {
                    cardContentEl.classList.remove('hiding');
                    setTimeout(resolve, 80);
                });
            }

            function createRipple(event) {
                const btn = event.currentTarget;
                const rect = btn.getBoundingClientRect();
                const ripple = document.createElement('span');
                ripple.classList.add('btn__ripple');
                const size = Math.max(rect.width, rect.height);
                ripple.style.width = size + 'px';
                ripple.style.height = size + 'px';
                ripple.style.left = (event.clientX - rect.left - size / 2) + 'px';
                ripple.style.top = (event.clientY - rect.top - size / 2) + 'px';
                btn.appendChild(ripple);
                ripple.addEventListener('animationend', () => ripple.remove());
            }

            function triggerCardGlow(duration = 700) {
                cardEl.classList.add('glow');
                setTimeout(() => cardEl.classList.remove('glow'), duration);
            }

            async function drawCard() {
                if (isAnimating || !hasEntered) return;
                isAnimating = true;

                drawBtn.disabled = true;
                btnTextEl.textContent = '抽取中...';
                drawBtn.style.animationPlayState = 'paused';

                const finalIndex = getRandomCardIndex();
                let tempIndices = [];
                const switchCount = 5;
                for (let i = 0; i < switchCount; i++) {
                    let idx;
                    do {
                        idx = getRandomCardIndex();
                    } while (idx === currentCardIndex && cards.length > 1 && tempIndices.length === 0);
                    if (i === 0 && idx === currentCardIndex && cards.length > 1) {
                        idx = (currentCardIndex + 1) % cards.length;
                    }
                    tempIndices.push(idx);
                }

                const intervals = [70, 90, 120, 160, 200];
                for (let i = 0; i < switchCount; i++) {
                    await hideContent();
                    updateCardDOM(cards[tempIndices[i]]);
                    currentCardIndex = tempIndices[i];
                    await showContent();
                    if (i < switchCount - 1) {
                        await wait(intervals[i]);
                    }
                }

                await wait(180);
                await hideContent();
                updateCardDOM(cards[finalIndex]);
                currentCardIndex = finalIndex;
                await showContent();

                triggerCardGlow(700);

                drawCount++;
                counterNumEl.textContent = drawCount;

                drawBtn.disabled = false;
                btnTextEl.textContent = '随机抽取';
                drawBtn.style.animationPlayState = 'running';
                isAnimating = false;
            }

            function enterMainApp() {
                if (hasEntered) return;
                hasEntered = true;

                introScreen.classList.add('fade-out');
                mainApp.classList.add('visible');
                btnWrapper.classList.add('active');
                counterEl.classList.add('active');

                currentCardIndex = 0;
                updateCardDOM(cards[0]);
                cardContentEl.classList.add('hiding');

                drawBtn.addEventListener('click', (event) => {
                    createRipple(event);
                    drawCard();
                });
                document.addEventListener('keydown', (event) => {
                    if (event.code === 'Space' || event.code === 'Enter') {
                        if (document.activeElement === drawBtn) return;
                        event.preventDefault();
                        drawBtn.focus();
                        drawCard();
                    }
                });

                drawCard();
            }

            introScreen.addEventListener('click', enterMainApp);
            document.addEventListener('keydown', function openIntro(e) {
                if (hasEntered) return;
                if (e.code === 'F1' || e.code === 'F5' || e.ctrlKey || e.altKey) return;
                e.preventDefault();
                enterMainApp();
            });

            mainApp.classList.remove('visible');
            btnWrapper.classList.remove('active');
            counterEl.classList.remove('active');
        })();
    </script>
</body>
</html>
